[project]
name = "open-health-data-platform"
version = "0.0.0"
description = "Self-hosted analytics platform over public health data"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/shared", "apps/api", "data"]

[tool.uv.sources]
ohdp-shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/dbt/target", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "data"]
addopts = "-q"
