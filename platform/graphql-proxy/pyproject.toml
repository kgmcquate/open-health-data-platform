[project]
name = "ohdp-graphql-proxy"
version = "0.0.0"
description = "Dagster GraphQL allowlist proxy — read-only enforcement"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "graphql-core>=3.2",
]

# Deployed as its own container image; intentionally NOT a uv workspace member.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proxy"]
