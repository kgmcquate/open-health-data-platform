{{- /*
Create any database in `.Values.postgres.databases` that does not exist yet.

Why this exists: the initdb script in postgres.yaml runs *only* on an empty
data directory, so on a cluster that already has a Postgres volume, adding an
entry to that list silently does nothing and the first pod that needs the
database crash-loops on "database ... does not exist". Until now the fix was a
manual psql session, which is exactly the kind of step that is remembered once
and forgotten twice.

This Job is idempotent by construction — every statement is guarded by a
catalog lookup — so it is safe to run on every install and upgrade, and it also
repairs a role whose password drifted from the Secret.

It is a post-install/post-upgrade hook so it runs *after* the StatefulSet is
reconciled, and `hook-succeeded` deletes it on success so the namespace does
not fill with completed Jobs. A failure leaves the Job behind on purpose:
`kubectl -n infra logs job/postgres-db-bootstrap` is then the diagnosis.
*/ -}}
{{- $labels := include "platform-base.labels" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-db-bootstrap
  namespace: infra
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # Reaped by the hook-delete-policy on success; this bounds a Job left behind
  # by a failure that is later fixed elsewhere.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-db-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: postgres.infra.svc.cluster.local
            - name: PGUSER
              value: postgres
            - name: PGDATABASE
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: postgres-password }
            {{- range $db := .Values.postgres.databases }}
            - name: {{ $db | upper }}_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-secret, key: {{ $db }}-password }
            {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail

              # The StatefulSet may still be rolling when this hook fires.
              for _ in $(seq 1 60); do
                pg_isready -q && break
                sleep 2
              done
              pg_isready

              ensure() {
                local db="$1" user="$2" pass="$3"
                # Passwords are passed as psql variables, never interpolated
                # into the SQL text: a generated password is alphanumeric today,
                # but a quoting bug here would be a silent auth failure.
                if ! psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$user'" | grep -q 1; then
                  echo "creating role $user"
                  psql -v ON_ERROR_STOP=1 -v pass="$pass" \
                    -c "CREATE ROLE \"$user\" WITH LOGIN PASSWORD :'pass'"
                else
                  # Re-assert the password so the role matches the Secret even
                  # if one of them was changed by hand.
                  psql -v ON_ERROR_STOP=1 -v pass="$pass" \
                    -c "ALTER ROLE \"$user\" WITH LOGIN PASSWORD :'pass'"
                fi

                if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" | grep -q 1; then
                  echo "creating database $db"
                  # CREATE DATABASE cannot run inside a transaction block, which
                  # is why this is its own statement and not part of a DO block.
                  psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\" OWNER \"$user\""
                  psql -v ON_ERROR_STOP=1 -c "REVOKE ALL ON DATABASE \"$db\" FROM PUBLIC"
                else
                  echo "database $db already exists"
                fi
              }

              {{- range $db := .Values.postgres.databases }}
              ensure {{ $db }} {{ $db }} "${{ $db | upper }}_PASSWORD"
              {{- end }}
              echo "bootstrap complete"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
