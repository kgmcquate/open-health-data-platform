{{- $pw := include "platform-base.passwords" . | fromYaml -}}
{{- $appUrl := printf "postgresql+psycopg://app:%s@postgres.infra.svc.cluster.local:5432/app" ($pw.app | b64dec) -}}
{{- /* Open WebUI is SQLAlchemy too, but it picks its own driver — a
       +psycopg suffix here is not what it expects. */ -}}
{{- $webuiUrl := printf "postgresql://openwebui:%s@postgres.infra.svc.cluster.local:5432/openwebui" ($pw.openwebui | b64dec) -}}
{{- $labels := include "platform-base.labels" . -}}
# ---------------------------------------------------------------------------
# infra/postgres-secret — the source of truth. Postgres reads every password
# here on first init; the mirrors below are derived from the same values.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: infra
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgres-password: {{ $pw.postgres }}
  dagster-password: {{ $pw.dagster }}
  openmetadata-password: {{ $pw.openmetadata }}
  app-password: {{ $pw.app }}
  openwebui-password: {{ $pw.openwebui }}
---
# dagster/dagster chart wants its own secret with key `postgresql-password`.
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgresql-password: {{ $pw.dagster }}
---
# open-metadata/openmetadata reads the DB password from this secret. NOT
# `openmetadata-db-secret` — the chart templates a Secret of that name for the
# non-secret DB config and Helm will not merge into it.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-db-auth
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  openmetadata-postgres-password: {{ $pw.openmetadata }}
---
# OpenMetadata application-level encryption key. Must base64-decode to 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-fernet-secret
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  fernetKey: {{ $pw.fernet }}
---
# oauth2-proxy session-cookie key (ADR-0007). Must decode to exactly 32 bytes.
# `client-id` / `client-secret` are added to THIS secret out of band by the
# `External secrets` step of deploy-platform.yml (repo secrets
# DAGSTER_OIDC_CLIENT_ID / DAGSTER_OIDC_CLIENT_SECRET). Helm's 3-way merge leaves
# those foreign keys in place on every upgrade — same trick as openmetadata-db-secret.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  cookie-secret: {{ $pw.oauth2Cookie }}
---
# Shared HMAC secret between hub-api and the Cube semantic layer.
apiVersion: v1
kind: Secret
metadata:
  name: cube-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
---
# hub-api's generated env: the database URL (assembled from the `app` password),
# its copy of the Cube shared secret, and the key that signs its session
# cookie. The externally-issued half (Stripe, OIDC, OM JWT) comes from the
# ExternalSecret `hub-api-secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: hub-api-db
  namespace: app
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_APP_DATABASE_URL: {{ $appUrl | b64enc }}
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
  OHDP_SESSION_SECRET_KEY: {{ $pw.sessionSecretKey }}
---
# Open WebUI's generated env (ADR-0017). The externally-issued half — the Google
# OAuth client and the model API key — arrives in `openwebui-secrets` from
# deploy-platform.yml's `secrets` step.
#
# DATABASE_URL is delivered as a Secret rather than the chart's `databaseUrl`
# value, which renders the password into the rendered manifest and into
# `helm get values`.
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-db
  namespace: app
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  DATABASE_URL: {{ $webuiUrl | b64enc }}
  WEBUI_SECRET_KEY: {{ $pw.webuiSecretKey }}
---
# The Cube MCP server's env (ADR-0017). It mints Cube service tokens with the
# same shared HMAC secret hub-api uses, so the two cannot disagree about what a
# valid token looks like.
#
# OHDP_MCP_AUTH_TOKEN is the bearer token the server requires and Open WebUI
# presents. It is generated here and read by both, so rotating it is a
# `kubectl delete secret mcp-cube-secret` followed by a `helm upgrade` — and
# then re-pasting it into Open WebUI's tool-server connection, which is
# UI-managed state (see charts/mcp-cube/templates/NOTES.txt).
apiVersion: v1
kind: Secret
metadata:
  name: mcp-cube-secret
  namespace: app
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
  OHDP_MCP_AUTH_TOKEN: {{ $pw.mcpAuthToken }}
