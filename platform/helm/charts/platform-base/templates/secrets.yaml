{{- $pw := include "platform-base.passwords" . | fromYaml -}}
{{- $appUrl := printf "postgresql+psycopg://app:%s@postgres.infra.svc.cluster.local:5432/app" ($pw.app | b64dec) -}}
{{- $labels := include "platform-base.labels" . -}}
# ---------------------------------------------------------------------------
# infra/postgres-secret — the source of truth. Postgres reads every password
# here on first init; the mirrors below are derived from the same values.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: infra
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgres-password: {{ $pw.postgres }}
  dagster-password: {{ $pw.dagster }}
  superset-password: {{ $pw.superset }}
  openmetadata-password: {{ $pw.openmetadata }}
  app-password: {{ $pw.app }}
  polaris-password: {{ $pw.polaris }}
---
# dagster/dagster chart wants its own secret with key `postgresql-password`.
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgresql-password: {{ $pw.dagster }}
---
# Apache Polaris (ADR-0010). Everything Polaris needs is generated here, not
# injected out of band:
#   polaris-persistence  — the metastore connection (upstream chart's
#                          persistence.relationalJdbc.secret). All three keys are
#                          derivable: postgres.yaml creates the `polaris` DB +
#                          owner role from `polaris-password`.
#   polaris-principal    — the `ohdp` realm root principal. `OHDP_ICEBERG_CREDENTIAL`
#                          ("<id>:<secret>") is loaded by the pipeline (dagster
#                          envSecrets) and pyiceberg's OAuth2 client_credentials
#                          grant; `credential` (",-delimited, realm-prefixed") is
#                          what the chart's bootstrap-schema init container feeds
#                          `polaris-admin-tool bootstrap -c`.
{{- $polarisId := $pw.polarisClientId | b64dec -}}
{{- $polarisSecret := $pw.polarisClientSecret | b64dec -}}
apiVersion: v1
kind: Secret
metadata:
  name: polaris-persistence
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  jdbcUrl: {{ "jdbc:postgresql://postgres.infra.svc.cluster.local:5432/polaris" | b64enc }}
  username: {{ "polaris" | b64enc }}
  password: {{ $pw.polaris }}
---
apiVersion: v1
kind: Secret
metadata:
  name: polaris-principal
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_ICEBERG_CREDENTIAL: {{ printf "%s:%s" $polarisId $polarisSecret | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: polaris-bootstrap
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  credential: {{ printf "ohdp,%s,%s" $polarisId $polarisSecret | b64enc }}
---
# open-metadata/openmetadata reads the DB password from this secret. NOT
# `openmetadata-db-secret` — the chart templates a Secret of that name for the
# non-secret DB config and Helm will not merge into it.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-db-auth
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  openmetadata-postgres-password: {{ $pw.openmetadata }}
---
# OpenMetadata application-level encryption key. Must base64-decode to 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-fernet-secret
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  fernetKey: {{ $pw.fernet }}
---
# oauth2-proxy session-cookie key (ADR-0007). Must decode to exactly 32 bytes.
# `client-id` / `client-secret` are added to THIS secret out of band by the
# `External secrets` step of deploy-platform.yml (repo secrets
# DAGSTER_OIDC_CLIENT_ID / DAGSTER_OIDC_CLIENT_SECRET). Helm's 3-way merge leaves
# those foreign keys in place on every upgrade — same trick as openmetadata-db-secret.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  cookie-secret: {{ $pw.oauth2Cookie }}
---
# Shared HMAC secret between hub-api and the Cube semantic layer.
apiVersion: v1
kind: Secret
metadata:
  name: cube-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
---
# hub-api's generated env: the database URL (assembled from the `app` password)
# and its copy of the Cube shared secret. The externally-issued half (Stripe,
# OIDC, OM JWT) comes from the ExternalSecret `hub-api-secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: hub-api-db
  namespace: app
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_APP_DATABASE_URL: {{ $appUrl | b64enc }}
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
