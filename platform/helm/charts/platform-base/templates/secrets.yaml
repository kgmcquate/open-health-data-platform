{{- $pw := include "platform-base.passwords" . | fromYaml -}}
{{- $appUrl := printf "postgresql+psycopg://app:%s@postgres.infra.svc.cluster.local:5432/app" ($pw.app | b64dec) -}}
{{- $labels := include "platform-base.labels" . -}}
# ---------------------------------------------------------------------------
# infra/postgres-secret — the source of truth. Postgres reads every password
# here on first init; the mirrors below are derived from the same values.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: infra
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgres-password: {{ $pw.postgres }}
  dagster-password: {{ $pw.dagster }}
  superset-password: {{ $pw.superset }}
  openmetadata-password: {{ $pw.openmetadata }}
  app-password: {{ $pw.app }}
---
# dagster/dagster chart wants its own secret with key `postgresql-password`.
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  postgresql-password: {{ $pw.dagster }}
---
# open-metadata/openmetadata reads the DB password from this secret. NOT
# `openmetadata-db-secret` — the chart templates a Secret of that name for the
# non-secret DB config and Helm will not merge into it.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-db-auth
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  openmetadata-postgres-password: {{ $pw.openmetadata }}
---
# OpenMetadata application-level encryption key. Must base64-decode to 32 bytes.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-fernet-secret
  namespace: meta
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  fernetKey: {{ $pw.fernet }}
---
# Shared HMAC secret between hub-api and the Cube semantic layer.
apiVersion: v1
kind: Secret
metadata:
  name: cube-secret
  namespace: data
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
---
# hub-api's generated env: the database URL (assembled from the `app` password)
# and its copy of the Cube shared secret. The externally-issued half (Stripe,
# OIDC, OM JWT) comes from the ExternalSecret `hub-api-secrets`.
apiVersion: v1
kind: Secret
metadata:
  name: hub-api-db
  namespace: app
  labels:
    {{- $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  OHDP_APP_DATABASE_URL: {{ $appUrl | b64enc }}
  OHDP_CUBE_API_SECRET: {{ $pw.cube }}
