# platform-base — the cluster foundation. No out-of-band values: everything is
# static or generated on first install and preserved on every upgrade.

# The platform namespaces (ARCHITECTURE.md). Each is created only if it does not
# already exist, so `helm ... --create-namespace -n infra` does not collide with
# the `infra` entry here.
namespaces:
  - app
  - data
  - bi
  - meta
  - infra

# Let's Encrypt ClusterIssuer. Rendered only when cert-manager's CRDs are
# already installed (see templates/cluster-issuer.yaml).
clusterIssuer:
  enabled: true
  name: letsencrypt-prod
  email: kgmcquate@gmail.com
  ingressClass: traefik

# Internally-generated secrets. Generated once with randAlphaNum, then read back
# from the live cluster on every subsequent render so they never rotate
# unexpectedly. Length is the generated password length in characters.
generatedSecrets:
  passwordLength: 32

# Non-secret env for the Dagster pipeline image and its launched runs
# (rendered into ConfigMap data/ohdp-pipeline-config).
pipelineConfig:
  OHDP_ENVIRONMENT: "prod"
  OHDP_LOG_JSON: "true"
  OHDP_SPACES_BUCKET: "ohdp-warehouse"
  OHDP_SPACES_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
  OHDP_SPACES_REGION: "nyc3"
  # Snowflake data warehouse (ADR-0012). These come from `terraform output` in
  # platform/terraform; the matching private key (OHDP_SNOWFLAKE_PRIVATE_KEY —
  # SERVICE users don't accept password auth) is the one secret half and
  # arrives in `ohdp-pipeline-secrets` from deploy-platform.yml.
  OHDP_SNOWFLAKE_ACCOUNT: "IRCMTCN-EKB34223"
  OHDP_SNOWFLAKE_USER: "OHDP_PIPELINE"
  OHDP_SNOWFLAKE_ROLE: "OHDP_PIPELINE"
  OHDP_SNOWFLAKE_WAREHOUSE: "OHDP_WH"
  OHDP_SNOWFLAKE_DATABASE: "OHDP"

postgres:
  image: postgres:16.4-bookworm
  # DOKS default StorageClass. k3s used local-path.
  storageClass: do-block-storage
  storageSize: 40Gi
  # ARCHITECTURE.md §4 budgets 1 GB.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # The four logical databases (ARCHITECTURE.md §2, §9 — one instance, do not
  # split). Each gets an owner role with the matching generated password.
  #
  # The `polaris` database went with the Polaris catalog (ADR-0011). Dropping it
  # from this list stops it being *created*; an existing one is left in place,
  # so reclaim the disk with a manual `DROP DATABASE polaris` once you are
  # satisfied nothing wants it.
  databases:
    - dagster
    - superset
    - openmetadata
    - app
