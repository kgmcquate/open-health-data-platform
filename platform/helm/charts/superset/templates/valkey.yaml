{{- /*
Hand-rolled Valkey — cache backend for Superset's CACHE_CONFIG family and (once
celeryWorker/celeryBeat are enabled in a later phase) the Celery broker/result
backend. No Bitnami chart, no Redis operator (see values.yaml header) and no
PersistentVolume: pure cache content, a cold start after a restart is fine.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superset.valkeyName" . }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
    {{- include "superset.valkeySelectorLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "superset.valkeySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "superset.valkeySelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.redis.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "superset.valkeyName" . }}
  labels:
    {{- include "superset.labels" . | nindent 4 }}
    {{- include "superset.valkeySelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
  selector:
    {{- include "superset.valkeySelectorLabels" . | nindent 4 }}
