# Renders a `superset.apache.org/v1alpha1 Superset` CR, reconciled by the
# Superset Kubernetes Operator (`make superset-operator` — see
# values/superset-operator.yaml), plus a small hand-rolled Valkey Deployment
# for caching. No Bitnami dependency and no Redis operator, same reasoning as
# platform-base's hand-rolled Postgres StatefulSet: a single-instance, no-HA
# cache does not justify either.
#
# M1 scope only (docs/ARCHITECTURE.md): web server pointed directly at
# Snowflake^H^H^H^Hthe shared Postgres metastore, no Cube yet. celeryWorker /
# celeryBeat are intentionally omitted — §4 budgets "Celery worker and beat
# deferred to phase 3" — so scheduled reports and async queries are not
# available yet; SQL Lab and dashboards run synchronously against the web
# server. Revisit the §4 budget line (currently 1 GB total for this row) before
# adding them.
#
# NOT exposed by this chart's own Ingress. Reached only through a second
# oauth2-proxy release (values/oauth2-proxy-superset.yaml) that owns
# superset.open-health-data-platform.org and restricts entry to
# kgmcquate@gmail.com — Superset is an internal analytics tool at this stage,
# not a public surface like Dagster.

nameOverride: "superset"
fullnameOverride: "superset"

image:
  # Default per the Superset project's own recommended image (Scarf-tracked
  # adoption metrics mirror of the official build); override only if that
  # tracking is undesired.
  repository: apachesuperset.docker.scarf.sh/apache/superset
  # Pin an explicit release — never "latest". The operator keys the migrate
  # Job off the resolved repository:tag string, so a mutable tag means
  # `superset db upgrade` silently stops running on "upgrade".
  tag: "6.1.0"

environment: Production

# The base Superset image ships without a Snowflake SQLAlchemy driver — M1
# points Superset at Snowflake as a *data source* (added via its own UI as a
# "Database" connection, separate from the Postgres metastore below), and
# that connection needs snowflake-sqlalchemy to work at all. Installing it at
# every pod start is simpler than a custom image + its own build/push pipeline
# for now; revisit if cold-start latency or a locked dependency version starts
# to matter (operator docs recommend baking it into a custom image instead).
bootstrapScript: |
  pip install snowflake-sqlalchemy

# ---------------------------------------------------------------------------
# Secrets. Both generated once by platform-base and mirrored into the `bi`
# namespace (platform-base/templates/secrets.yaml) — never rotate silently on
# upgrade, same pattern as every other consumer secret in this repo.
# ---------------------------------------------------------------------------
secretKeyFrom:
  name: superset-secret
  key: secret-key

metastore:
  type: PostgreSQL
  host: postgres.infra.svc.cluster.local
  port: 5432
  database: superset
  username: superset
  passwordFrom:
    name: superset-db-auth
    key: password
  # NOT createDatabase: true — platform-base's postgres-init ConfigMap already
  # creates the `superset` database and owning role on first Postgres boot
  # (charts/platform-base/values.yaml postgres.databases).

valkey:
  # Our own Deployment below, not a managed service. Same namespace, no
  # password — ClusterIP-only, never reachable outside `bi`, pure cache
  # content (Celery is not enabled yet, so nothing here needs to survive a
  # restart).
  host: superset-valkey.bi.svc.cluster.local
  port: 6379

webServer:
  replicas: 1
  service:
    type: ClusterIP
    port: 8088
  podTemplate:
    container:
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 768Mi

# celeryWorker / celeryBeat / celeryFlower / mcpServer / websocketServer:
# intentionally omitted (see header comment) — omission is how the operator
# disables a component.

podTemplate:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      # Superset writes to /app/superset_home and /tmp at runtime — matches
      # the operator's own production sample.
      readOnlyRootFilesystem: false

deploymentTemplate:
  revisionHistoryLimit: 3

# ---------------------------------------------------------------------------
# Valkey — hand-rolled, not a managed service. Cache only: no PersistentVolume,
# losing it on restart just means a cold cache.
# ---------------------------------------------------------------------------
redis:
  image: valkey/valkey:8-alpine
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
