# Cube Core — the semantic layer (ARCHITECTURE.md §1.5, ADR-0003). Custom
# image (semantic/cube/Dockerfile) because Cube ships no official Helm chart
# and our model files + a compiled dbt manifest (cube-dbt) have to be baked
# in — see that Dockerfile for why this isn't just the upstream cubejs/cube
# image with a ConfigMap, the way graphql-authz-proxy is.
#
# Auth is Cube's own JWT security context, not an oauth2-proxy wall
# (ARCHITECTURE.md §5: "Cube | Service token from hub-api"). Ingress is
# enabled by default here, unlike the hub-api chart.
#
# Release name must be "cube" — hub-api reaches this Service at
# cube.data.svc.cluster.local (hub-api/values.yaml OHDP_CUBE_API_URL), and
# that hostname is derived from the Helm release name.

replicaCount: 1

image:
  repository: ghcr.io/kgmcquate/ohdp-cube
  # Pin an immutable tag in production — never "latest".
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: cube.open-health-data-platform.org
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: cube-tls

# ARCHITECTURE.md §4 budgets 0.5 GB for cube itself — Cube Store (ADR-0024)
# is a separate pod (charts/cubestore) with its own budget line.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 512Mi

# /livez tests the actual MotherDuck connection; /readyz is deployment state
# only (docs.cube.dev/product/deployment/core).
livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # Cube writes its own cache/tmp files at runtime — same exception
  # cubestore documents for the same reason.
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# Non-secret config only. queryRewrite (tier limits, hard row caps) lives in
# semantic/cube/cube.js, baked into the image — not here.
#
# Cube Store + pre-aggregations (ADR-0024, supersedes ADR-0003's "no Cube
# Store initially"): scheduledRefreshTimer lives in cube.js, the rollups
# themselves in semantic/cube/model/*.yml.
env:
  CUBEJS_DEV_MODE: "false"
  # The base image bakes in NODE_ENV=production, and Cube's
  # detectQueueAndCacheDriver() (query-orchestrator/QueryOrchestrator.js)
  # defaults to the "cubestore" driver whenever NODE_ENV=production —
  # unrelated to CUBEJS_DEV_MODE, which only controls the dev playground UI.
  # Dev mode masks this by auto-spawning an embedded Cube Store; production
  # mode doesn't, and needs CUBEJS_CUBESTORE_HOST/PORT pointed at a real
  # instance (charts/cubestore) or it fails readiness with "Cube Store was
  # specified as queue/cache driver". Explicit here anyway, for clarity.
  CUBEJS_CACHE_AND_QUEUE_DRIVER: cubestore
  # Release name of charts/cubestore must be "cubestore" for this to resolve.
  CUBEJS_CUBESTORE_HOST: "cubestore.data.svc.cluster.local"
  CUBEJS_CUBESTORE_PORT: "3030"
  # MotherDuck, not Snowflake, runs Cube's queries (ADR-0029). Snowflake is
  # still the Iceberg catalog (ADR-0019): MotherDuck has Horizon's CURATED
  # catalog attached server-side as a read-only database named CURATED
  # (platform/scripts/motherduck_bootstrap.py), so the cube models'
  # `"CURATED"."<SCHEMA>"."<TABLE>"` from the dbt manifest resolves unchanged
  # and the scan runs on MotherDuck, not in this pod.
  #
  # originalSql pre-aggregations (ADR-0024) live in the source database, not
  # Cube Store, and Cube creates them as `prod_pre_aggregations.<table>` with
  # no database qualifier — so they land in the connection's default
  # database. `md:cache` makes that the `cache` database
  # (motherduck_bootstrap.py creates it), i.e. cache.prod_pre_aggregations;
  # every other workspace database, CURATED included, stays attached. CURATED
  # couldn't hold them anyway: it's attached read_only.
  #
  # Setting a path means the driver no longer appends the token to the URL
  # (DuckDBDriver.init uses the path verbatim), so the MotherDuck extension
  # reads it from `motherduck_token` in secretEnv below instead.
  CUBEJS_DB_TYPE: duckdb
  CUBEJS_DB_DUCKDB_DATABASE_PATH: "md:cache"
  # The DuckDB driver runs every query() on ONE shared connection
  # (DuckDBDriver.query -> defaultConnection.all), and node-duckdb executes
  # each call on the libuv threadpool — so with Cube's default queue
  # concurrency, refresh-key and pre-aggregation queries run on that
  # connection at the same time. Against the attached Iceberg catalog that
  # corrupts binding: "Referenced column "ingest_ts" not found ... Candidate
  # bindings: "__"" and "INTERNAL Error: Attempted to dereference unique_ptr
  # that is NULL", for queries that succeed when run alone. One at a time.
  CUBEJS_CONCURRENCY: "1"
  # DuckDB downloads the motherduck extension into $HOME/.duckdb on first
  # connect. The base image leaves HOME=/, which uid 10001 can't write, so
  # the driver's init fails ("Failed to create directory //.duckdb") and
  # every later /livez and /readyz just reports "Database was already closed".
  HOME: /tmp

# Explicit secretKeyRef mappings, not envFrom: the Secret keys use this
# project's OHDP_* naming convention, but Cube itself only recognizes its own
# CUBEJS_* env var names, so the two can't share a key name the way
# hub-api's envFrom does.
secretEnv:
  # platform-base generates this — the shared HMAC secret hub-api signs
  # service tokens with (ARCHITECTURE.md §5).
  - name: CUBEJS_API_SECRET
    secretName: cube-secret
    secretKey: OHDP_CUBE_API_SECRET
  # Mirrored by deploy-platform.yml's `secrets` step from the MOTHERDUCK_TOKEN
  # repo secret (ADR-0029). Cube holds no Snowflake credential any more — the
  # Horizon PAT lives in MotherDuck's own stored secret.
  # Read by the MotherDuck extension itself; this is what authenticates the
  # md:cache connection above.
  - name: motherduck_token
    secretName: cube-motherduck
    secretKey: OHDP_MOTHERDUCK_TOKEN

# Always-on `services` node pool (platform/terraform/main.tf, np_services) —
# off `heavy`, which gets hand-scaled for Dagster.
nodeSelector:
  node-role: services
tolerations: []
affinity: {}
podAnnotations: {}
