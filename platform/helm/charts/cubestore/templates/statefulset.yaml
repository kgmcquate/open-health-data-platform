apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cubestore.fullname" . }}
  labels:
    {{- include "cubestore.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cubestore.fullname" . }}
  # Single replica, standalone mode (no CUBESTORE_WORKERS) — not HA, matches
  # postgres's own single-instance rationale (platform-base/templates/postgres.yaml).
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cubestore.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cubestore.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cubestore.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cubestore
          image: {{ include "cubestore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: cubestore
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              # cubejs/cubestore's default CUBESTORE_DATA_DIR is `.cubestore`
              # resolved against its /cube WORKDIR — i.e. /cube/.cubestore, where
              # it writes its RocksDB metastore and rollup Parquet files. Mounting
              # at /cube/data (the old, wrong path) left those writes landing on
              # the root overlay FS, which the non-root UID 10001 can't create a
              # directory in — hence the PermissionDenied crash loop.
              mountPath: /cube/.cubestore
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          # Memory limits are mandatory on every pod (ARCHITECTURE.md §4).
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
