{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcp-cube.serviceAccountName" . }}
  labels:
    {{- include "mcp-cube.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# mcp-cube never calls the Kubernetes API. No RBAC is granted on purpose.
automountServiceAccountToken: false
{{- end }}
