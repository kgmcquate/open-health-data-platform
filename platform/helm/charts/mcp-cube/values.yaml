# mcp-cube — Cube Core's four tools, served over MCP streamable HTTP so any MCP
# client can call them, hub-api's own chat agent included (apps/api/config/tools.yaml's
# `mcp-cube` connection) (ADR-0017). Cube Core ships no MCP server of its own;
# that is a Cube Cloud Premium/Enterprise feature (ADR-0016).
#
# **This runs the hub-api image**, with the command overridden to start
# `ohdp_mcp.server` instead of `hub_api.main`. The MCP tools are a transport in
# front of `ohdp_agent.cube` — the same module the in-process chat agent calls —
# and one image keeps them from drifting apart. It also means there is no second
# entry in build-images.yml and `TAG` means the same thing for both releases.
#
# Deployed to the `app` namespace, alongside hub-api, because the secrets it
# reads live there.

replicaCount: 1

image:
  repository: ghcr.io/kgmcquate/ohdp-hub-api
  # Pin an immutable tag in production — never "latest".
  tag: ""
  pullPolicy: IfNotPresent

# `--factory` because create_app() decides at startup whether the bearer wall is
# on, and refuses to start with neither a token nor an explicit opt-out.
command:
  - uvicorn
  - ohdp_mcp.server:create_app
  - --factory
  - --host
  - 0.0.0.0
  - --port
  - "8000"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8000

# NOT exposed. There is no Ingress and no oauth2-proxy wall in this chart, and
# that is the whole access-control story: the only client is hub-api, which
# reaches this Service by cluster DNS from the same namespace. Publishing it
# would put an unauthenticated path in front of something that mints Cube
# service tokens and spends Snowflake credits — the bearer token below is
# defence in depth, not a substitute for staying off the internet.
ingress:
  enabled: false

# Small: this process holds no state, forwards to Cube, and the payload it
# handles is a JSON query object plus at most MAX_ROWS rows.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# /healthz is deliberately outside the bearer check (ohdp_mcp/server.py) — a
# probe that has to carry a secret fails the day the secret rotates.
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Non-secret configuration only.
env:
  OHDP_ENVIRONMENT: prod
  OHDP_LOG_JSON: "true"
  OHDP_LOG_LEVEL: INFO
  OHDP_CUBE_API_URL: http://cube.data.svc.cluster.local:4000
  # The tier Cube's `queryRewrite` applies to every query from this server.
  # Everyone reaching Open WebUI is tier `free` until ARCHITECTURE.md §5's IdP
  # can issue a real `tier` claim — the same assumption hub-api makes. It is set
  # here and never read from the caller.
  OHDP_MCP_TIER: free

envFrom:
  # mcp-cube-secret — generated by platform-base:
  #   OHDP_CUBE_API_SECRET  the shared HMAC secret Cube service tokens are signed with
  #   OHDP_MCP_AUTH_TOKEN   the bearer token this server requires of its caller
  secrets:
    - mcp-cube-secret
  configMaps: []

# The always-on default/ingress pool (platform/terraform/main.tf) beside
# Traefik rather than `services`: at 50m/128Mi it fits the small node's
# headroom once the Dagster-side proxies moved to `heavy`, and it leaves
# `services` room for hub-api's rolling-update surge pod.
nodeSelector:
  node-role: ingress
tolerations: []
affinity: {}
podAnnotations: {}
