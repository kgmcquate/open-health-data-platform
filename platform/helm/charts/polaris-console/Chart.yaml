apiVersion: v2
name: polaris-console
description: >-
  The Apache Polaris console — a browser UI for the `ohdp` Iceberg REST catalog
  (ADR-0010). Wraps the SPA from github.com/apache/polaris-tools, which ships
  neither a Helm repo nor a published image, so this is a local chart and the
  image is built by .github/workflows/build-polaris-console.yml.
type: application
version: 0.1.0
appVersion: "latest"
home: https://polaris.apache.org/
sources:
  - https://github.com/apache/polaris-tools/tree/main/console
maintainers:
  - name: kgmcquate
