apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "polaris-console.fullname" . }}
  labels:
    {{- include "polaris-console.labels" . | nindent 4 }}
data:
  # Consumed by generate-config.sh in the image at container start.
  VITE_POLARIS_API_URL: {{ .Values.config.polarisApiUrl | quote }}
  VITE_OAUTH_TOKEN_URL: {{ .Values.config.oauthTokenUrl | quote }}
  VITE_POLARIS_REALM: {{ .Values.config.polarisRealm | quote }}
  VITE_POLARIS_REALM_HEADER_NAME: {{ .Values.config.polarisRealmHeaderName | quote }}
  VITE_POLARIS_PRINCIPAL_SCOPE: {{ .Values.config.polarisPrincipalScope | quote }}
