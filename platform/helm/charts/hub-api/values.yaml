# hub-api — the only always-on component that talks to users AND to Cube.
# Single replica by design (ARCHITECTURE.md §1.4, §9).

replicaCount: 1

image:
  repository: ghcr.io/kgmcquate/ohdp-hub-api
  # Pin a digest or immutable tag in production. "latest" makes rollbacks
  # meaningless and lets a rebuild change what is running without a deploy.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8000

# Owns app.open-health-data-platform.org directly — there is no oauth2-proxy
# wall in front any more (hub_api.auth does its own OIDC). The endpoint still
# spends money per request, so `settings.allowed_emails_list` is what guards
# it now instead of an external allowlist file.
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: app.open-health-data-platform.org
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: hub-api-tls

# ARCHITECTURE.md §4 budgets 0.5 GB for hub-web + hub-api combined. There is no
# hub-web container — hub-api serves the chat page itself (hub_api/main.py) — so
# hub-api takes the whole budget rather than a share of it. The headroom over
# the previous 320Mi is for the pydantic-ai/OpenAI SDKs and a streaming turn's
# message history, which grows with every tool result in the loop.
# Limits are mandatory on every pod — the node runs near its ceiling.
resources:
  requests:
    cpu: 100m
    memory: 320Mi
  limits:
    cpu: "1"
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 360

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Non-secret configuration only. Anything sensitive belongs in envFrom.secrets
# and is referenced by name — never rendered into a manifest (§5).
env:
  OHDP_ENVIRONMENT: prod
  OHDP_LOG_JSON: "true"
  OHDP_LOG_LEVEL: INFO
  OHDP_CUBE_API_URL: http://cube.data.svc.cluster.local:4000
  OHDP_OPENMETADATA_URL: http://openmetadata.meta.svc.cluster.local:8585
  # Public hostname used for catalog links rendered in the Hub UI (Sources
  # page); the internal URL above isn't reachable from a user's browser.
  OHDP_OPENMETADATA_PUBLIC_URL: https://catalog.open-health-data-platform.org
  # OpenMetadata persona whose curated context becomes the chat agent's
  # system-prompt preamble (docs/chatbot.md §3.1). Empty until personas are
  # seeded in the catalog (M3.3) and one is bound to the bot user — until then
  # the live server answers get_persona_context with a 404 and the agent falls
  # back to its built-in prompt.
  OHDP_CHAT_PERSONA: ""
  # Provisional quotas — ARCHITECTURE.md §10.3. Everyone past the auth wall is
  # tier `free` until ARCHITECTURE.md §5's OIDC provider can issue a `tier`
  # claim, so FREE is the number that is actually in force today. 20/month is
  # the proposed *public* free tier, not an operator's working allowance —
  # raise it here while this is a single-operator surface.
  OHDP_FREE_MONTHLY_QUESTIONS: "200"
  OHDP_PAID_MONTHLY_QUESTIONS: "500"
  # Where /tools/report_issue files (hub_api.issues). Not a secret — the repo is
  # public and the issues it opens are too; the PAT beside it is what's guarded.
  # Point this at a separate feedback repo to keep chat-filed reports out of the
  # engineering backlog, at the cost of a second place to watch.
  OHDP_GITHUB_ISSUES_REPO: kgmcquate/open-health-data-platform
  # Base URL the OAuth redirect_uri is built from (hub_api.auth). Not a secret,
  # but wrong here means every sign-in fails with redirect_uri_mismatch.
  OHDP_HUB_BASE_URL: https://app.open-health-data-platform.org
  # The access control oauth2-proxy-app.yaml's `authenticatedEmailsFile` used to
  # provide. Empty means "allow any verified email" — deliberately not empty
  # while this is a single-operator surface (see OHDP_FREE_MONTHLY_QUESTIONS
  # above). Widening this is the one edit that makes sign-in public.
  OHDP_ALLOWED_EMAILS: kgmcquate@gmail.com,fuzzh3d@gmail.com,atinklenberg@gmail.com
  # Who holds the admin role (hub_api.auth's `is_admin`). Admins can delete a
  # published dashboard — row, stored render and votes, irreversibly — which is
  # the escape hatch for a chart that should never have been on the public page
  # at all, since voting only hides one after people have already seen it.
  # Deliberately a values edit rather than a database flag: the role is read
  # from here on every request, so adding or removing an admin takes effect at
  # the next request after a deploy, not at their next sign-in. Empty means
  # nobody is an admin and the delete route 403s for everyone.
  OHDP_ADMIN_EMAILS: kgmcquate@gmail.com

  OHDP_STRIPE_API_VERSION: "2026-03-25.dahlia; custom_checkout_payment_form_preview=v1"


envFrom:
  # hub-api-db      — generated by platform-base: OHDP_APP_DATABASE_URL,
  #                   OHDP_CUBE_API_SECRET, OHDP_SESSION_SECRET_KEY,
  #                   OHDP_INTERNAL_INGEST_TOKEN (the bearer the Dagster
  #                   trending-literature sync must present to
  #                   POST /api/internal/literature/trending — same value
  #                   mirrored into the data-namespace literature-ingest-secret
  #                   for that pipeline pod to read)
  # hub-api-secrets — external, injected by deploy-platform.yml `secrets` step:
  #                   OHDP_OPENMETADATA_JWT, STRIPE_SECRET_KEY,
  #                   OHDP_STRIPE_PRICE_ID, OHDP_OIDC_CLIENT_ID,
  #                   OHDP_OIDC_CLIENT_SECRET, OHDP_GITHUB_TOKEN,
  #                   OHDP_TOOLS_AUTH_TOKEN
  # openrouter-secrets — external, injected by deploy-platform.yml `secrets` step:
  #                      OHDP_OPENAI_API_BASE_URLS and OHDP_OPENAI_API_KEYS
  #                      (OpenRouter backend for the Hub UI model picker).
  # mcp-cube-secret     — generated by platform-base: OHDP_MCP_AUTH_TOKEN, the
  #                       bearer token apps/api/config/tools.yaml's `mcp-cube`
  #                       connection presents to the Cube MCP server.
  secrets:
    - hub-api-db
    - hub-api-secrets
    - openrouter-secrets
    - mcp-cube-secret
  configMaps: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
