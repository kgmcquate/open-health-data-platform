# hub-api — the only always-on component that talks to users AND to Cube.
# Single replica by design (ARCHITECTURE.md §1.4, §9).

replicaCount: 1

image:
  repository: ghcr.io/kgmcquate/ohdp-hub-api
  # Pin a digest or immutable tag in production. "latest" makes rollbacks
  # meaningless and lets a rebuild change what is running without a deploy.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8000

# NOT exposed by this chart's own Ingress. The oauth2-proxy-app release
# (values/oauth2-proxy-app.yaml) owns app.open-health-data-platform.org and
# proxies to this Service, so every route — the chat UI at `/` and `/api`
# alike — enters through the Google login wall. Re-enabling this would publish
# an unauthenticated path to an endpoint that spends money per request.
ingress:
  enabled: false
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: app.open-health-data-platform.org
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: hub-api-tls

# ARCHITECTURE.md §4 budgets 0.5 GB for hub-web + hub-api combined. There is no
# hub-web container — hub-api serves the chat page itself (hub_api/main.py) — so
# hub-api takes the whole budget rather than a share of it. The headroom over
# the previous 320Mi is for the Anthropic SDK and a streaming turn's message
# history, which grows with every tool result in the loop.
# Limits are mandatory on every pod — the node runs near its ceiling.
resources:
  requests:
    cpu: 100m
    memory: 320Mi
  limits:
    cpu: "1"
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Non-secret configuration only. Anything sensitive belongs in envFrom.secrets
# and is referenced by name — never rendered into a manifest (§5).
env:
  OHDP_ENVIRONMENT: prod
  OHDP_LOG_JSON: "true"
  OHDP_LOG_LEVEL: INFO
  OHDP_CUBE_API_URL: http://cube.data.svc.cluster.local:4000
  OHDP_OPENMETADATA_URL: http://openmetadata.meta.svc.cluster.local:8585
  # OpenMetadata persona whose curated context becomes the chat agent's
  # system-prompt preamble (docs/chatbot.md §3.1). Empty until personas are
  # seeded in the catalog (M3.3) and one is bound to the bot user — until then
  # the live server answers get_persona_context with a 404 and the agent falls
  # back to its built-in prompt.
  OHDP_CHAT_PERSONA: ""
  # Provisional quotas — ARCHITECTURE.md §10.3. Everyone past the auth wall is
  # tier `free` until ARCHITECTURE.md §5's OIDC provider can issue a `tier`
  # claim, so FREE is the number that is actually in force today. 20/month is
  # the proposed *public* free tier, not an operator's working allowance —
  # raise it here while this is a single-operator surface.
  OHDP_FREE_MONTHLY_QUESTIONS: "200"
  OHDP_PAID_MONTHLY_QUESTIONS: "500"

envFrom:
  # hub-api-db      — generated by platform-base: OHDP_APP_DATABASE_URL, OHDP_CUBE_API_SECRET
  # hub-api-secrets — external, injected by deploy-platform.yml `secrets` step:
  #                   OHDP_OPENMETADATA_JWT, STRIPE_SECRET_KEY, OIDC_CLIENT_SECRET,
  #                   OHDP_ANTHROPIC_API_KEY
  secrets:
    - hub-api-db
    - hub-api-secrets
  configMaps: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
