# ADR-0022: one-time (but idempotent) setup for `openwebui-token-tracking` —
# migrates Open WebUI's own Postgres database to add the credit-tracking
# tables, and upserts pricing for z-ai/glm-5.3-flash, which the package's own
# bundled pricing table doesn't know about (it ships neither OpenRouter slugs
# nor any GLM model).
#
# Not a Helm hook: Open WebUI is installed straight from the upstream
# `open-webui/open-webui` chart (platform/helm/Makefile's `open-webui`
# target), so there's no local chart to hook a post-install Job into the way
# platform-base's db-bootstrap-job.yaml does. This is applied directly with
# `kubectl` right after `make open-webui`
# (.github/workflows/deploy-platform.yml), the same way that step already
# applies the externally-issued secrets.
#
# `${TAG}` is substituted by the deploy workflow (envsubst) — this file is a
# plain manifest, not a Helm template. Jobs are immutable, so the workflow
# deletes any previous run of this Job before re-applying.
#
# Both CLI commands below are safe to re-run: `init` uses SQLAlchemy `merge`
# (upsert) for settings and pricing, and `pricing upsert` is upsert by name.
#
# Pricing note: the credit costs below are OpenRouter's listed standard (non-
# batch) rates for z-ai/glm-5.3-flash as of 2026-09-15 — $0.075 / $0.25 per
# million tokens — read from https://openrouter.ai/api/v1/models. 1000 credits
# = 1 USD (the package's documented convention; see docs/chatbot.md §11.4), so
# $0.075/MTok is 75 credits per 1,000,000 input tokens. OpenRouter reprices
# models without notice and its per-request fee is not modelled here, so treat
# these as an estimate for rationing, not billing; re-check that endpoint when
# the numbers matter (ADR-0023 carries this as an accepted drift risk, the same
# one ADR-0022 named for Anthropic's rates).
#
# `--provider openrouter` is load-bearing in two directions: the tracked pipe
# lists only models whose pricing row matches its PROVIDER Valve, and Open WebUI
# prefixes the pipe's model ids with the Function's own id. Function named
# `OpenRouter` -> id `openrouter` -> PROVIDER Valve `openrouter` -> this flag.
# Any mismatch and the pipe shows an empty model list (docs/chatbot.md §11.4).
apiVersion: batch/v1
kind: Job
metadata:
  name: open-webui-token-tracking-init
  namespace: app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui-token-tracking-init
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: owui-token-tracking
          image: ghcr.io/kgmcquate/ohdp-open-webui:${TAG}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: openwebui-db, key: DATABASE_URL }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              owui-token-tracking init
              owui-token-tracking pricing upsert z-ai/glm-5.3-flash \
                --provider openrouter \
                --name "GLM 5.3 Flash" \
                --input-cost-credits 75 --per-input-tokens 1000000 \
                --output-cost-credits 250 --per-output-tokens 1000000
              echo "token tracking init complete"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
