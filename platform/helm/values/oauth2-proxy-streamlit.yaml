# Values for the upstream chart: oauth2-proxy/oauth2-proxy
#
#   helm upgrade --install oauth2-proxy-streamlit oauth2-proxy/oauth2-proxy -n bi \
#     -f platform/helm/values/oauth2-proxy-streamlit.yaml
#
# The Google login wall in front of Streamlit (ADR-0015 — replaces Superset's
# identical wall, just renamed). A second, independent release from
# values/oauth2-proxy.yaml (different host, different cookie, different
# audience) — Streamlit is an internal analytics tool at this stage, not a
# public surface like Dagster, so this wall only lets kgmcquate@gmail.com past
# it. Streamlit has no login system of its own; unlike Superset's Flask-
# AppBuilder, this wall is the only authn/authz Streamlit gets.
#
#   Cloudflare -> Traefik -> Ingress(streamlit.ohdp) -> THIS -> streamlit
#
# Revisit if Streamlit ever needs to be reachable by more than the operator.

replicaCount: 1

image:
  repository: oauth2-proxy/oauth2-proxy
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secret. Keys the chart expects: client-id, client-secret, cookie-secret.
#   cookie-secret  — generated by platform-base (bi/oauth2-proxy-streamlit-secret),
#                    read back on every upgrade so sessions survive a redeploy.
#   client-id / client-secret — patched in by deploy-platform.yml from the repo
#                    secrets STREAMLIT_OIDC_CLIENT_ID / STREAMLIT_OIDC_CLIENT_SECRET.
#                    (Google Cloud console: a separate "Web application" OAuth
#                    client from Dagster's, redirect URI
#                    https://streamlit.open-health-data-platform.org/oauth2/callback)
# ---------------------------------------------------------------------------
config:
  existingSecret: oauth2-proxy-streamlit-secret

  configFile: |-
    provider = "google"
    upstreams = [ "http://streamlit.bi.svc.cluster.local:8501/" ]
    redirect_url = "https://streamlit.open-health-data-platform.org/oauth2/callback"
    reverse_proxy = true
    cookie_secure = true
    skip_provider_button = true

authenticatedEmailsFile:
  enabled: true
  restricted_access: |-
    kgmcquate@gmail.com

ingress:
  enabled: true
  className: traefik
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - streamlit.open-health-data-platform.org
  tls:
    - secretName: streamlit-tls
      hosts:
        - streamlit.open-health-data-platform.org

service:
  type: ClusterIP
  portNumber: 80

# Same small footprint as the Dagster oauth2-proxy (values/oauth2-proxy.yaml).
resources:
  requests:
    cpu: 10m
    memory: 25Mi
  limits:
    cpu: 50m
    memory: 64Mi

metrics:
  enabled: false
