# Values for the upstream chart: oauth2-proxy/oauth2-proxy
#
#   helm upgrade --install oauth2-proxy-app oauth2-proxy/oauth2-proxy -n app \
#     -f platform/helm/values/oauth2-proxy-app.yaml
#
# The Google login wall in front of the hub app — the chat UI at `/` and the
# `/api` routes behind it (docs/chatbot.md). A third independent release
# alongside values/oauth2-proxy.yaml (Dagster) and values/oauth2-proxy-streamlit.yaml
# (Streamlit): different host, different cookie, different upstream.
#
#   Cloudflare -> Traefik -> Ingress(app.ohdp) -> THIS -> hub-api
#
# This release owns the hostname outright, and charts/hub-api has
# `ingress.enabled: false`, so there is no path into hub-api from the internet
# that skips the wall. That matters more here than for the other two: hub-api
# spends money per request (Claude Opus 5) and hands out Cube service tokens.
#
# ARCHITECTURE.md §5 wants a real OIDC provider with a `tier` claim in front of
# this app, and that is still the plan — it is what billing needs. Until it
# exists, this wall gives the chat agent the same posture Dagster and Streamlit
# already have, with no IdP decision taken under deadline. Every user that gets
# past it is treated as tier `free` (hub_api/chat.py).
#
# `email_domains = "*"` is deliberately absent: the allowlist below is the whole
# access-control policy. Widening it is the one edit that turns this into a
# public, metered surface, and it should be a conscious one.

replicaCount: 1

image:
  repository: oauth2-proxy/oauth2-proxy
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secret. Keys the chart expects: client-id, client-secret, cookie-secret.
#   cookie-secret  — generated by platform-base (app/oauth2-proxy-app-secret),
#                    read back on every upgrade so sessions survive a redeploy.
#   client-id / client-secret — patched in by deploy-platform.yml from the repo
#                    secrets APP_OIDC_CLIENT_ID / APP_OIDC_CLIENT_SECRET, which
#                    currently resolve to Dagster's Google client (the same
#                    reuse Streamlit's wall makes). That client must list
#                    https://app.open-health-data-platform.org/oauth2/callback
#                    among its authorized redirect URIs or login fails with
#                    redirect_uri_mismatch — a Google Cloud console edit, not a
#                    deploy step.
# ---------------------------------------------------------------------------
config:
  existingSecret: oauth2-proxy-app-secret

  configFile: |-
    provider = "google"
    upstreams = [ "http://hub-api.app.svc.cluster.local:8000/" ]
    redirect_url = "https://app.open-health-data-platform.org/oauth2/callback"
    reverse_proxy = true
    cookie_secure = true
    skip_provider_button = true
    # hub-api reads the signed-in identity from X-Forwarded-Email and uses it as
    # the quota subject and the chat-log key (hub_api/chat.py). Without this the
    # header never reaches the upstream and every request is a 401.
    set_xauthrequest = true
    pass_user_headers = true
    # A chat answer streams for tens of seconds. The proxy's default flush
    # interval would hold SSE frames in a buffer and deliver the whole answer at
    # once, which defeats the point of streaming it.
    flush_interval = "100ms"
    # An expired session must not answer a fetch() with a 302 to Google's login
    # page — the browser would follow it and the page would try to parse a login
    # form as SSE. 401 lets the UI say "sign in again".
    api_routes = [ "/api/" ]

authenticatedEmailsFile:
  enabled: true
  restricted_access: |-
    kgmcquate@gmail.com

ingress:
  enabled: true
  className: traefik
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - app.open-health-data-platform.org
  tls:
    - secretName: hub-api-tls
      hosts:
        - app.open-health-data-platform.org

service:
  type: ClusterIP
  portNumber: 80

# Same small footprint as the other two walls.
resources:
  requests:
    cpu: 10m
    memory: 25Mi
  limits:
    cpu: 50m
    memory: 64Mi

metrics:
  enabled: false
