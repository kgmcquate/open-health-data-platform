# Values for the upstream chart: external-secrets/external-secrets  (pinned in the Makefile)
#
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets \
#     -f platform/helm/values/external-secrets.yaml
#
# Pulls Stripe / OIDC / R2 / source API keys out of Doppler. The ClusterSecretStore
# and ExternalSecret objects are in charts/external-secrets-config.

installCRDs: true

replicaCount: 1

# Shares the small infra budget (ARCHITECTURE.md §4). Three deployments
# (controller, webhook, cert-controller) — keep each tiny.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
