# Values for the upstream chart: oauth2-proxy/oauth2-proxy
#
#   helm repo add oauth2-proxy https://oauth2-proxy.github.io/manifests
#   helm upgrade --install oauth2-proxy oauth2-proxy/oauth2-proxy -n data \
#     -f platform/helm/values/oauth2-proxy.yaml
#
# The Google login wall in front of the Dagster UI (ADR-0007), and, path-routed
# on the same host, the dagster-monitoring dashboard. Every request is
# authenticated here before it reaches anything.
#
#   Cloudflare -> Traefik -> Ingress(dagster.ohdp) -> THIS -> /             -> graphql-authz-proxy -> dagster-webserver
#                                                          -> /monitoring/  -> dagster-monitoring
#
# oauth2-proxy forwards X-Forwarded-Email / -User / -Preferred-Username, which
# graphql-authz-proxy reads to resolve a user. kgmcquate@gmail.com -> admin;
# every other Google account -> public-viewer (read-only allowlist). There is no
# anonymous path anymore — neither backing Service has its own Ingress.

replicaCount: 1

image:
  repository: oauth2-proxy/oauth2-proxy
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secret. Keys the chart expects: client-id, client-secret, cookie-secret.
#   cookie-secret  — generated by platform-base (data/oauth2-proxy-secret),
#                    read back on every upgrade so sessions survive a redeploy.
#   client-id / client-secret — patched in by deploy-platform.yml from the repo
#                    secrets DAGSTER_OIDC_CLIENT_ID / DAGSTER_OIDC_CLIENT_SECRET.
#                    (Google Cloud console: a "Web application" OAuth client with
#                    redirect URI https://dagster.open-health-data-platform.org/oauth2/callback)
# ---------------------------------------------------------------------------
config:
  existingSecret: oauth2-proxy-secret

  # Setting configFile puts the chart in "inline-custom" mode: this block is the
  # entire oauth2_proxy.cfg, so email_domains and upstreams must live here too.
  #
  # Two upstreams share this one Google wall + host, routed by request path.
  # oauth2-proxy tries upstreams in list order and matches by literal path
  # prefix (not Go ServeMux subtree semantics — a bare "/monitoring" request
  # does NOT match a registered "/monitoring/" prefix and silently falls
  # through to the catch-all "/"), so BOTH the with- and without-trailing-
  # slash forms are listed here, ahead of the catch-all — reversing this order
  # would swallow every request into gqlproxy. dagster-monitoring's own nginx
  # 301s a bare /monitoring to /monitoring/, so routing the slash-less form to
  # it too is sufficient. The monitoring app expects its BASE_PATH-prefixed
  # path forwarded as-is (no rewrite) — see charts/dagster-monitoring/values.yaml.
  configFile: |-
    provider = "google"
    email_domains = [ "*" ]
    upstreams = [
      "http://dagster-monitoring.data.svc.cluster.local:80/monitoring/",
      "http://dagster-monitoring.data.svc.cluster.local:80/monitoring",
      "http://gqlproxy-graphql-authz-proxy.data.svc.cluster.local:80/",
    ]
    redirect_url = "https://dagster.open-health-data-platform.org/oauth2/callback"
    # Traefik terminates TLS and sets X-Forwarded-Proto; trust it so the derived
    # redirect/callback URLs are https and the real client IP is logged.
    reverse_proxy = true
    cookie_secure = true
    # gqlproxy authorizes on these headers — must be forwarded to the upstream.
    pass_user_headers = true
    # One provider, one IdP: skip the "Sign in with Google" interstitial.
    skip_provider_button = true

# ---------------------------------------------------------------------------
# Ingress. This chart owns dagster.ohdp and the dagster-tls cert; the
# graphql-authz-proxy chart's own Ingress is disabled (ingress.enabled: false
# in its values.yaml) so it never competes for the same host+path — see
# ADR-0007.
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: traefik
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - dagster.open-health-data-platform.org
  tls:
    - secretName: dagster-tls
      hosts:
        - dagster.open-health-data-platform.org

service:
  type: ClusterIP
  portNumber: 80

# §4: shares the 0.3 GB ingress/cert-manager/proxy budget line. This is a small
# Go binary — a few MB resident — but the node runs near its ceiling, so the
# limit is real.
resources:
  requests:
    cpu: 10m
    memory: 25Mi
  limits:
    cpu: 50m
    memory: 64Mi

# The chart's default securityContext is already hardened — nonroot uid 2000,
# drop ALL caps, readOnlyRootFilesystem, seccomp RuntimeDefault — so it is left
# as-is here.

metrics:
  enabled: false
