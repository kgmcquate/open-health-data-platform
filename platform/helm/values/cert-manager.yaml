# Values for the upstream chart: jetstack/cert-manager
#
#   helm repo add jetstack https://charts.jetstack.io
#   helm upgrade --install cert-manager jetstack/cert-manager -n infra \
#     -f platform/helm/values/cert-manager.yaml
#
# Issues the TLS certs for the Traefik Ingresses. HTTP-01 challenge over the
# `traefik` ingress class — the `letsencrypt-prod` ClusterIssuer is rendered by
# the platform-base chart and applied by `make cluster-issuer` once these CRDs
# exist.

# The chart can install its own CRDs; keep it in one release so upgrades are
# a single `helm upgrade`.
crds:
  enabled: true
  keep: true

replicaCount: 1

# Pinned to the default/ingress pool (platform/terraform/main.tf) with Traefik,
# whose Ingresses it issues certs for. Every component, including the
# post-install startupapicheck Job, so none of them drift onto `services`.
nodeSelector:
  node-role: ingress

# Small footprint — shares the 0.3 GB ingress/cert-manager budget line (§4).
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

webhook:
  nodeSelector:
    node-role: ingress
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

cainjector:
  nodeSelector:
    node-role: ingress
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

startupapicheck:
  nodeSelector:
    node-role: ingress
