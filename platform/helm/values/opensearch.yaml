# Values for the upstream chart: opensearch/opensearch
#
#   helm repo add opensearch https://opensearch-project.github.io/helm-charts
#   helm upgrade --install opensearch opensearch/opensearch -n meta \
#     -f platform/helm/values/opensearch.yaml
#
# One of the larger memory consumers on the node (2 GB limit / 1 GB heap; see
# the resources note below). Installed standalone rather than via
# openmetadata-dependencies so we don't also get MySQL and Airflow.

clusterName: "opensearch-cluster"
nodeGroup: "master"
masterService: "opensearch-cluster-master"

# Single node. Not HA — that is the design (§1.4, §9).
replicas: 1
roles:
  - master
  - ingest
  - data

singleNode: true

# 1 GB heap. ARCHITECTURE.md §4 budgeted 3 GB on a 16 GB Hetzner node; the DOKS
# default node is 8 GB, so OpenSearch is squeezed to make room for Dagster and
# BI. Fine for a search index over public metadata at this scale — revisit if
# the node grows or the index does.
opensearchJavaOpts: "-Xmx1g -Xms1g"

# Limit must exceed heap: the JVM needs off-heap space for Lucene, threads and
# direct buffers.
resources:
  requests:
    cpu: 250m
    memory: 1280Mi
  limits:
    cpu: "2"
    memory: 2Gi

persistence:
  enabled: true
  # DOKS default StorageClass — CSI-backed DigitalOcean block storage.
  storageClass: do-block-storage
  size: 20Gi

config:
  opensearch.yml: |
    cluster.name: opensearch-cluster
    network.host: 0.0.0.0
    discovery.type: single-node
    # This cluster holds a search index over public metadata and is reachable
    # only from inside the cluster. The security plugin costs memory we do not
    # have; the NetworkPolicy below is the control instead.
    plugins.security.disabled: true

# 1 shard / 0 replicas on a single node — anything else stays yellow forever.
# number_of_shards / number_of_replicas are index-level settings: OpenSearch
# refuses to boot if they are in opensearch.yml. Push them from a postStart hook
# instead: a `*` index template for indices created later, plus a one-shot
# `_all/_settings` for any index (e.g. OpenMetadata's) that predates the hook.
lifecycle:
  postStart:
    exec:
      command:
        - bash
        - -c
        - |
          until curl -sf localhost:9200/_cluster/health >/dev/null; do sleep 5; done
          curl -sf -X PUT localhost:9200/_index_template/single-node-defaults \
            -H 'Content-Type: application/json' \
            -d '{"index_patterns":["*"],"priority":1,"template":{"settings":{"number_of_shards":1,"number_of_replicas":0}}}'
          curl -sf -X PUT localhost:9200/_all/_settings \
            -H 'Content-Type: application/json' \
            -d '{"index":{"number_of_replicas":0}}' || true

extraEnvs:
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"

rbac:
  create: false

networkPolicy:
  create: true
  # Only OpenMetadata may talk to OpenSearch.
  http:
    enabled: true

sysctlInit:
  enabled: true # sets vm.max_map_count; also pre-set by cloud-init
