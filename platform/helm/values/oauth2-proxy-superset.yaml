# Values for the upstream chart: oauth2-proxy/oauth2-proxy
#
#   helm upgrade --install oauth2-proxy-superset oauth2-proxy/oauth2-proxy -n bi \
#     -f platform/helm/values/oauth2-proxy-superset.yaml
#
# The Google login wall in front of Superset. A second, independent release
# from values/oauth2-proxy.yaml (different host, different cookie, different
# audience) — Superset is an internal analytics tool at this stage, not a
# public surface like Dagster, so this wall only lets kgmcquate@gmail.com past
# it. Superset still runs its own Flask-AppBuilder login/role management behind
# this gate; this is the outer perimeter, not a replacement for it.
#
#   Cloudflare -> Traefik -> Ingress(superset.ohdp) -> THIS -> superset-web-server
#
# Revisit if Superset ever needs to be reachable by more than the operator —
# either widen authenticatedEmailsFile here, or move to Superset's own planned
# OIDC (ARCHITECTURE.md §5: "OIDC via Flask-AppBuilder; embedded uses guest
# tokens. Role mapped from IdP group claim") and retire this wall.

replicaCount: 1

image:
  repository: oauth2-proxy/oauth2-proxy
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Secret. Keys the chart expects: client-id, client-secret, cookie-secret.
#   cookie-secret  — generated by platform-base (bi/oauth2-proxy-superset-secret),
#                    read back on every upgrade so sessions survive a redeploy.
#   client-id / client-secret — patched in by deploy-platform.yml from the repo
#                    secrets SUPERSET_OIDC_CLIENT_ID / SUPERSET_OIDC_CLIENT_SECRET.
#                    (Google Cloud console: a separate "Web application" OAuth
#                    client from Dagster's, redirect URI
#                    https://superset.open-health-data-platform.org/oauth2/callback)
# ---------------------------------------------------------------------------
config:
  existingSecret: oauth2-proxy-superset-secret

  configFile: |-
    provider = "google"
    upstreams = [ "http://superset-web-server.bi.svc.cluster.local:8088/" ]
    redirect_url = "https://superset.open-health-data-platform.org/oauth2/callback"
    reverse_proxy = true
    cookie_secure = true
    skip_provider_button = true

authenticatedEmailsFile:
  enabled: true
  restricted_access: |-
    kgmcquate@gmail.com

ingress:
  enabled: true
  className: traefik
  path: /
  pathType: Prefix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - superset.open-health-data-platform.org
  tls:
    - secretName: superset-tls
      hosts:
        - superset.open-health-data-platform.org

service:
  type: ClusterIP
  portNumber: 80

# Same small footprint as the Dagster oauth2-proxy (values/oauth2-proxy.yaml).
resources:
  requests:
    cpu: 10m
    memory: 25Mi
  limits:
    cpu: 50m
    memory: 64Mi

metrics:
  enabled: false
