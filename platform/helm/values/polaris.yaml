# Values for the upstream Apache Polaris chart — the Iceberg REST catalog (ADR-0010).
#
#   helm repo add polaris https://downloads.apache.org/polaris/helm-chart   # (make repos)
#   helm upgrade --install polaris polaris/polaris \
#     --version $(POLARIS_VERSION) -n data -f platform/helm/values/polaris.yaml
#
# Chart version is pinned in the Makefile (POLARIS_VERSION), same rule as every
# other upstream chart (ADR-0006 — "upstream chart, our values").
#
# Metastore is the shared Postgres `polaris` database (platform-base). The schema
# and the `ohdp` realm + root principal are created by the `bootstrap-schema` init
# container below (polaris-admin-tool — the chart has no bootstrap job); the
# `ohdp` catalog is created after the server is up by
# `platform/scripts/polaris-bootstrap.sh catalog`. Data + manifests live in
# Spaces (s3://ohdp-warehouse).

replicaCount: 1

# Image tag defaults to the chart's appVersion (== POLARIS_VERSION). Do not pin
# it here — bumping the chart bumps the image with it.

# JVM. ARCHITECTURE.md §4's budget is tight — this is the cost of a REST catalog
# over a pyiceberg SqlCatalog. Cap it hard.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# ---------------------------------------------------------------------------
# Persistence: relational-jdbc against the shared Postgres. `polaris-persistence`
# (jdbcUrl / username / password) is generated by platform-base in the `data`
# namespace from postgres-secret — no external input. The DDL is applied by the
# init container below on first boot.
# ---------------------------------------------------------------------------
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-persistence
      jdbcUrl: jdbcUrl
      username: username
      password: password

# ---------------------------------------------------------------------------
# Schema + realm bootstrap. The chart ships no bootstrap job, so run
# polaris-admin-tool as an init container: it creates the metastore schema (on a
# fresh DB) and the `ohdp` realm with its root principal. Idempotent since
# Polaris 1.7.0 — an already-bootstrapped realm is skipped with exit 0 — so this
# is safe to re-run on every rollout.
#
#   - `image` is `tpl`-rendered by the chart; AppVersion tracks POLARIS_VERSION.
#   - datasource config comes from the same `polaris-persistence` secret the
#     server uses.
#   - `polaris-bootstrap` (key `credential` = "ohdp,<clientId>,<clientSecret>",
#     the same principal as the pipeline's OHDP_ICEBERG_CREDENTIAL) is generated
#     by platform-base. Passed via $(VAR) env substitution so the client secret
#     never lands in the pod's args / `kubectl describe`.
# ---------------------------------------------------------------------------
extraInitContainers:
  - name: bootstrap-schema
    image: "apache/polaris-admin-tool:{{ .Chart.AppVersion }}"
    imagePullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    args: ["bootstrap", "-r", "ohdp", "-c", "$(BOOTSTRAP_CREDENTIAL)"]
    env:
      - name: polaris.persistence.type
        value: relational-jdbc
      - name: quarkus.datasource.jdbc.url
        valueFrom: { secretKeyRef: { name: polaris-persistence, key: jdbcUrl } }
      - name: quarkus.datasource.username
        valueFrom: { secretKeyRef: { name: polaris-persistence, key: username } }
      - name: quarkus.datasource.password
        valueFrom: { secretKeyRef: { name: polaris-persistence, key: password } }
      - name: BOOTSTRAP_CREDENTIAL
        valueFrom: { secretKeyRef: { name: polaris-bootstrap, key: credential } }

# ---------------------------------------------------------------------------
# One realm, `ohdp`, which is therefore the default. requireHeader stays false so
# the pyiceberg REST client (ohdp_ingestion.iceberg) does not have to send a
# realm header — there is only one realm to resolve.
# ---------------------------------------------------------------------------
realmContext:
  type: default
  realms:
    - ohdp
  requireHeader: false

# ---------------------------------------------------------------------------
# Internal token service. tokenBroker keys are pod-generated: with replicaCount 1
# that is fine, and the pipeline re-auths with its client_credentials grant
# (OHDP_ICEBERG_CREDENTIAL) on every run, so a key roll on pod restart only
# invalidates already-issued tokens. Give it a secret here if this ever scales
# past one replica (production docs → "Scaling").
# ---------------------------------------------------------------------------
authentication:
  type: internal
  tokenBroker:
    type: rsa-key-pair
    maxTokenGeneration: PT1H

# ---------------------------------------------------------------------------
# Storage: no credentials handed to Polaris. It does not vend scoped creds for
# non-AWS S3 (Spaces), so the catalog is created with
# `skip-credential-subscoping-indirection=true` (polaris-bootstrap.sh catalog) and
# the pipeline passes s3.* to pyiceberg itself (ohdp_ingestion.iceberg._s3_props).
# Polaris only stores the warehouse root + allowed locations.
# ---------------------------------------------------------------------------
storage:
  secret:
    name: ""

# Reached in-cluster at http://polaris.data.svc.cluster.local:8181/api/catalog
# (OHDP_ICEBERG_CATALOG_URI, platform-base pipelineConfig). Public exposure
# (catalog.ohdp.kevinmcquate.com behind oauth2-proxy, ARCHITECTURE.md §5) is not
# wired yet.
service:
  type: ClusterIP

ingress:
  enabled: false

serviceAccount:
  create: true

# Table maintenance (snapshot expiry, orphan-file cleanup) ships as CronJobs
# under `maintenance.jobs.*`, all `enabled: false` by default. Turn them on once
# `curated` data exists and the retention story is decided (ADR-0010).
