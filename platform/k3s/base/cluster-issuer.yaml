# Let's Encrypt production issuer. HTTP-01 challenge solved through the Traefik
# ingress class (ARCHITECTURE.md §5 / platform/README.md).
#
# Applied by `make cert-manager` after the cert-manager CRDs exist. The charts
# reference it as `cert-manager.io/cluster-issuer: letsencrypt-prod`.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: kgmcquate@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            class: traefik
