# Dimensions and their descriptions come straight from dbt's column docs
# (globals.py / cube-dbt) — edit descriptions in
# data/dbt/models/curated/respiratory/_curated_respiratory__models.yml, not here.
#
# Measures still have to be hand-written: dbt documents columns, it doesn't
# declare aggregations, so the two measures below are the one place in the
# whole pipeline where "average occupancy" gets defined as AVG(...).
{% set model = dbt_model('respiratory__hospital_load') %}
{% set ed = dbt_model('respiratory__ed_visit_share_weekly') %}
{% set rsv = dbt_model('respiratory__rsv_hospitalization_weekly') %}
{% set burden = dbt_model('respiratory__hospital_burden_weekly') %}

{% set ed_measures = ['percent_of_ed_visits', 'percent_of_ed_visits_smoothed'] %}
{% set rsv_measures = ['hospitalization_rate_per_100k'] %}
{% set burden_measures = [
    'admissions_covid', 'admissions_covid_adult', 'admissions_covid_pediatric',
    'admissions_influenza', 'avg_daily_admissions_covid',
    'avg_daily_admissions_influenza', 'pct_inpatient_beds_covid',
    'pct_icu_beds_covid', 'pct_inpatient_beds_influenza',
    'pct_icu_beds_influenza', 'pct_inpatient_beds_occupied',
    'pct_icu_beds_occupied', 'pct_days_reporting',
] %}

cubes:
  - {{ model.as_cube() }}

    dimensions:
      {{ model.as_dimensions(skip=['avg_covid_inpatients', 'avg_occupancy']) }}

    measures:
      # mart_respiratory_hospital_load pre-aggregates to one row per
      # state+week, so these are a mean of weekly means, not of raw daily
      # values — an avg-of-an-avg. Fine for this stub; revisit against
      # core_hospital_utilization_daily's daily grain if a real KPI needs it.
      - name: avg_covid_inpatients
        sql: avg_covid_inpatients
        type: avg
        description: {{ model.column('avg_covid_inpatients').description }}

      - name: avg_occupancy
        sql: avg_occupancy
        type: avg
        description: {{ model.column('avg_occupancy').description }}

      - name: state_week_count
        type: count
        description: "Number of state-weeks in the current filter — a sanity-check measure, not a KPI."

  # --- CDC respiratory surveillance (ADR-0018) -------------------------------

  - {{ ed.as_cube() }}

    dimensions:
      {{ ed.as_dimensions(skip=ed_measures) }}

    measures:
      # Percentages of all ED visits, so averaged never summed. The four
      # pathogen values overlap -- 'Combined' is CDC's own union of the other
      # three -- so the per-pathogen measures filter explicitly rather than
      # letting a query sum across them.
      - name: avg_percent_of_ed_visits
        sql: percent_of_ed_visits_smoothed
        type: avg
        description: >-
          Mean smoothed share of ED visits across the selection. Filter to one
          pathogen: the categories are not mutually exclusive.

      - name: avg_percent_covid
        sql: percent_of_ed_visits_smoothed
        type: avg
        filters:
          - sql: "{CUBE}.pathogen = 'COVID-19'"
        description: Mean share of ED visits attributed to COVID-19.

      - name: avg_percent_influenza
        sql: percent_of_ed_visits_smoothed
        type: avg
        filters:
          - sql: "{CUBE}.pathogen = 'Influenza'"
        description: Mean share of ED visits attributed to influenza.

      - name: avg_percent_rsv
        sql: percent_of_ed_visits_smoothed
        type: avg
        filters:
          - sql: "{CUBE}.pathogen = 'RSV'"
        description: Mean share of ED visits attributed to RSV.

      - name: peak_percent_of_ed_visits
        sql: percent_of_ed_visits_smoothed
        type: max
        description: Highest weekly share of ED visits reached in the selection.

  - {{ rsv.as_cube() }}

    dimensions:
      {{ rsv.as_dimensions(skip=rsv_measures) }}

    measures:
      - name: avg_hospitalization_rate_per_100k
        sql: hospitalization_rate_per_100k
        type: avg
        description: >-
          Mean weekly RSV hospitalisation rate per 100,000 across the selection.
          A rate -- never summed.

      - name: peak_hospitalization_rate_per_100k
        sql: hospitalization_rate_per_100k
        type: max
        description: Highest weekly RSV hospitalisation rate reached in the selection.

      - name: surveillance_week_count
        type: count
        description: "Number of state-weeks in the current filter -- a coverage check, not a KPI."

  - {{ burden.as_cube() }}

    dimensions:
      {{ burden.as_dimensions(skip=burden_measures) }}

    measures:
      # Admissions are counts (additive); bed percentages are ratios (averaged).
      - name: total_admissions_covid
        sql: admissions_covid
        type: sum
        description: {{ burden.column('admissions_covid').description }}

      - name: total_admissions_influenza
        sql: admissions_influenza
        type: sum
        description: {{ burden.column('admissions_influenza').description }}

      - name: total_admissions_covid_pediatric
        sql: admissions_covid_pediatric
        type: sum
        description: {{ burden.column('admissions_covid_pediatric').description }}

      - name: avg_pct_inpatient_beds_covid
        sql: pct_inpatient_beds_covid
        type: avg
        description: {{ burden.column('pct_inpatient_beds_covid').description }}

      - name: avg_pct_icu_beds_covid
        sql: pct_icu_beds_covid
        type: avg
        description: {{ burden.column('pct_icu_beds_covid').description }}

      - name: avg_pct_inpatient_beds_occupied
        sql: pct_inpatient_beds_occupied
        type: avg
        description: {{ burden.column('pct_inpatient_beds_occupied').description }}

      - name: avg_pct_days_reporting
        sql: pct_days_reporting
        type: avg
        description: >-
          Mean reporting completeness. Read any admissions trend against this:
          NHSN reporting became voluntary in May 2024, so a fall in admissions
          may be a fall in reporting.
