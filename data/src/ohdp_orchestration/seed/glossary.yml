# Seed glossary, applied by ohdp_orchestration.assets.openmetadata_seed_sync.
# Keep definitions population-level and non-clinical (ARCHITECTURE.md §10).
glossary:
  name: Public Health Data
  description: >
    Population-level public health terminology used across curated datasets.
    Definitions are population-level and non-clinical (ARCHITECTURE.md §10).
  terms:
    - name: PM2.5
      description: >
        Fine particulate matter under 2.5 microns, mass concentration in µg/m³.
        Reported as a population/area average, not a personal exposure estimate.
    - name: ILI
      description: >
        Influenza-like illness: a surveillance case definition (fever plus cough
        or sore throat), not a clinical diagnosis.
