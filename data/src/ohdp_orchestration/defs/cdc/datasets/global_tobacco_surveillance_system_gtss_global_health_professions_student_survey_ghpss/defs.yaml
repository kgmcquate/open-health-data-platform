  description: 2005-2011. The World Health Organization, CDC, and the Canadian Public Health Association,
    developed the GHPSS to collect data on tobacco use and cessation counseling among health professional
    students in all WHO member states. GHPSS is a standardized school-based survey of third-year students
    pursuing advanced degrees in dentistry, medicine, nursing, or pharmacy. It is conducted in schools
    during regular class sessions. GHPSS follows an anonymous, self-administered format for data collection.
    GHPSS uses a core questionnaire on demographics, prevalence of cigarette smoking and other tobacco
