  description: This dataset contains model-based county-level estimates for the PLACES project 2020 release
    in GIS-friendly format. The PLACES project is the expansion of the original 500 Cities project and
    covers the entire United States—50 states and the District of Columbia (DC)—at county, place, census
    tract, and ZIP Code tabulation Areas (ZCTA) levels. It represents a first-of-its kind effort to release
