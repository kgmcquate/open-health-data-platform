  description: '"This public use dataset includes case-level data from confirmed MIS-C cases with illness
    onset February 2020 through December 2022 that were reported to CDC’s National MIS-C Surveillance
    system. Reports are from 55 U.S. jurisdictions (all 50 states plus New York City, Guam, Puerto Rico,
    US Virgin Islands, and Washington DC). All cases meet the 2020 CDC MIS-C case definition. U.S. jurisdictions
    voluntarily report potential MIS-C cases to CDC using a standardized case report form. To protect
    patient privacy, location information has been consolidated to census region, illness onset dates
    have b'
  columns:
  - name: sex
    type: text
    description: 'Reported sex: Male, Female, or Unknown when sex was not reported'
  - name: vaccination_status
    type: text
    description: Reported among vaccine-eligible children only. “Vaccinated” defined as report of receiving
      1 or more COVID-19 vaccine dose with receipt of last dose 28 days or more prior to MIS-C onset.
      “Unvaccinated” defined as report of receiving no vaccine doses. Vaccination status classified as
      “unknown” if vaccination was marked as “unknown” on case report form or vaccination data were missing.
  - name: vaccine_eligiblity
    type: text
    description: '“Vaccine-eligible” children are defined as children who were eligible to complete a
      2-dose COVID-19 vaccination primary series with enough time to develop immunity prior to onset of
      MIS-C. Age criteria for vaccine eligibility: children who were 8 months or older at time of MIS-C
      onset (6 months being the minimum recommended age for COVID-19 vaccination + 28 days to receive
      2 vaccine doses in primary series + 28 days to develop immunity [14 days from last vaccine dose
      plus 14 days for potential MIS-C]). For each vaccine-eligible age group (8 months to <5 years, 5
      to 11 years, and 12-20 years, eligibility was defined using the date of ACIP recommendation for
      vaccination plus time to receive 2-dose primary series + 28 days to develop immunity. Children who
      did not meet the above criteria at time of report were classified as vaccine-ineligible.'
  - name: dose1_ivig
