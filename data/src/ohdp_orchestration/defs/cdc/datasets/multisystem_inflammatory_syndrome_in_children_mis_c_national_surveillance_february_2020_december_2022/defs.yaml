  - name: severe_gi_involvement
    type: checkbox
    description: Severe gastrointestinal involvement defined as presence of appendicitis, appendiceal
      changes, cholecystitis, gallbladder abnormalities, colitis, enteritis, free fluid in abdomen or
      pelvis, hepatomegaly, splenomegaly, or mesenteric adenitis seen on imaging, or clinical diagnosis
