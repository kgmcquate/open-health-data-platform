  - name: case_def_renal_involvement
    type: checkbox
    description: Renal involvement defined as clinical diagnosis of acute kidney injury or renal failure
  - name: case_def_hematologic_involvement
    type: checkbox
    description: Hematologic involvement defined as elevated D-dimer, thrombophilia, deep venous thrombosis,
