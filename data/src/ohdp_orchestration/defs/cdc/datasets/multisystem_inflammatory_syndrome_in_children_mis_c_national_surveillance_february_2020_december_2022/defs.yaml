  - name: case_def_dermatologic_involvement
    type: checkbox
    description: Dermatologic involvement defined as rash, mucocutaneous lesions, erythema or edema of
      the extremities, or conjunctival injection
  - name: cardiac_dysfunction
    type: checkbox
    description: Cardiac dysfunction including right or left ventricular dysfunction on echocardiogram
