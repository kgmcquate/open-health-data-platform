  - name: antiplatelets
    type: checkbox
    description: Treated with antiplatelets (e.g., aspirin, clopidogrel)
  - name: steroids
    type: checkbox
    description: Treated with systemic intravenous or oral steroids (e.g. methylprednisolone, prednisone)
  - name: intubation_mechvent
    type: checkbox
    description: Intubated or treated with mechanical ventilation
  - name: any_comorbidity
    type: checkbox
