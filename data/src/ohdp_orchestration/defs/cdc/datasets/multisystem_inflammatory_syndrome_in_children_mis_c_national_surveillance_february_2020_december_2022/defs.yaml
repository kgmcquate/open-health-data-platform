  - name: case_def_gi_involvement
    type: checkbox
    description: Gastrointestinal involvement defined as abdominal pain, vomiting, diarrhea, elevated
      bilirubin, elevated liver enzymes, clinical diagnosis of liver failure, or imaging showing abdominal
