  - name: severe_hematologic_involvement
    type: checkbox
    description: Severe hematologic involvement defined as presence of pulmonary embolism or deep vein
      thrombosis, lymphopenia (absolute lymphocyte count <4,500 cells/µL if age <8 months or <1,500 cells/µL
      if age ≥8 months), neutropenia (absolute neutrophil count <500 cells/µL), or thrombocytopenia (platelets
      <150/µL)
  - name: severe_renal_involvement
    type: checkbox
    description: Severe renal involvement defined as presence of acute kidney injury, renal failure, or
      receipt of dialysis treatment
  - name: severe_cardiac_involvement
    type: checkbox
    description: Severe cardiac involvement defined as presence of arrhythmia or other EKG changes, any
      cardiac dysfunction (left and/or right ventricular dysfunction) on echocardiogram, congestive heart
      failure, coronary artery aneurysm or dilatation, myocarditis, pericardial effusion or pericarditis
      on chest imaging or echocardiogram, elevated troponin, elevated (BNP) or N-terminal pro-brain natriuretic
      peptide (NT-proBNP) level ≥ 1000 pg/mL, support using extracorporeal membranous oxygenation, or
      shock or receipt of vasopressors
  - name: case_def_neurologic_involvement
    type: checkbox
    description: Neurologic involvement defined as headache, altered mental status, encephalopathy, clinical
      diagnosis or imaging indicative of meningitis, encephalitis, stroke/cerebrovascular accident (CVA),
      or abnormal cerebrospinal fluid white blood cells, protein, or glucose levels
  - name: case_def_resp_involvement
    type: checkbox
    description: Respiratory involvement defined as cough, shortness of breath, chest pain or tightness,
      or any clinical diagnosis or imaging showing pneumonia, atelectasis, acute respiratory distress
      syndrome (ARDS), or pleural effusion
  - name: case_def_cardiac_involvement
    type: checkbox
    description: Cardiac involvement defined as clinical shock diagnosis, vasopressor receipt, elevated
      troponin, elevated brain natriuretic peptide (BNP) or N-terminal pro-brain natriuretic peptide (NT-proBNP),
      arrhythmia or other EKG changes, congestive heart failure, myocarditis, pericarditis, pericardial
      effusion, coronary artery aneurysm or dilatation, cardiac dysfunction (left and/or right ventricular
      dysfunction) on echocardiogram, mitral valve regurgitation (any severity), hypotension, or syncope
  - name: outcome
