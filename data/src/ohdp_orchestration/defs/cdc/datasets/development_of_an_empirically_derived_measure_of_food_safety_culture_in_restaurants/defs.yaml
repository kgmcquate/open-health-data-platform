  description: A poor food safety culture has been described as an emerging risk factor for foodborne
    illness outbreaks, yet there has been little research on this topic in the retail food industry. The
    purpose of this study was to identify and validate conceptual domains around food safety culture and
    develop an assessment tool that can be used to assess food workers’ perceptions of their restaurant’s
    food safety culture. The study, conducted from March 2018 through March 2019, surveyed restaurant
    food workers for their level of agreement with 28 statements. We received 579 responses from 331 restaurants
    sp
