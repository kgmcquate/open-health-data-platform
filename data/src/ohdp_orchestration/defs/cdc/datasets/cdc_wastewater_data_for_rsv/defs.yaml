  description: 'This dataset provides a complete time history of RSV wastewater sample data and calculated
    metrics from US sampling locations. CDC’s National Wastewater Surveillance System (NWSS) includes
    data collected and reported by: • All data with a source designation of “State_Territory” were generated
    by state and local health departments are reported to CDC and supported with funding through the Epidemiology
