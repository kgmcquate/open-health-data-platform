  description: Community-Based Survey of Supports for Healthy Eating and Active Living (CBS HEAL) is a
    CDC survey of a nationally representative sample of U.S. municipalities to better understand existing
    community-level policies and practices that support healthy eating and active living. The survey collects
    information about policies such as nutrition standards, incentives for healthy food retail, bike/pedestrian-friendly
    design, and Complete Streets. About 2,000 municipalities respond to the survey. Participating municipalities
    receive a report that allows them to compare their policies and practices with
