    ferret tissues
  publisher: data.cdc.gov
  enabled: false
  cadence: weekly
  raw_table: an_aggregated_dataset_of_day_3_post_inoculation_viral_titer_measurements_from_influenza_a_virus_infected_ferret_tissues
