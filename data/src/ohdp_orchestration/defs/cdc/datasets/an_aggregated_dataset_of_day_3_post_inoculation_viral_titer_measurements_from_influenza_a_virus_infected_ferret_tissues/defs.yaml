  description: Data from influenza A virus (IAV) infected ferrets (Mustela putorius furo) provides invaluable
    information towards the study of novel and emerging viruses that pose a threat to human health. This
    gold standard animal model can recapitulate many clinical signs of infection present in IAV-infected
    humans, supports virus replication of human and zoonotic strains without prior adaptation, and permits
    evaluation of virus transmissibility by multiple modes. While ferrets have been employed in risk assessment
    settings for >20 years, results from this work are typically reported in discrete stand-alon
  columns:
  - name: units
    type: text
    description: Binary column that indicates if log10 titers reported in NW columns are reported as EID50
      (titration in eggs, EID, LOD = 1.5) or PFU (titration in cells, PFU, LOD = 1). EID and PFU units
      are not interchangeable; See PMID 38760422 for limitations in drawing comparisons between viral
      titers derived from different units.
  - name: na
    type: text
    description: Categorical column indicating neuraminidase subtype of the inoculating virus.
  - name: hpai
    type: checkbox
    description: Binary column that indicates if the inoculating virus has been classified as a highly
      pathogenic avian influenza (HPAI) virus based on criteria of the intravenous pathogenicity index
      (TRUE) or is a low pathogenic avian influenza (LPAI) or non-avian virus (FALSE).
  - name: tr
    type: text
    description: Numerical columns reporting Trachea (Tr) tissue log10 titer/gram, in the units specified
      in ‘units’, collected from each ferret day 3 post-inoculation. NA, represents no tissue sample was
      collected. LOD, represents a tissue sample was collected but quantified at or below the limit of
      detection. Trachea tissue represents one piece collected midway between the larynx and lung.
  - name: ferret
    type: text
    description: Unique observational ID for each individual animal in the dataset.
  - name: virus
    type: text
    description: Unique identifier for each virus used to inoculate ferrets in the dataset.
  - name: ha
    type: text
    description: Categorical column indicating hemagglutinin subtype of the inoculating virus.
  - name: hpai_mbaa
    type: checkbox
    description: Binary column that indicates if the inoculating virus has been classified as a highly
      pathogenic avian influenza (HPAI) virus based on criteria of the intravenous pathogenicity index
      (TRUE) or is a low pathogenic avian influenza (LPAI) or non-avian virus (FALSE).
  - name: origin
    type: text
    description: Categorical column indicating the host origin of the inoculating virus. Avian, isolated
      from avian host or originated from an avian species during a zoonotic spillover to humans; human,
      human origin; swine, swine origin; canine, canine origin; variant, human infection with swine-origin
      virus.
  - name: inoc_dose
    type: number
    description: Numeric column that indicates the log10 infectious units used to intranasally inoculate
      the ferret (in a 1ml total volume, with virus diluted in PBS).
  - name: nt
    type: number
    description: Numerical columns reporting Nasal Turbinate (NT) tissue log10 titer/ml, in the units
      specified in ‘units’, collected from each ferret day 3 post-inoculation. Nasal Turbinate tissue
      was typically dislodged and removed using forceps via the nasal cavity (total weight of this specimen
      <100 mg).
  - name: lg
    type: text
    description: Numerical columns reporting Lung (Lg) tissue log10 titer/gram, in the units specified
      in ‘units’, collected from each ferret day 3 post-inoculation. NA, represents no tissue sample was
      collected. LOD, represents a tissue sample was collected but quantified at or below the limit of
      detection. Lung tissue represents sampling from all 5 ferret lobes, proximal to bronchi and/or sampled
      from locations with observed macroscopic pathology.
  - name: bnob
    type: text
    description: Numerical columns reporting Brain Olfactory Bulb (BnOB) tissue log10 titer/gram, in the
      units specified in ‘units’, collected from each ferret day 3 post-inoculation. NA, represents no
      tissue sample was collected. LOD, represents a tissue sample was collected but quantified at or
      below the limit of detection. Brain Olfactory Bulb tissue represents sample dislodged from the calvarium
      after removal of the brain (Bn).
  - name: bn
    type: text
    description: Numerical columns reporting Brain (Bn) tissue log10 titer/gram, in the units specified
      in ‘units’, collected from each ferret day 3 post-inoculation. NA, represents no tissue sample was
      collected. LOD, represents a tissue sample was collected but quantified at or below the limit of
      detection. Brain tissue represents caudal and/or rostral sections, and the reported titer is from
      either a pooled sample of both sections, or the highest of the two when titered separately.
  - name: int
    type: text
    description: Numerical columns reporting Intestine (Int) tissue log10 titer/gram, in the units specified
      in ‘units’, collected from each ferret day 3 post-inoculation. NA, represents no tissue sample was
      collected. LOD, represents a tissue sample was collected but quantified at or below the limit of
      detection. Intestine tissue represents pooled sampling of the duodenum, jejunum/ileum, and descending
      colon.
