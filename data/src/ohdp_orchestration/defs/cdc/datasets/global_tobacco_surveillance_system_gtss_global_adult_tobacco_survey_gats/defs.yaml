  description: 2008-2017. Centers for Disease Control and Prevention (CDC). Office on Smoking and Health
    (OSH) – Global Tobacco Surveillance System (GTSS) - Global Adult Tobacco Survey (GATS). The Global
    Adult Tobacco Survey (GATS) is the global standard to systematically monitor adult tobacco use and
    track key tobacco control indicators. GATS is a nationally representative household survey of adults
