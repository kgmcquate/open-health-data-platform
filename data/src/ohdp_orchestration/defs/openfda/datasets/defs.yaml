# Hand-maintained — openFDA has no multi-dataset catalog to scrape (see
# ohdp_orchestration.defs.openfda's docstring), unlike CDC/HealthData.gov/CMS's
# scripts/scrape_*.py. Add a new `---` document here for another openFDA
# endpoint (e.g. `drug/event`, `drug/label`, `device/event`) if one is ever
# ingested -- set incremental_cursor/primary_key only if the endpoint has a
# documented date field and unique identifier to page/upsert on (see
# ohdp_ingestion.openfda.source), otherwise leave both unset for full replace.
type: ohdp_orchestration.defs.openfda.component.OpenFDADataset
attributes:
  name: openFDA Drug Enforcement Reports
  enabled: true
  cadence: weekly
  raw_table: drug_enforcement
  endpoint: drug/enforcement
  search: 'country:"United States"'
  incremental_cursor: report_date
  primary_key: recall_number
  incremental_lag_days: 90
  source_url: https://open.fda.gov/apis/drug/enforcement/
  description: >-
    US drug recall enforcement reports -- recall reason, classification (I/II/III severity),
    status, distribution pattern and the recalling firm, one row per report. Merged on
    recall_number, paged ascending by report_date; every run re-fetches and re-merges the
    trailing 90 days so a report's status changing after publication (e.g. Ongoing ->
    Terminated) still gets picked up -- see ohdp_ingestion.openfda.source.

