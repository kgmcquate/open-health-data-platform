attributes:
  id: 7viv-bzwe
  name: Children Who Received an Investigation or Alternative Response
  publisher: U.S. Department of Health and Human Services
  enabled: true
  cadence: monthly
  raw_table: children_who_received_an_investigation_or_alternative_response
  incremental_cursor: socrata_updated_at
  row_limit: 500000
  source_url: https://healthdata.gov/d/7viv-bzwe
  page_views: 2972
  keywords:
  - child abuse
  - child welfare
  description: 'Counts and rates of children who received an investigation or alternative response from
    child protective services agencies for the last five federal fiscal years for which data are available.
    To view more National Child Abuse and Neglect Data System (NCANDS) findings, click link to summary
    page below: https://healthdata.gov/stories/s/kaeg-w7jc'
  columns:
  - name: _2016_rate_per_1_000_children
    type: number
    description: The frequency for each state of children who received investigation responses or alternative
      responses per 1,000 children younger than 18 years in the population for 2016. The state population
      estimates are from the U.S. Census Bureau. For the definitions of investigation responses, alternative
      responses, and the population estimates used to calculate the rates, see the Glossary and State
      Characteristics appendixes of Child Maltreatment 2019.
  - name: _2015_rate_per_1_000_children
    type: number
    description: The frequency for each state of children who received investigation responses or alternative
      responses per 1,000 children younger than 18 years in the population for 2015. The state population
      estimates are from the U.S. Census Bureau. For the definitions of investigation responses, alternative
      responses, and the population estimates used to calculate the rates, see the Glossary and State
      Characteristics appendixes of Child Maltreatment 2019.
  - name: percent_change_from_2015
    type: number
    description: The percent change was calculated by subtracting 2015 data from 2019 data, dividing the
      result by 2015 data, and multiplying by 100. A state must have reported data for both 2015 and 2019
      to have a percent change calculated.
  - name: _2019
    type: number
    description: The number of children (unique count) who received investigation responses or alternative
      responses from child protective services agencies and were reported to NCANDS for federal fiscal
      year 2019. For more information and definitions of investigation responses, alternative responses,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: _2018
    type: number
    description: The number of children (unique count) who received investigation responses or alternative
      responses from child protective services agencies and were reported to NCANDS for federal fiscal
      year 2018. For more information and definitions of investigation responses, alternative responses,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: _2017
    type: number
    description: The number of children (unique count) who received investigation responses or alternative
      responses from child protective services agencies and were reported to NCANDS for federal fiscal
      year 2017. For more information and definitions of investigation responses, alternative responses,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: _2016
    type: number
    description: The number of children (unique count) who received investigation responses or alternative
      responses from child protective services agencies and were reported to NCANDS for federal fiscal
      year 2016. For more information and definitions of investigation responses, alternative responses,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: state
    type: text
    description: The primary unit from which child maltreatment data are collected. This includes all
      50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
      includes a national row which displays the total sum, percentage, or rate for only those states
      included in the analysis.
  - name: _2017_rate_per_1_000_children
    type: number
    description: The frequency for each state of children who received investigation responses or alternative
      responses per 1,000 children younger than 18 years in the population for 2017. The state population
