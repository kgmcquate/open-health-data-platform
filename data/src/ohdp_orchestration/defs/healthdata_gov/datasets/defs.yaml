      (coverage). Includes both PICU and med-surge beds (beds in which medical or surgical pediatric patients
      may be routinely placed). Include any occupied surge/hallway/overflow beds that are open for use.
      This count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset of #4a,
      and reflects occupancy levels for beds reported in #3c. This field is required as of 2/2/2022.'
  - name: all_pediatric_inpatient_beds_7_day_coverage
    type: number
    description: 'Total number of pediatric beds in the facility that are currently set-up, staffed and
      able to be used for a patient within the reporting period (coverage). This count includes occupied
      and unoccupied inpatient pediatric beds including both PICU and med-surge beds (beds in which medical
      or surgical pediatric patients may be routinely placed). Include any surge/hallway/overflow beds
      that are open for use for a patient, regardless of whether they are occupied or available. This
      count excludes NICU, newborn nursery beds, and outpatient surgery beds. This is a subset of #3a.
      This field is required as of 2/2/2022.'
  - name: previous_day_admission_pediatric_covid_confirmed_0_4_7_day_sum
    type: number
    description: 'Sum of patients, by age group, who were admitted to an inpatient or ICU bed on the previous
      calendar day who had laboratory-confirmed COVID19 at the time of admission. The summary of age breakdowns
      should be identical to #18a. This includes patients ages 0-4, 5-11, and 12-17 years old admitted
      to any inpatient bed, regardless of whether the bed is designated as pediatric vs. adult. This field
      is required as of 2/2/2022. See Appendix D for the definition of laboratory-confirmed COVID-19.'
  - name: all_pediatric_inpatient_beds_7_day_sum
    type: number
    description: 'Sum of pediatric beds in the facility that are currently set-up, staffed and able to
      be used for a patient within the reporting period (coverage). This count includes occupied and unoccupied
      inpatient pediatric beds including both PICU and med-surge beds (beds in which medical or surgical
