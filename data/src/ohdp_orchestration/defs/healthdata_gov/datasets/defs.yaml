  description: 'The 2020-2021 School Learning Modalities dataset provides weekly estimates of school learning
    modality (including in-person, remote, or hybrid learning) for U.S. K-12 public and independent charter
    school districts for the 2020-2021 school year, from August 2020 – June 2021. These data were modeled
    using multiple sources of input data (see below) to infer the most likely learning modality of a school
    district for a given week. These data should be considered district-level estimates and may not always
    reflect true learning modality, particularly for districts in which data are unavailable. If '
  columns:
  - name: city
    type: text
    description: School district city (NCES 2020-21)
  - name: state
    type: text
    description: School district state (NCES 2020-21)
  - name: district_nces_id
    type: text
    description: School district identification number obtained from the National Center for Education
      Statistics (NCES) for the 2020-2021 school year
  - name: district_name
    type: text
    description: School district name (NCES 2020-21)
  - name: zip_code
    type: text
    description: School district zip code (NCES 2020-21)
  - name: operational_schools
    type: number
    description: Number of schools in each district (NCES 2020-21)
  - name: learning_modality
    type: text
    description: 'The learning modality of a given school district which includes in-person, remote, or
      hybrid learning. In-Person: All schools within the district offer face-to-face instruction 5 days
      per week to all students at all available grade levels. Remote: Schools within the district do not
      offer face-to-face instruction; all learning is conducted online/remotely to all students at all
      available grade levels. Hybrid: Schools within the district offer a combination of in-person and
      remote learning; face-to-face instruction is offered less than 5 days per week, or only to a subset
      of students.'
  - name: student_count
    type: number
    description: Number of students enrolled in each district (NCES 2020-21)
  - name: week
    type: calendar_date
    description: The start date of the calendar week in which a given learning modality is applicable
      (Sunday – Saturday)

