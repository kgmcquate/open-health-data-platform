    type: number
    description: Enter the number of therapeutic H courses currently in inventory.
  - name: all_pediatric_inpatient_beds
    type: number
    description: 'Total number of pediatric beds in the facility that are currently set-up, staffed and
      able to be used for a patient within the reporting period. This count includes occupied and unoccupied
      inpatient pediatric beds including both PICU and med-surge beds (beds in which medical or surgical
      pediatric patients may be routinely placed). Include any surge/hallway/overflow beds that are open
      for use for a patient, regardless of whether they are occupied or available. This count excludes
      NICU, newborn nursery beds, and outpatient surgery beds. This is a subset of #3a. This field is
      required as of 2/2/2022.'
  - name: previous_day_admission_adult
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission.
      This is a subset of #9b. See Appendix D for the definition of laboratory-confirmed COVID-19.'
  - name: previous_day_admission_adult_6
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission.
      This is a subset of #9b. See Appendix D for the definition of laboratory-confirmed COVID-19.'
  - name: all_adult_hospital_inpatient
    type: number
    description: 'Total number of all staffed adult inpatient beds in the facility, that are currently
      set-up, staffed and able to be used for a patient within the reporting period. This includes all
      overflow, observation, and active surge/expansion beds used for inpatients. This includes ICU beds.
      Include any surge/hallway/overflow beds that are open for use for a patient, regardless of whether
      they are occupied or available. This is a subset of #3a.'
  - name: staffed_adult_icu_bed
    type: number
    description: 'Total number of staffed adult ICU beds that are occupied. This is a subset of #4b and
      #6a.'
  - name: able_to_maintain_3day_gloves
    type: text
    description: (Y, N, N/A) Enter Y for each supply type for which your facility is able to maintain
      at least a 3-day supply. Enter N for those supply types your facility is not able to maintain at
      least a 3-day supply. Enter N/A for each supply type that is not relevant at your facility.
  - name: on_hand_supply_therapeutic_2
    type: number
    description: Enter the number of therapeutic C courses currently in inventory. This field has been
      designated as Bamlanivimab/Etsevimab and is required as of 4/07/2021. See Appendix D for additional
      information on therapeutic reporting.
  - name: all_pediatric_inpatient_bed
    type: number
    description: 'Total number of set-up and staffed inpatient pediatric beds that are occupied by a patient.
      Includes both PICU and med-surge beds (beds in which medical or surgical pediatric patients may
      be routinely placed). Include any occupied surge/hallway/overflow beds that are open for use. This
      count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset of #4a, and
      reflects occupancy levels for beds reported in #3c. This field is required as of 2/2/2022.'
  - name: total_staffed_pediatric_icu
    type: number
    description: 'Total number of pediatric ICU beds in the facility that are currently set-up, staffed
      and are or could be used for a patient within the reporting period. This count includes occupied
      and unoccupied ICU beds, including any ICU beds that are, or could be, staffed and used for a pediatric
      patient. This count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset
      of #3c and #5a. Any beds counted in #5c should NOT be counted in #5b. This field is required as
      of 2/2/2022. Note: All pediatric ICU beds should be considered, regardless of the unit on which
      the bed is housed. This includes ICU beds located in non-ICU locations, such as mixed acuity units.'
  - name: critical_staffing_shortage_1
    type: text
    description: Enter Y if you anticipate a critical staffing shortage within a week. Enter N if you
      do not anticipate a staffing shortage within a week. If you do not report this value, the default
      is N. If you have a shortage, report Y until the shortage is resolved. Each facility should identify
      staffing shortages based on their facility needs and internal policies for staffing ratios. The
      use of temporary staff does not count as a staffing shortage if staffing ratios are met according
      to the facility’s needs and internal policies for staffing ratios.
  - name: able_to_maintain_ventilator
    type: text
    description: (Y, N, N/A) Enter Y if your facility is able to maintain at least a 3-day supply of N95
      respirators. Enter N if your facility is not able to maintain at least a 3-day supply of N95 respirators.
      Enter N/A if N95 respirators are not relevant at your facility.
