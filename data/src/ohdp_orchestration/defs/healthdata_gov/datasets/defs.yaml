  - name: staffed_pediatric_icu_bed_occupancy_7_day_avg
    type: number
    description: 'Average of set-up and staffed pediatric ICU beds occupied by a patient. This count excludes
      NICU, newborn nursery, and outpatient surgery beds. This is subset of #4c and #6a. This field is
      required as of 2/2/2022. Note: All occupied pediatric ICU beds should be considered, regardless
