type: ohdp_orchestration.defs.healthdata_gov.component.HealthDataGovDataset
attributes:
  id: 9psv-r5iz
  name: COVID-19 Reported Patient Impact and Hospital Capacity by State
  publisher: U.S. Department of Health and Human Services
  enabled: false
  cadence: daily
  raw_table: covid_19_reported_patient_impact_and_hospital_capacity_by_state
  incremental_cursor: socrata_updated_at
  row_limit: 500000
  source_url: https://healthdata.gov/d/9psv-r5iz
  page_views: 7302
  keywords:
  - covid
  - covid-19
  - hhs covid-19
  - covid19
  description: 'After May 3, 2024, this dataset and webpage will no longer be updated because hospitals
    are no longer required to report data on COVID-19 hospital admissions, and hospital capacity and occupancy
    data, to HHS through CDC’s National Healthcare Safety Network. Data voluntarily reported to NHSN after
    May 1, 2024, will be available starting May 10, 2024, at COVID Data Tracker Hospitalizations . The
    following dataset provides state-aggregated data for hospital utilization. These are derived from
    reports with facility-level granularity across three main sources: (1) National Healthcare Safety
    Network'
  columns:
  - name: inpatient_beds_used_covid
    type: number
    description: 14. Reported patients currently hospitalized in an inpatient bed who have suspected or
      confirmed COVID-19 in this state
  - name: deaths_covid
    type: number
    description: Number of patients with suspected or confirmed COVID-19 who died on the previous calendar
      day in the hospital, ED, or overflow location
  - name: previous_day_admission_adult_covid_confirmed_20_29_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 confirmed age 20-29
      years
  - name: percent_of_inpatients_with_covid_coverage
    type: number
    description: 45. Number of hospitals reporting both "inpatient_beds_used_covid" and "inpatient_beds_used".
  - name: total_pediatric_patients_hospitalized_confirmed_covid_coverage
    type: number
    description: 37. Number of hospitals reporting "total_pediatric_patients_hospitalized_confirmed_covid"
      in this state
  - name: previous_day_admission_adult_covid_confirmed_70_79_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 confirmed age 70-79
      years
  - name: previous_day_admission_pediatric_covid_suspected
    type: number
    description: 22. Number of pediatric patients who were admitted to an inpatient bed, including NICU,
      PICU, newborn, and nursery, on the previous calendar day who had suspected COVID-19 at the time
      of admission in this state
  - name: previous_day_admission_adult_covid_suspected
    type: number
    description: 18. Number of patients who were admitted to an adult inpatient bed on the previous calendar
      day who had suspected COVID-19 at the time of admission in this state
  - name: total_pediatric_patients_hospitalized_confirmed_and_suspected_covid
    type: number
    description: 34. Reported patients currently hospitalized in a pediatric inpatient bed, including
      NICU, newborn, and nursery, who are suspected or laboratory-confirmed-positive for COVID-19. This
      include those in observation beds.
  - name: adult_icu_bed_covid_utilization_numerator
    type: number
    description: 54. Sum of "staffed_icu_adult_patients_confirmed_and_suspected_covid" for hospitals reporting
      both "staffed_icu_adult_patients_confirmed_and_suspected_covid" and "total_staffed_adult_icu_beds".
  - name: adult_icu_bed_utilization_coverage
    type: number
    description: 57. Number of hospitals reporting both both "staffed_adult_icu_bed_occupancy" and "total_staffed_adult_icu_beds".
  - name: adult_icu_bed_utilization_numerator
    type: number
    description: 58. Sum of "staffed_adult_icu_bed_occupancy" for hospitals reporting both "staffed_adult_icu_bed_occupancy"
      and "total_staffed_adult_icu_beds".
  - name: adult_icu_bed_utilization_denominator
    type: number
    description: 59. Sum of "total_staffed_adult_icu_beds" for hospitals reporting both "staffed_adult_icu_bed_occupancy"
      and "total_staffed_adult_icu_beds".
  - name: previous_day_admission_adult_covid_suspected_coverage
    type: number
    description: 19. Number of hospitals reporting "previous_day_admission_adult_covid_suspected" in this
      state
  - name: previous_day_admission_adult_covid_confirmed_30_39
    type: number
    description: Number of patients admitted to adult inpatient bed on previous calendar day with confirmed
      COVID-19, age 30-39 years
  - name: hospital_onset_covid
    type: number
    description: 8. Total current inpatients with onset of suspected or laboratory-confirmed COVID-19
      fourteen or more days after admission for a condition other than COVID-19 in this state.
  - name: staffed_icu_adult_patients_confirmed_covid_coverage
    type: number
    description: 29. Number of hospitals reporting "staffed_icu_adult_patients_confirmed_covid" in this
      state
  - name: inpatient_beds_used
