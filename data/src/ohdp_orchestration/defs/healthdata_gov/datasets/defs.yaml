type: ohdp_orchestration.defs.healthdata_gov.component.HealthDataGovDataset
attributes:
  id: tw7x-jbvq
  name: Perpetrators by Relationship to Their Victims
  publisher: U.S. Department of Health and Human Services
  enabled: true
  cadence: monthly
  raw_table: perpetrators_by_relationship_to_their_victims
  incremental_cursor: socrata_updated_at
  row_limit: 500000
  source_url: https://healthdata.gov/d/tw7x-jbvq
  page_views: 12057
  keywords:
  - child welfare
  - child abuse
  description: 'The numbers of single perpetrator relationships (unique count) are counted once for each
    relationship category. Perpetrators with two or more relationships are counted in the multiple relationship
    category. Numbers are for the most recent federal fiscal year for which data are available. To view
    more National Child Abuse and Neglect Data System (NCANDS) findings, click link to summary page below:
    https://healthdata.gov/stories/s/kaeg-w7jc'
  columns:
  - name: relative
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of relative,
      which is defined as a nonparental family member. For more information and definitions of relationships,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: multiple_relationships
    type: number
    description: The number of perpetrators (unique count) with multiple relationships to their victim(s),
      which is defined as a perpetrator with two or more relationships to their victims. For more information
      and definitions of relationships, federal fiscal year, and unique and duplicate counts, see the
      Glossary in the Child Maltreatment 2019 report.
  - name: parent
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of parent,
      which is defined as the birth mother or father, adoptive mother or father, or stepmother or stepfather
      of the child. For more information and definitions of relationships, federal fiscal year, and unique
      and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: other_professional
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of other
      professional, which is defined as a person who had contact with the child as part of his or her
      job, but the profession is not listed as one of the NCANDS codes. For more information and definitions
      of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
      Child Maltreatment 2019 report.
  - name: other
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of “other,”
      which is used when the state coding for this field is not one of the codes in the NCANDS record
      layout. For more information and definitions of relationships, federal fiscal year, and unique and
      duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: legal_guardian
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of legal
      guardian, which is defined as an adult person who has been given legal custody and guardianship
      of a minor. For more information and definitions of relationships, federal fiscal year, and unique
      and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: group_home_and_residential
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of group
      home and residential facility staff, which is defined as an employee of a nonfamilial 24-hour care
      facility. For more information and definitions of relationships, federal fiscal year, and unique
      and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: child_daycare_provider
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of child
      daycare provider, which is defined as a person with a temporary caregiver responsibility, but who
      is not related to the child, such as a daycare center staff member, family provider, or babysitter.
      For more information and definitions of relationships, federal fiscal year, and unique and duplicate
      counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: state
    type: text
    description: The primary unit from which child maltreatment data are collected. This includes all
      50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
      includes a national row which displays the total sum, percentage, or rate for only those states
      included in the analysis.
  - name: total_perpetrators
    type: number
    description: The number of perpetrators (unique count) in each state. For more information and definitions
      of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
      Child Maltreatment 2019 report.
  - name: foster_parent
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of foster
      parent, which is defined as an individual who provides a home for orphaned, abused, neglected, delinquent,
      or disabled children under the placement, care, or supervision of the state. For more information
      and definitions of relationships, federal fiscal year, and unique and duplicate counts, see the
      Glossary in the Child Maltreatment 2019 report.
  - name: friend_and_neighbor
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of friend
      and neighbor, which is defined as a nonrelative acquainted with the child, the parent, or caregiver.
      For more information and definitions of relationships, federal fiscal year, and unique and duplicate
      counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: unmarried_partner_of_parent
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of unmarried
      partner of parent, which is defined as someone who has an intimate relationship with the parent
      and lives in the household with the parent of the maltreated child. For more information and definitions
      of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
      Child Maltreatment 2019 report.
  - name: unknown
    type: number
    description: The number of perpetrators (unique count) with a relationship to their victim(s) of unknown,
      which is used when the state may collect data on this variable, but the data for this particular
      report or child were not captured or are missing. For more information and definitions of relationships,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.

