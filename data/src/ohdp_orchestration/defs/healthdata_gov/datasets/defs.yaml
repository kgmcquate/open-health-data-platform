    estimates of the proportions of adults, by county and month, who were in the population of interest
    for the U.S. Department of Health and Human Services’ (HHS) We Can Do This COVID-19 Public Education
    Campaign. These data are designed to be used by practitioners and researchers to understand how county-level
    COVID-19 monovalent booster hesitancy changed over time in the United States.
