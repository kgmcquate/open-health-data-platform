      in a multi-series of COVID-19 vaccination doses administered in your facility. The vaccination can
      occur for an inpatient, outpatient, or community clinic visitor if the doses were allocated to and
      administered by the facility. This field is meant to represent those who have begun but not completed
      the vaccination process. Do not include those who have had the second or final dose of a multi-dose
      vaccination series or those who have had a single-dose vaccination. For the first week of reporting,
      include all doses given up to that date.
  - name: total_personnel_covid
    type: number
    description: Enter the number of healthcare personnel serving your facility, who have not yet received
      any kind of vaccine dose (first in a multi-series, single-dose vaccine, etc.). This field is meant
      to represent personnel who have not had a single vaccine dose yet regardless of where the vaccine
      is administered. (your facility or elsewhere).
