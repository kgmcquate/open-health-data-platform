type: ohdp_orchestration.defs.healthdata_gov.component.HealthDataGovDataset
attributes:
  id: gyqz-9u7n
  name: COVID-19 State and County Policy Orders
  publisher: U.S. Department of Health and Human Services
  enabled: false
  cadence: daily
  raw_table: covid_19_state_and_county_policy_orders
  incremental_cursor: socrata_updated_at
  row_limit: 500000
  source_url: https://healthdata.gov/d/gyqz-9u7n
  page_views: 17440
  keywords:
  - covid
  - covid19
  - covid-19
  - hhs covid-19
  description: 'This data is a manually curated dataset that provides a standardized view into state and
    county policy orders (executive orders, ordinances, etc.) from the following sources: BU COVID-19
    State Policy Database - Raifman J, Nocka K, Jones D, Bor J, Lipson S, Jay J, and Chan P. (2020). "COVID-19
    US state policy database." wikidata - Stay At Home Policies Queried from WikiData Manual curation
    by a dedicated group of Virtual Student Federal Service Interns - Summer 2020: T Adler, J Bastian,
    L Beckett, M Cohen, K Honey, C Kennedy, E Nudell This data set is provided as-is. Due to the evolving
    nature '
  columns:
  - name: date
    type: calendar_date
    description: '5. date (date, formatted YYYY-MM-dd): The date of the policy. Please note that there
      is also a start and stop column, to indicate whether this date is for the beginning or end of the
      policy.'
  - name: policy_type
    type: text
    description: '6. policy_type (string): The “type” of policy this in. Generically fitted in to many
      categories including Gym policies, Food and Drink policies, Stay at Home policies, and more.'
  - name: comments
    type: text
    description: '8. comments (string): Details about the policies. In some cases, simply a link to a
      website with more information.'
  - name: geocoded_state
    type: point
    description: ''
  - name: county
    type: text
    description: '2. county (optional string): The county name where the policy change was implemented.
      Optional due to counties occasionally implementing their own policies.'
  - name: source
    type: text
    description: '9. source (string): Where this policy comes from. Either BU COVID-19 Policy Database,
      Wikidata, manual (no source), or sip_submission_form (with source website URL).'
  - name: state_id
    type: text
    description: '1. state_id (string): The two digit state code for the policy change'
  - name: fips_code
    type: text
    description: '3. fips_code (string): A list of fips codes where the policy change is occurring. This
      is the authoritative column for where a county policy change occurs.'
  - name: start_stop
    type: text
    description: '7. start_stop (string): Either “start” or “stop” Indicating whether this entry is for
      the beginning or end of a policy, respectively.'
  - name: policy_level
    type: text
    description: '4. policy_level (string): Whether the policy is a state of county-level policy. Either
      “state” or “county.”'
  - name: total_phases
    type: number
    description: '10. total_phases (integer): As some states shifted to reopening policies, this column
      captures the number of phases of reopening that were expected.'

