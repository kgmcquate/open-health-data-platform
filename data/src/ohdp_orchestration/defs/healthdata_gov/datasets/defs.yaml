  - name: previous_day_admission_adult_10
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had suspected COVID-19 at the time of admission. This is a
      subset of #9a.'
  - name: total_personnel
    type: number
    description: Enter the current total number of healthcare personnel serving your facility. Healthcare
      personnel include all paid and unpaid persons serving in your healthcare setting who have the potential
      for direct or indirect exposure to patients or infectious materials.
  - name: previous_day_admission_adult_4
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission.
      This is a subset of #9b. See Appendix D for the definition of laboratory-confirmed COVID-19.'
  - name: hospital_onset
    type: number
    description: Total current inpatients with onset of suspected or laboratory-confirmed COVID-19 fourteen
      or more days after admission for a condition other than COVID-19.
  - name: total_personnel_covid_2
    type: number
    description: Enter the current total number of healthcare personnel serving your facility, who are
      fully vaccinated, defined as having received a completed series of a COVID-19 vaccination or a single-dose
      vaccination. This field is meant to represent those who have completed the COVID-19 vaccination
      process, regardless of where it was administered (your facility or elsewhere) and regardless of
      how many doses are needed to complete the vaccination series.

