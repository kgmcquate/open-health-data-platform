  description: 'Counts and rates of child fatalities by file submission type for the most recent federal
    fiscal year for which data are available. To view more National Child Abuse and Neglect Data System
    (NCANDS) findings, click link to summary page below: https://healthdata.gov/stories/s/kaeg-w7jc'
  columns:
  - name: child_fatalities_reported_agency
    type: number
    description: The number of child fatalities (unique count) that were reported by each state in its
      federal fiscal year 2019 Agency File data submission. The Agency File includes aggregate data that
      are often gathered from agencies external to CPS. A child fatality is defined as the death of a
      child as a result of abuse and neglect, because either an injury resulting from the abuse and neglect
      was the cause of death, or abuse and neglect were contributing factors to the cause of death. For
      more information and definitions of Agency File, child fatalities, child maltreatment, federal fiscal
      year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: state
    type: text
