  source_url: https://healthdata.gov/d/brtg-nu42
  page_views: 11067
  keywords:
  - hospital
  - covid-19
  description: Template for requested daily data reports on testing, capacity and utilization, and patient
    flows to facilitate the public health response to the 2019 Novel Coronavirus (COVID-19).
  columns:
  - name: all_hospital_inpatient_bed
    type: number
    description: 'Total number of staffed inpatient beds that are occupied. This reflects occupancy levels
      for beds reported in #3a.'
  - name: able_to_maintain_3day_surgical
    type: text
    description: (Y, N, N/A) Enter Y for each supply type for which your facility is able to maintain
      at least a 3-day supply. Enter N for those supply types your facility is not able to maintain at
      least a 3-day supply. Enter N/A for each supply type that is not relevant at your facility.
  - name: total_personnel_covid_1
    type: number
    description: Enter the current total number of healthcare personnel serving your facility, who have
      received the first dose of a multi-series COVID-19 vaccine, regardless of where the dose was administered
      (your facility or elsewhere). This field is meant to represent those who are partially vaccinated,
      defined as having begun but not completed the vaccination process. Do not include those who received
      a single-dose vaccine in this field or those who have received more than one dose or a completed
      multi-dose series.
  - name: able_to_maintain_ventilator_1
    type: text
    description: Optional / Inactive
  - name: previous_day_deaths_covid_1
    type: number
    description: Optional / Inactive
  - name: previous_day_admission_adult_11
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had suspected COVID-19 at the time of admission. This is a
      subset of #9a.'
  - name: previous_day_admission_adult_1
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission.
      This is a subset of #9b. See Appendix D for the definition of laboratory-confirmed COVID-19.'
  - name: able_to_maintain_3day_lab_1
    type: text
    description: Optional / Inactive
  - name: icu_patients_confirmed
    type: number
    description: 'Enter the total number of patients (adult and pediatric) currently hospitalized in a
      designated ICU bed with laboratory-confirmed influenza virus infection. This is a subset of #33—this
      value should not exceed the value in #33. This field is required as of 2/2/2022. See Appendix D
      for the definition of laboratory-confirmed influenza.'
  - name: staffed_pediatric_icu_bed
    type: number
    description: 'Total number of set-up and staffed pediatric ICU beds occupied by a patient. This count
      excludes NICU, newborn nursery, and outpatient surgery beds. This is subset of #4c and #6a. This
      field is required as of 2/2/2022. Note: All occupied pediatric ICU beds should be considered, regardless
      of the unit on which the bed is housed. This includes ICU beds located in non-ICU locations, such
      as mixed acuity units.'
  - name: previous_week_therapeutic_4
    type: number
    description: Enter the number of therapeutic E courses used in the previous calendar week in an inpatient,
      ED, overflow, or outpatient location such as an urgent care, infusion center, or outpatient clinic.
  - name: total_adult_patients_1
    type: number
    description: Patients currently hospitalized in an adult inpatient bed who have laboratory-confirmed
      COVID-19. Include those in observation beds. Include patients who have both laboratory-confirmed
      COVID-19 and laboratory-confirmed influenza in this field. See Appendix D for the definition of
      laboratory-confirmed COVID-19.
  - name: total_pediatric_patients
    type: number
    description: Patients currently hospitalized in a pediatric inpatient bed, including NICU, PICU, newborn,
      and nursery, who are suspected or laboratory-confirmed-positive for COVID-19. Include those in observation
      beds. See Appendix D for the definition of laboratory-confirmed COVID-19.
  - name: previous_day_admission_adult_7
    type: number
    description: 'Enter the number of patients by age bracket who were admitted to an adult inpatient
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission.
      This is a subset of #9b. See Appendix D for the definition of laboratory-confirmed COVID-19.'
