  description: As shown on the summary table, HHS’ contingency plans for agency operations in the absence
    of appropriations will lead to retaining 51,901 staff and furloughing 35,074 staff as of day two of
    a funding hiatus. Put another way, 60% of HHS employees will be retained and 40% will be furloughed.
    These percentages vary among HHS Operating Divisions and offices. Operating Divisions with a substantial
    direct service component will have more of their staff retained. For example, the NIH Clinical Center
    will continue to care for patients and admit new patients for whom it is medically necessary. FDA
