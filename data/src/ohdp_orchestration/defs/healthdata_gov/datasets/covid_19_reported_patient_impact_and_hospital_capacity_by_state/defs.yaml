    description: This column was automatically created in order to record in what polygon from the dataset
      'Demo | State Geographic Boundaries' (pqdx-y6mm) the point in column 'geocoded_state' is located.
      This enables the creation of region maps (choropleths) in the visualization canvas and data lens.
  - name: total_adult_patients_hospitalized_confirmed_and_suspected_covid
    type: number
    description: 30. Reported patients currently hospitalized in an adult inpatient bed who have laboratory-confirmed
      or suspected COVID-19. This include those in observation beds.
  - name: staffed_adult_icu_bed_occupancy
    type: number
    description: 24. Reported total number of staffed inpatient adult ICU beds that are occupied in this
      state
  - name: total_adult_patients_hospitalized_confirmed_and_suspected_covid_coverage
    type: number
    description: 31. Number of hospitals reporting "total_adult_patients_hospitalized_confirmed_and_suspected_covid"
      in this state
  - name: total_adult_patients_hospitalized_confirmed_covid
    type: number
    description: 32. Reported patients currently hospitalized in an adult inpatient bed who have laboratory-confirmed
      COVID-19. This include those in observation beds.
  - name: inpatient_beds_utilization_denominator
    type: number
    description: 43. Sum of "inpatient_beds" for hospitals reporting both "inpatient_beds_used" and "inpatient_beds"
  - name: percent_of_inpatients_with_covid
    type: number
    description: 44. Percentage of inpatient population who have suspected or confirmed COVID-19 in this
      state. This number only accounts for hospitals in the state that report both "inpatient_beds_used_covid"
      and "inpatient_beds_used" fields.
  - name: inpatient_bed_covid_utilization
    type: number
    description: 48. Percentage of total (used/available) inpatient beds currently utilized by patients
      who have suspected or confirmed COVID-19 in this state. This number only accounts for hospitals
      in the state that report both "inpatient_beds_used_covid" and "inpatient_beds" fields.
  - name: inpatient_bed_covid_utilization_denominator
    type: number
    description: 51. Sum of "inpatient_beds" for hospitals reporting both "inpatient_beds_used_covid"
      and "inpatient_beds".
  - name: adult_icu_bed_utilization
    type: number
    description: 56. Percentage of staffed adult ICU beds that are being utilized in this state. This
      number only accounts for hospitals in the state that report both "staffed_adult_icu_bed_occupancy"
      and "total_staffed_adult_icu_beds" fields.
  - name: previous_day_admission_adult_covid_suspected_30_39
    type: number
    description: Number of patients admitted to adult inpatient bed on previous calendar day with suspected
      COVID-19, age 30-39 years
  - name: previous_day_admission_adult_covid_suspected_30_39_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 suspected age 30-39
      years
  - name: previous_day_admission_adult_covid_suspected_50_59_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 suspected age 50-59
      years
  - name: previous_day_admission_adult_covid_suspected_60_69_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 suspected age 60-69
      years
  - name: previous_day_admission_adult_covid_suspected_80_coverage
    type: number
    description: Number of hospitals reporting previous day admission adult COVID-19 suspected age 80+
      years
  - name: total_patients_hospitalized_confirmed_influenza
    type: number
    description: total patients hospitalized confirmed influenza
  - name: all_pediatric_inpatient_beds
    type: number
    description: 'Total number of pediatric beds in the facility that are currently set-up, staffed and
      able to be used for a patient within the reporting period. This count includes occupied and unoccupied
      inpatient pediatric beds including both PICU and med-surge beds (beds in which medical or surgical
      pediatric patients may be routinely placed). Include any surge/hallway/overflow beds that are open
      for use for a patient, regardless of whether they are occupied or available. This count excludes
      NICU, newborn nursery beds, and outpatient surgery beds. This is a subset of #3a. This field is
      required as of 2/2/2022.'
  - name: all_pediatric_inpatient_beds_coverage
    type: number
    description: 'Total number of pediatric beds in the facility that are currently set-up, staffed and
      able to be used for a patient within the reporting period (coverage). This count includes occupied
      and unoccupied inpatient pediatric beds including both PICU and med-surge beds (beds in which medical
      or surgical pediatric patients may be routinely placed). Include any surge/hallway/overflow beds
      that are open for use for a patient, regardless of whether they are occupied or available. This
      count excludes NICU, newborn nursery beds, and outpatient surgery beds. This is a subset of #3a.
      This field is required as of 2/2/2022.'
  - name: previous_day_admission_pediatric_covid_confirmed_12_17_coverage
    type: number
    description: 'Enter the number of patients, by age group, who were admitted to an inpatient or ICU
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission (coverage).
      The summary of age breakdowns should be identical to #18a. This includes patients ages 0-4, 5-11,
      and 12-17 years old admitted to any inpatient bed, regardless of whether the bed is designated as
      pediatric vs. adult. This field is required as of 2/2/2022. See Appendix D for the definition of
      laboratory-confirmed COVID-19.'
  - name: previous_day_admission_pediatric_covid_confirmed_unknown_coverage
    type: number
    description: 'Enter the number of patients, by age group, who were admitted to an inpatient or ICU
      bed on the previous calendar day who had laboratory-confirmed COVID19 at the time of admission (coverage).
      The summary of age breakdowns should be identical to #18a. This includes patients ages 0-4, 5-11,
      and 12-17 years old admitted to any inpatient bed, regardless of whether the bed is designated as
      pediatric vs. adult. This field is required as of 2/2/2022. See Appendix D for the definition of
      laboratory-confirmed COVID-19.'
  - name: staffed_icu_pediatric_patients_confirmed_covid
    type: number
    description: 'Total number of pediatric ICU beds occupied by laboratory confirmed positive COVID-19
      patients. This is a subset of #6c, occupied pediatric ICU beds. This count excludes NICU, newborn
      nursery, and outpatient surgery beds. This field is required as of 2/2/2022. See Appendix D for
      the definition of laboratory-confirmed COVID-19.'
  - name: total_staffed_pediatric_icu_beds
    type: number
    description: 'Total number of pediatric ICU beds in the facility that are currently set-up, staffed
      and are or could be used for a patient within the reporting period. This count includes occupied
      and unoccupied ICU beds, including any ICU beds that are, or could be, staffed and used for a pediatric
      patient. This count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset
      of #3c and #5a. Any beds counted in #5c should NOT be counted in #5b. This field is required as
      of 2/2/2022. Note: All pediatric ICU beds should be considered, regardless of the unit on which
      the bed is housed. This includes ICU beds located in non-ICU locations, such as mixed acuity units.'
