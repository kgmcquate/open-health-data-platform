  description: 'The numbers of children (duplicate count) are counted once for each investigation response
    or alternative response that reached a disposition (finding) for the most recent federal fiscal year
    for which data are available. *11/29/2021: Added column including year in which data was collected.
    To view more National Child Abuse and Neglect Data System (NCANDS) findings, click link to summary
    page below: https://healthdata.gov/stories/s/kaeg-w7jc'
  columns:
  - name: total_children
    type: number
    description: The summed number of children (duplicate count) counted once for each disposition. For
      the definitions of dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary
      in the Child Maltreatment 2019 report.
  - name: closed_with_no_finding
    type: number
    description: The number of children (duplicate count) who received a disposition that does not conclude
      with a specific finding because the CPS response could not be completed. For the definitions of
      dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary in the Child
      Maltreatment 2019 report.
  - name: no_alleged_maltreatment
    type: number
    description: The number of children (duplicate count) who received a disposition, but were not the
      subject of an allegation or any finding of maltreatment. For the definitions of dispositions, federal
      fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
  - name: indicated
    type: number
    description: The number of children (duplicate count) who received a disposition that concludes maltreatment
      could not be substantiated under state law or policy, but there was a reason to suspect that at
      least one child may have been maltreated or was at-risk of maltreatment. For more information and
      definitions of dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary
      in the Child Maltreatment 2019 report.
  - name: intentionally_false
    type: number
    description: The number of children (duplicate count) who received a disposition that concludes the
      person who made the allegation of maltreatment knew that the allegation was not true. For more information
      and definitions of dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary
      in the Child Maltreatment 2019 report.
  - name: state
    type: text
    description: The primary unit from which child maltreatment data are collected. This includes all
      50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
      includes a national row which displays the total sum, percentage, or rate for only those states
      included in the analysis.
  - name: unknown
    type: number
    description: The number of children (duplicate count) for whom a disposition is unknown or missing.
      For the definitions of dispositions, federal fiscal year, and unique and duplicate counts, see the
      Glossary in the Child Maltreatment 2019 report.
  - name: alternative_response
    type: number
    description: The number of children (duplicate count) who received the provision of a response other
      than an investigation that determines if a child or family needs services. A determination of maltreatment
      is not made and a perpetrator is not determined. For more information and definitions of dispositions,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: year
    type: number
    description: ''
  - name: other
    type: number
    description: The number of children (duplicate count) who received a disposition of “other,” which
      is used by states if none of the other dispositions are applicable. For the definitions of dispositions,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: unsubstantiated
    type: number
    description: The number of children (duplicate count) who received an investigation disposition that
      concludes there was not sufficient evidence under state law to conclude or suspect that the child
      was maltreated or at-risk of being maltreated. For more information and definitions of dispositions,
      federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
      2019 report.
  - name: substantiated
    type: number
    description: The number of children (duplicate count) who received an investigation disposition that
      concludes the allegation of maltreatment or risk of maltreatment was supported or founded by state
      law or policy. For more information and definitions of dispositions, federal fiscal year, and unique
      and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
