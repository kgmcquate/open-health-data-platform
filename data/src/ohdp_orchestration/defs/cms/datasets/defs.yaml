  description: The Medicare Short-Stay Hospital Discharge Rankings dataset provides ranked information
    on Medicare-covered inpatient discharges from short-stay (acute care) hospitals by Diagnosis-Related
    Group (DRG). It includes discharge counts and current and prior fiscal year rankings for DRGs, highlighting
    the conditions and procedures most frequently associated with Medicare-covered inpatient discharges
    and how their rankings change over time. The data provide insight into trends in Medicare inpatient
    hospital usage, including common reasons for hospital admission and discharge.

