  description: The Medicare Alternative Payment Model (APM) Adoption data set provides information on
    the amount and percent of Medicare payments flowing through APMs, including downside risk models.
    The data is segmented according to the categories of the HCP-LAN APM framework, which provides a common,
    industry framework for classifying payment models. The Framework classifies APMs in four categories
    and eight subcategories, specifying decision rules to standardize classification efforts. 

