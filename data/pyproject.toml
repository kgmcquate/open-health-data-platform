[project]
name = "ohdp-data"
version = "0.0.0"
description = "Ingestion, orchestration, and ML for the Open Health Data Platform"
requires-python = ">=3.12"
dependencies = [
    "ohdp-shared @ file:///Users/kevinmcquate/projects/open-health-data-platform/packages/shared",
    "dagster>=1.8",
    "dagster-postgres>=0.24",
    "dagster-dbt>=0.24",
    "dagster-dlt>=0.29,<0.30",
    "dbt-snowflake>=1.8",
    "dlt[snowflake]>=1.9",
    "sqlalchemy>=2.0.18",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "boto3>=1.35",
    "pyarrow>=17.0",
    "polars>=1.7",
]

[tool.uv.sources]
ohdp-shared = { path = "../packages/shared", editable = true }

[dependency-groups]
dev = [
    "dagster-webserver>=1.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]
ml = [
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `dg` / Dagster components: defs are autoloaded from ohdp_orchestration.defs
# (ADR-0008). definitions.py is the code-location entrypoint the Helm chart
# targets; it calls dagster.components.load_defs on that package. [tool.dg] here
# is only for the `dg` CLI.
[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ohdp_orchestration"
defs_module = "ohdp_orchestration.defs"
code_location_target_module = "ohdp_orchestration.definitions"
code_location_name = "ohdp_orchestration.definitions"

# src layout, matching packages/shared and apps/api. Directory names are the
# import names — `ohdp_orchestration`, not `dagster`, so nothing shadows the
# `dagster` library on sys.path (ADR-0004).

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ohdp_ingestion", "src/ohdp_orchestration", "src/ohdp_ml"]

# Standalone uv project (no monorepo workspace). Lint/format config is the
# repo-root ruff.toml; mypy + pytest are per-project.
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
