[project]
name = "ohdp-data"
version = "0.0.0"
description = "Ingestion, orchestration, and ML for the Open Health Data Platform"
requires-python = ">=3.12"
dependencies = [
    "ohdp-shared",
    "dagster>=1.8",
    "dagster-dbt>=0.24",
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
    "httpx>=0.27",
    "boto3>=1.35",
    "pyarrow>=17.0",
    "polars>=1.7",
]

[dependency-groups]
dev = [
    "dagster-webserver>=1.8",
]
ml = [
    "numpy>=2.1",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Folder names follow ARCHITECTURE.md §7. Import names are remapped so the
# orchestration package does not shadow the `dagster` library on sys.path.
[tool.hatch.build.targets.wheel]
only-include = ["ingestion", "dagster", "ml"]

[tool.hatch.build.targets.wheel.sources]
"ingestion" = "ohdp_ingestion"
"dagster" = "ohdp_orchestration"
"ml" = "ohdp_ml"
