version: 2

models:
  - name: infectious_disease__notifiable_weekly
    description: >
      US notifiable-disease surveillance by state and CDC epi week, from Project
      Tycho Level 1 (digitised NNDSS reports spanning roughly a century).
      State-level locations only, so cases can be summed without
      double-counting the city rows the source mixes in.
    config:
      contract:
        enforced: false
    columns:
      - name: disease
        description: Notifiable disease or condition reported, as named by Project Tycho.
        data_type: varchar
        data_tests: [not_null]
      - name: state
        description: US state postal code.
        data_type: varchar
        data_tests: [not_null]
      - name: location
        description: Reporting location name; always a state at this grain.
        data_type: varchar
      - name: epi_year
        description: >-
          CDC epi year. Not always the calendar year of the week's days -- an
          epi year can start in late December.
        data_type: integer
      - name: epi_week_of_year
        description: Week number within the epi year, 1-53.
        data_type: integer
      - name: epi_week_start_date
        description: Sunday that starts the epi week. Use this as the time dimension, not epi_year.
        data_type: date
      - name: cases
        description: Reported cases of the disease in the state that week.
        data_type: double
      - name: incidence_per_100000
        description: >-
          Reported cases per 100,000 population that week. A rate -- average it
          across states, never sum it.
        data_type: double
