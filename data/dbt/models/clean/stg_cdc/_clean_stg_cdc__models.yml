version: 2

# Every model here is macros/socrata_current_rows.sql over one RAW.cdc table:
# latest row per Socrata :id, dlt bookkeeping dropped. Columns stay as CDC
# publishes them -- almost all of them arrive as text, because Socrata's SODA
# API serialises every field as a string -- so only the dedupe key is
# documented and tested here. Typing, renaming and unit handling are `core`'s
# job (see curated/core/core__*.sql).

models:
  - name: stg_cdc__nndss_weekly
    description: >
      NNDSS weekly provisional counts of nationally notifiable infectious diseases, by reporting area and MMWR week.
      One row per Socrata :id.
    config:
      contract:
        enforced: false
    columns:
      - name: socrata_id
        description: Socrata system row id; unique after dedup.
        data_tests: [unique, not_null]

  - name: stg_cdc__wastewater_viral_activity
    description: >
      NWSS wastewater viral activity level (WVAL) per sewershed per week, for SARS-CoV-2, Influenza A and RSV.
      One row per Socrata :id.
    config:
      contract:
        enforced: false
    columns:
      - name: socrata_id
        description: Socrata system row id; unique after dedup.
        data_tests: [unique, not_null]

  - name: stg_cdc__wastewater_measles
