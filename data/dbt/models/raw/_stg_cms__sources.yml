  - name: medicare_part_d_spending_by_drug
    identifier: MEDICARE_PART_D_SPENDING_BY_DRUG
    description: Medicare Part D Spending by Drug (Centers for Medicare & Medicaid Services). https://data.cms.gov/summary-statistics-on-use-and-payments/medicare-medicaid-spending-by-drug/medicare-part-d-spending-by-drug
    columns:
    - name: brnd_name
      description: The name of the drug filled. This includes both brand names (drugs that have a trademarked
        name) and generic names (drugs that do not have a trademarked name). ' * ' indicates that the
        average spending per dosage unit reflects multiple routes of administration of the drug (e.g.,
        intravenous, subcutaneous) which individually may have different unit pricing. Additional information
        regarding calculation of spending per unit can be found in the methodology document.
    - name: gnrc_name
      description: A term referring to the chemical ingredient of a drug rather than the trademarked brand
        name under which the drug is sold.
    - name: tot_mftr
      description: Number of manufacturers for each drug.
    - name: mftr_name
      description: Name of the manufacturer of the drug.
    - name: tot_spndng_2020
      description: Aggregate drug spending for the Medicare Part D program during the benefit year.
    - name: tot_dsg_unts_2020
      description: The sum of the dosage units of medication dispensed across the calendar year (e.g.
        number of tablets, grams, milliliters or other units). Unit refers to the drug unit in the lowest
        dispensable amount.
    - name: tot_clms_2020
      description: Number of prescription fills for each drug. Includes original prescriptions and refills.
    - name: tot_benes_2020
      description: Number of Part D beneficiaries utilizing the drug during the benefit year.
    - name: avg_spnd_per_dsg_unt_wghtd_2020
      description: Medicare Part D drug spending divided by the number of dosage units, which is weighted
        by the proportion of total claims.
    - name: avg_spnd_per_clm_2020
      description: Part D drug spending divided by the number of prescription fills.
    - name: avg_spnd_per_bene_2020
      description: Total Part D drug spending divided by the number of unique beneficiaries utilizing
        the drug during the benefit year.
