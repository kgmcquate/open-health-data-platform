  - name: medicare_part_b_spending_by_drug
    identifier: MEDICARE_PART_B_SPENDING_BY_DRUG
    description: Medicare Part B Spending by Drug (Centers for Medicare & Medicaid Services). https://data.cms.gov/summary-statistics-on-use-and-payments/medicare-medicaid-spending-by-drug/medicare-part-b-spending-by-drug
    columns:
    - name: hcpcs_cd
      description: Healthcare Common Procedure Coding System (HCPCS) code used to identify the drug furnished
        by the provider.
    - name: hcpcs_desc
      description: Description of the HCPCS code for the drug furnished by the provider.
    - name: brnd_name
      description: "Name of the drug furnished by the provider. This includes both brand names (drugs\
        \ that have a trademarked name) and generic names (drugs that do not have a trademarked name).\
        \ ' * ' Indicates multiple brand and/or generic names for a specific HCPCS code. See \u201CMedicare\
        \ Part B Spending by Drug-Manufacturer and Drug Use Information\u201D supporting document for\
        \ additional names. ' ** ' Indicates brand/generic names unavailable. Name reflects the HCPCS\
        \ short description."
    - name: gnrc_name
      description: "A term referring to the chemical ingredient of a drug rather than the trademarked\
        \ brand name under which the drug is sold. ' * ' Indicates multiple brand and/or generic names\
        \ for a specific HCPCS code. See \u201CMedicare Part B Spending by Drug-Manufacturer and Drug\
        \ Use Information\u201D supporting document for additional names. ' ** ' Indicates brand/generic\
        \ names unavailable. Name reflects the HCPCS short description."
    - name: tot_spndng_2020
      description: Aggregate drug spending for the Part B program during 2020.
    - name: tot_dsg_unts_2020
      description: The sum of the dosage units of medication dispensed in 2020 (e.g. number of tablets,
        grams, milliliters or other units). For Part B, the quantity of a drug in a dosage unit is the
        same as the quantity of the drug in a HCPCS billing unit.
    - name: tot_clms_2020
      description: Number of claims for each drug in 2020.
    - name: tot_benes_2020
      description: Number of Medicare Part B fee-for-service beneficiaries utilizing the drug during 2020.
    - name: avg_spndng_per_dsg_unt_2020
      description: Part B drug spending in 2020 divided by the number of dosage units in 2020.
    - name: avg_spndng_per_clm_2020
      description: Part B drug spending in 2020 divided by the number of claims in 2020.
    - name: avg_spndng_per_bene_2020
      description: Total Part B drug costs in 2020 divided by the number of unique beneficiaries utilizing
        the drug during 2020.
    - name: outlier_flag_2020
      description: "Yearly outlier flag variable, which is set to \u201C1\u201D when a drug\u2019s Average\
        \ Spending per Dosage Unit is substantially impacted by outlier records in a given year. These\
        \ potentially anomalous drugs are identified as outliers so that users can exercise caution when\
