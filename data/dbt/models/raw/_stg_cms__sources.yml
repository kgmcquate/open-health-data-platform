    - name: qmb_only_benes
      description: Count of Qualified Medicare Beneficiaries who are entitled to Medicare Part A, have
        income up to 100 percent of the federal poverty level and resources that do not exceed three times
        the limit for supplementary security income (SSI) eligibility with adjustements for inflaction
        and are not otherwise eligible for full-benefit Medicaid coverage. Medicaid pays their Part A
        premiums, if any, and Medicare Part B premiums.
    - name: qmb_plus_benes
      description: Count of Qualified Medicare Beneficiaries with full-benefit Medicaid that meet the
        QMB-related eligibility requirements and the eligibility requirements for a separate categorical
        Medicaid eligiblity group covered under the state plan. These individuals are entitled to all
        benefits available to a QMB, as well as the full range of Medicaid benefits applicable to the
        separate eligibility group for which they qualify.
    - name: slmb_only_benes
      description: Count of Specified Low-Income Medicare Beneficiaires without other Medicaid who are
        entitled to Part A and have income between 100 and 120 percent of the federal poverty level, and
        resources that do not exceed three times the limit for supplementary security income eligibility
        with adjustments for inflation. Medicaid pays only the Medicare Part B premiums.
    - name: slmb_plus_benes
      description: Count of Specified Low-Income Medicare Beneficiaires with full-benefit Medicaid who
        meet the SLMB-related eligibility requirements and the eligibility requirements for a separate
        categorical Medicaid eligibility group covered under the state plan. In addition to coverage for
        Medicare Part B premiums, these individuals receive full-benefit Medicaid coverage.
    - name: qdwi_qi_benes
      description: Qualified Disabled and Working Individuals are eligible for premium-free Part A by
        virtue of qualifying for Social Security Disability Insurance (SSDI) benefits, but lose those
        benefits and subsequently premium-free Medicare Part A, after returning to work. QDWIs have income
        that does not exceed 200 percent of the federal poverty level, have resources that do not exceed
        two times the SSI resource standard and are not otherwise eligible for Medicaid. Medicaid pays
        Medicare Part A premiums only. Qualifying Individuals are entitled to Part A and have income of
        at least 120 but less than 135 percent of the federal poverty level, resources that do not exceed
        three times the limit for SSI eligiblity with adjustments for inflation and are not eligible for
        any other eligiblity group under the state plan. QIs receive coverage for their Meidcare Part
        B premiums, to the extent their state Medicaid programs have available slots.
    - name: othr_full_dual_mdcd_benes
      description: Other Full-Benefit Medicaid beneficiaries are entitled to Medicare Part A and/or entitled
        to Part B, and qualify for full Medicaid benefits, but not the QMB or SLMB groups.
    - name: a_b_tot_benes
      description: Count of Medicare beneficiaries enrolled in Hospital Insurance (or Part A) and Supplementary
