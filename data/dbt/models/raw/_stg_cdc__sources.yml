  - name: cdc_wastewater_data_for_avian_influenza_a_h5
    identifier: CDC_WASTEWATER_DATA_FOR_AVIAN_INFLUENZA_A_H5
    description: CDC Wastewater Data for Avian Influenza A (H5) (Public Health Surveillance). https://data.cdc.gov/d/mtpu-urpp
    columns:
    - name: ntc_amplify
      description: A yes/no flag indicating contamination of PCR reagents. No template controls is a negative
        control to detect contamination of PCR reagents by running reactions with no nucleic acid template
        added. A "yes" value (any values above the positive threshold) indicates a positive NTC result
        which suggests reagent contamination and the experiment is no longer valid.
    - name: extraction_method
      description: Laboratory method used to purify the genetic material (RNA or DNA) of the PCR target
        by extraction from the sample.
    - name: pcr_target_flowpop_lin
      description: Flow-population-normalized PCR target concentration on linear scale; calculated as
        concentration*flow/population. The PCR target is defined in the field, 'pcr_target' and its associated
        target gene in 'pcr_gene_target'.
    - name: hum_frac_mic_conc
      description: Concentration of microbial target specified in 'hum_frac_target_mic'
    - name: rec_eff_percent
      description: "Recovery efficiency percent calculates the recovery (or loss) of an exogenous organism\
        \ (\"rec_eff_target_name\") from a wastewater sample after it has been fully processed (e.g.,\
        \ concentration and extraction) and measured by molecular detection methods such as PCR. Recovery\
        \ efficiency percent is calculated by comparing the total measured gene copies in the fully processed\
        \ sample (e.g., nucleic acid extract) to the measured or theoretical gene copy value of the initial\
        \ spike-in concentration that was added to the wastewater sample prior to processing (\"rec_eff_spike_conc\"\
        ). \u201Crec_eff_percent\u201D = [((Measured \"rec_eff_target_name\" gene copies)/(\"rec_eff_spike_conc\"\
        \ gene copies)) x 100]."
    - name: rec_eff_spike_conc
      description: 'Spike concentration, on average, of the recovery control on a per sample volume basis.
        This value is used to assess the recovery efficiency: "rec_eff_percent".'
    - name: pcr_target_mic_lin
      description: Microbial-normalized PCR target concentration on linear scale; calculated as (concentration
        of pathogen) / (concentration of microbial endogenous control). The PCR target is defined in the
        field, 'pcr_target' and its associated target gene in 'pcr_gene_target'.
    - name: lod_sewage
      description: PCR target limit of detection (LOD) is the lowest analyte concentration that can be
        reliably detected by a PCR assay. This value is the LOD concentration that has been back-calculated
        to the PCR target concentration PRIOR to sample concentration to adjust for any concentrations
        or dilutions performed on samples.
    - name: pcr_target_avg_conc
      description: Concentration of the PCR target back-calculated to unconcentrated sample basis; value
        is "0" if no amplification occurred, using the definition of amplification described in 'ntc_amplify';
        otherwise, the estimated concentration was entered; does not adjust for matrix recovery efficiency.
        Only the technical or biological replicate concentrations for the same pcr_gene_target are averaged.
    - name: major_lab_method
      description: A number used to distinguish major lab methods at the reporting jurisdiction level.
        Differences in lab methods may limit the comparability of PCR target concentrations. Reporting
        jurisdictions should use this field to indicate that lab methods are sufficiently different that
        caution should be used when comparing PCR target concentrations across them. These differences
        may result from any lab processing or quantification steps, including different PCR gene targets.
        Note that 'major_lab_method' may be the same for different laboratories if the reporting jurisdiction
        believes concentrations measured by those laboratories are comparable; conversely, 'major_lab_method'
        may be different for the same laboratory if changes made to the laboratory protocol rendered concentrations
        not comparable. Also note that major lab method is only comparable across reporting site and should
        not be compared across different sites.
    - name: sample_collect_date
      description: Sample collection date
    - name: pasteurized
      description: A yes/no flag indicating whether the sample pasteurized or heat treated.
    - name: flow_rate
      description: Wastewater volumetric flow rate at the sample collection location over the 24-hr period
        during which the sample was collected. If only an instantaneous flow measurement is available,
        it may be reported in units of million gallons per day.
    - name: state_territory
      description: State, DC, US territory, or Freely Associated State jurisdiction name (2-letter abbreviation)
        in which the wastewater treatment plant is located.
    - name: site
      description: A unique identifier for wastewater treatment plants. This is an arbitrary integer used
        to provide a unique, but anonymous identifier for a wastewater treatment plant. This identifier
        is consistent over time, such that the same plant retains the same ID regardless of the addition
        or subtraction of other plants from the data set.
    - name: pcr_target_units
      description: Units of PCR target sample concentration
    - name: sample_type
      description: Type of sample collected, whether grab or composite. If composite, the duration of
        sampling and type of composite is specified (e.g., "24-hr flow-weighted composite"). A grab sample
        is defined as an individual sample collected without compositing or adding other samples, regardless
        of whether the sample matrix is liquid wastewater or sludge.
    - name: pcr_target
      description: The target of the PCR quantification (pathogen or antimicrobial resistance (AMR) groups)
    - name: inhibition_adjust
      description: "A yes/no flag indicating whether inhibitory effects were factored into the PCR target\
        \ concentration calculation. A \u201Cyes\u201D value means that the measured PCR target concentration\
        \ was adjusted for suppressed signals due to interfering compounds. Incorporating inhibition adjustments\
        \ prevents underestimation of target levels."
    - name: sample_location
      description: Sample collection location in the wastewater system, whether at a wastewater treatment
        plant (or other community level treatment infrastructure such as community-scale septic) or upstream
        in the wastewater system
    - name: concentration_method
      description: Laboratory method used to concentrate (or enrich) the sample prior to analysis of the
        concentrate. This procedures concentrates pathogen titers from a larger volume of wastewater prior
        to extraction and molecular detection.
    - name: sample_matrix
      description: Wastewater matrix from which the sample was collected. Wastewater matrix is a categorical
        variable specifying the type of wastewater sample used (e.g., raw influent, primary sludge, settled
        solids).
    - name: county_fips
      description: 5-digit numeric FIPS codes of all counties and county equivalents served by this sampling
        site (i.e., served by this wastewater treatment plant or, if 'sample_location' is "upstream",
        then by this upstream location). Note that most jurisdictions are covered by counties, but some
        are covered by county equivalents, such as independent cities, parishes, or census areas.
    - name: counties_served
      description: The county and county-equivalent names corresponding to the FIPS codes in 'county_fips'.
    - name: population_served
      description: Estimated number of persons served by this sampling site (i.e., served by this wastewater
        treatment plant or, if 'sample_location' is "upstream", then by this upstream location)
    - name: sample_id
      description: An anonymized ID assigned to wastewater samples. Wastewater samples for which multiple
        pathogen PCR targets are measured should have the same sample ID.
    - name: date_updated
      description: Timestamp of processing run used in posted data. "As of " stamp.
    - name: hum_frac_target_mic
      description: Name of microbial target used to estimate human fecal content
    - name: rec_eff_target_name
      description: Name of the recovery efficiency control target that is spiked in to the sample process
        to assess recovery efficiency. The measured concentration of this variable is used to calculate
        "rec_eff_percent."
    - name: inhibition_detect
      description: A yes/no flag indicating whether molecular inhibition was detected in the assay. A
        "yes" value means that amplification and detection are suppressed due to interfering substances
        in the sample, while a "no" value means inhibition was not detected. Detecting inhibition is essential
        for assessing assay performance and ensuring reliable quantification of target analytes.
    - name: rec_eff_spike_matrix
      description: 'Matrix into which the recovery efficiency control target is spiked to assess recovery
        efficiency: "rec_eff_percent."'
    - name: pcr_target_detect
      description: Whether or not 'pcr_target' was detected for each sample record. The value is either
        'yes' or 'no' and is calculated after gene target aggregation.
    - name: pcr_target_avg_conc_lin
      description: Concentration of the PCR target on a per sample amount basis; this is merely 'pcr_target_avg_conc',
        where all values are on a linear (not log10) concentration basis. The PCR target is defined in
        the field, 'pcr_target' and its associated target gene in 'pcr_gene_target'.
    - name: record_id
      description: A unique identifier for each row of data.
    - name: source
      description: 'The source of the data collected and reported to CDC''s Wastewater Surveillance Program,
        including public health departments (State_Territory), CDC''s national wastewater testing contract
        (CDC_Verily, or formerly, cdc_biobot) and an academic partner group WastewaterSCAN (WastewaterSCAN).
        For additional information see: https://www.cdc.gov/wastewater/about/index.html'
    - name: hum_frac_mic_unit
      description: Concentration units of microbial target specified in 'hum_frac_target_mic'
    - name: pcr_gene_target_agg
      description: The PCR gene used to quantify PCR target. Multiple gene targets may be tested, in which
        case they would be aggregated to reflect the various targets.
    - name: pcr_type
      description: The type of PCR (e.g., qPCR, dPCR, ddPCR) used to quantify the PCR target
