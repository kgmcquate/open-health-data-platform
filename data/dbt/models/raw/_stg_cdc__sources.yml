version: 2
sources:
- name: cdc
  description: CDC Open Data (Socrata) raw tables, raw.cdc. Generated by data/scripts/scrape_socrata.py.
  database: raw
  schema: cdc
  tables:
  - name: cdc_wastewater_viral_activity_level_for_sars_cov_2_influenza_a_and_rsv
    description: CDC Wastewater Viral Activity Level for SARS-CoV-2, Influenza A and RSV (CDC NWSS). https://data.cdc.gov/d/atcp-73re
    columns:
    - name: counties_served
      description: The county and county-equivalent names served by this sampling site. Note that most
        jurisdictions are covered by counties, but some are covered by county equivalents, such as independent
        cities, parishes, or census areas.
    - name: site_wval
      description: The calculated site wastewater viral activity level (WVAL) for the CDC/MMWR reporting
        week.
    - name: site_wval_category
      description: 'Category for the calculated site WVAL for the CDC/MMWR reporting week. Categories
        are ordinal based on pathogen specific cut-offs of WVAL values: very low, low, moderate, high,
        very high; and includes a ''limited/no data'' category when there is insufficient data to calculate
        a WVAL.'
    - name: week_end
      description: Last date in one week time period for CDC/MMWR reporting week (always a Saturday)
    - name: source
      description: 'The source of the data collected and reported to CDC''s Wastewater Surveillance Program,
        including public health departments (State_Territory), CDC''s national wastewater testing contract
        (CDC_Verily, or formerly, CDC_Biobot) and an academic partner group WastewaterSCAN (WastewaterSCAN).
        For additional information see: https://www.cdc.gov/wastewater/about/index.html'
    - name: population_served
      description: Estimated number of persons served by this sampling site (i.e., served by this wastewater
        treatment plant or, if 'sample_location' is "upstream", then by this upstream location)
    - name: state_territory
      description: State, DC, US territory, or Freely Associated State jurisdiction name (2-letter abbreviation)
        in which the wastewater treatment plant is located
    - name: date_updated
      description: Timestamp of processing run used in posted data. "As of " stamp.
    - name: pathogen_target
      description: Pathogen for which wastewater viral activity levels calculated.
    - name: site
      description: A unique identifier for wastewater treatment plants. This is an arbitrary integer used
        to provide a unique, but anonymous identifier for a wastewater treatment plant. This identifier
        is consistent over time, such that the same plant retains the same ID regardless of the addition
        or subtraction of other plants from the data set.
    - name: date_included_in_wval
      description: Date site first submitted samples for inclusion in WVAL calculation
  - name: influenza_vaccination_coverage_for_all_ages_6_months
    description: Influenza Vaccination Coverage for All Ages (6+ Months) (Flu Vaccinations). https://data.cdc.gov/d/vh55-3he6
    columns:
    - name: population_sample_size
      description: The size of the sample surveyed to create the estimate for each vaccine/dose/geography/dimension
        grouping.
    - name: geography_type
      description: The classification (HHS Region/National, State/Local Area, County) of geographies available.
    - name: vaccine
      description: "The name of the vaccine for which estimates are calculated. Survey respondents are\
        \ periodically asked about the location where they received their influenza vaccination (medical,\
        \ non-medical, pharmacy, or school settings), and these data are stored as \"Influenza Place of\
        \ Vaccination.\" In the main VaxViews data set, this column is titled \u201CVaccine/Exemption/Sample.\u201D"
    - name: year_season
      description: "The influenza season for which estimates are calculated. In the main VaxViews data\
        \ set, this column is titled \u201CYear/Season.\u201D County-level data are reported by survey\
        \ year rather than influenza season."
    - name: month
      description: The cumulative vaccination coverage by month of each influenza season. These data are
        not available for Influenza by Place of Vaccination.
    - name: dimension_type
      description: "The classification of the sociodemographic category for which estimates are calculated.\
        \ For Influenza Place of Vaccination data, the Dimension Type is an age group (6 months-17 years,\
        \ \u226518 years). For influenza vaccines, it is either \"Race/ethnicity\" or \"Age.\""
    - name: dimension
      description: The sociodemographic group for which estimates are calculated for each Vaccine Group.
        For Influenza Place of Vaccination data, this is the setting where vaccination occurred (medical,
        non-medical, pharmacy, or school).
    - name: coverage_estimate
      description: The estimated vaccination coverage or percent of persons vaccinated in a particular
        place. Symbols used within this field indicate particular footnotes about the estimate reliability,
        sample size, confidence intervals, or survey methodology. For more information on the meaning
        of these symbols, refer to the Footnotes in the "About this Data Set" section of this view.
    - name: _95_ci
      description: The 95% confidence interval of the estimate of vaccination coverage.
    - name: fips
      description: "The American National Standards Institute (ANSI)\u2019s Federal Information Processing\
        \ Series code. The codes are alphabetically assigned by geographic name. States have 2-digits\
        \ codes, and counties have 5-digit codes comprising of the 2-digit state code and the 3-digit\
        \ county code."
    - name: geography
      description: The name of the geography for which estimates are calculated.
  - name: nndss_weekly_data
    description: NNDSS Weekly Data (NNDSS). https://data.cdc.gov/d/x9gk-5huc
    columns:
    - name: :@computed_region_skr5_azej
      description: This column was automatically created in order to record in what polygon from the dataset
        'Counties' (skr5-azej) the point in column 'geocode' is located. This enables the creation of
        region maps (choropleths) in the visualization canvas and data lens.
    - name: :@computed_region_hjsp_umg2
      description: This column was automatically created in order to record in what polygon from the dataset
        'States' (hjsp-umg2) the point in column 'geocode' is located. This enables the creation of region
        maps (choropleths) in the visualization canvas and data lens.
