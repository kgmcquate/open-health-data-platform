  - name: vaccination_coverage_among_young_children_0_35_months
    description: Vaccination Coverage among Young Children (0-35 Months) (Child Vaccinations). https://data.cdc.gov/d/fhky-rtsk
    columns:
    - name: _95_ci
      description: The 95% confidence interval of the estimate of vaccination coverage.
    - name: year_season
      description: "The birth year, two-year birth cohort, or four-year birth cohort of children for which\
        \ estimates are calculated. In the main VaxViews data set, this column is titled \u201CYear/Season.\u201D\
        \ As child vaccinations are estimated from ages 0-35 months, the most recent data are from children\
        \ born approximately three years before the data were published (i.e., data published in 2020\
        \ are for children born in 2016 and 2017)."
    - name: dimension_type
      description: The classification of the sociodemographic category for which estimates are calculated
        for each Vaccine Group. For young children, estimates are calculated by age for all birth years/cohorts
        except the four-year birth cohort. For the four-year birth cohort, estimates are calculated overall
        and by insurance coverage, urbanicity, race/ethnicity, and poverty.
    - name: dimension
      description: The sociodemographic group for which estimates are calculated. For all birth years
        and cohorts except the four-year birth cohort, age groups vary depending on the vaccine and dose
        number for which coverage is estimated as vaccines are given at different times in the first 35
        months of life.
    - name: population_sample_size
      description: The size of the sample surveyed to create the estimate for each vaccine/dose/geography/dimension
        grouping.
    - name: dose
      description: "The dose of vaccine (\u22651, \u22652, \u22653, \u22654) for which coverage is estimated."
    - name: coverage_estimate
      description: The estimated percent of children vaccinated. More information can be found in the
        "Data Sources" page at https://www.cdc.gov/vaccines/imz-managers/coverage/childvaxview/data-source.html.
    - name: vaccine
      description: The name of the vaccine for which estimates are calculated.
    - name: geography_type
      description: The classification (HHS Region/National, State/Local Area) of geographies available.
    - name: geography
      description: The name of the geography for which estimates are calculated.
