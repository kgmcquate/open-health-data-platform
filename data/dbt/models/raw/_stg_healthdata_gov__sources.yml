        federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
        2019 report.
    - name: indicated
      description: The number of children (duplicate count) who received a disposition that concludes
        maltreatment could not be substantiated under state law or policy, but there was a reason to suspect
        that at least one child may have been maltreated or was at-risk of maltreatment. For more information
        and definitions of dispositions, federal fiscal year, and unique and duplicate counts, see the
        Glossary in the Child Maltreatment 2019 report.
    - name: intentionally_false
      description: The number of children (duplicate count) who received a disposition that concludes
        the person who made the allegation of maltreatment knew that the allegation was not true. For
