  - name: maltreatment_types_of_victims
    identifier: MALTREATMENT_TYPES_OF_VICTIMS
    description: Maltreatment Types of Victims (U.S. Department of Health and Human Services). https://healthdata.gov/d/8bce-qw8w
    columns:
    - name: medical_neglect_only_percent
      description: The percentage of victims (unique count) with the medical neglect maltreatment type
        (duplicate count). For more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: unknown_only_percent
      description: The percentage of victims (unique count) with the unknown maltreatment type (duplicate
        count). For the definitions of dispositions, federal fiscal year, and unique and duplicate counts,
        see the Glossary in the Child Maltreatment 2019 report.
    - name: total_victims_percent
      description: summed maltreatment types percentages. For the more information and definitions of
        maltreatment types, federal fiscal year, and unique and duplicate counts, see the Glossary in
        the Child Maltreatment 2019 report.
    - name: medical_neglect_only
      description: The number of maltreatment types (duplicate count) substantiated as medical neglect,
        which is defined as failure of the caregiver to provide for the appropriate health care of the
        child although financially able to do so, or offered financial or other resources to do so. For
        more information and definitions of maltreatment types, federal fiscal year, and unique and duplicate
        counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: psychological_maltreatment_1
      description: The percentage of victims (unique count) with the psychological maltreatment, maltreatment
        type (duplicate count). For more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: sex_trafficking_only_percent
      description: The percentage of victims (unique count) with the sexual trafficking maltreatment type
        (duplicate count). For the more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: neglect_only_percent
      description: The percentage of victims (unique count) with the neglect maltreatment type (duplicate
        count). For more information and definitions of maltreatment types, federal fiscal year, and unique
        and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: physical_abuse_only_percent
      description: The percentage of victims (unique count) with the physical abuse maltreatment type
        (duplicate count). For more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: unknown_only
      description: The number of maltreatment types (duplicate count) that were not known or are missing.
        For the definitions of dispositions, federal fiscal year, and unique and duplicate counts, see
        the Glossary in the Child Maltreatment 2019 report.
    - name: total_victims
      description: The total number of child maltreatment victims (unique count) reported to NCANDS for
        federal fiscal year 2019. In NCANDS, a victim is defined as a child for whom the state determined
        at least one maltreatment was substantiated or indicated. This includes a child who died of child
        abuse and neglect. For more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: sex_trafficking_only
      description: The percentage of victims (unique count) with the sex trafficking maltreatment type
        (duplicate count). For the more information and definitions of maltreatment types, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: multiple_maltreatment_types
      description: The percentage of victims (unique count) with the multiple maltreatment type (duplicate
        count). For the more information and definitions of maltreatment types, federal fiscal year, and
        unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: sexual_abuse_only
      description: The number of maltreatment types (duplicate count) substantiated as sexual abuse, which
        is defined as the involvement of the child in sexual activity to provide sexual gratification
        or financial benefit to the perpetrator, including contacts for sexual purposes, molestation,
        statutory rape, prostitution, pornography, exposure, incest, or other sexually exploitative activities.
        For the more information and definitions of maltreatment types, federal fiscal year, and unique
        and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: physical_abuse_only
      description: The number of maltreatment types (duplicate count) substantiated as physical abuse,
        which is defined as physical acts that caused or could have caused physical injury to a child.
        For more information and definitions of maltreatment types, federal fiscal year, and unique and
        duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: sexual_abuse_only_percent
      description: The percentage of victims (unique count) with the sexual abuse maltreatment type (duplicate
        count). For the more information and definitions of maltreatment types, federal fiscal year, and
        unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: other_only
      description: "The number of maltreatment types (duplicate count) substantiated as \u201Cother,\u201D\
        \ which is used when the state coding for this field is not one of the codes in the NCANDS record\
        \ layout. For more information and definitions of maltreatment types, federal fiscal year, and\
        \ unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report."
    - name: neglect_only
      description: The number of maltreatment types (duplicate count) substantiated as neglect, which
        is defined as the failure by the caregiver to provide needed, age-appropriate care although financially
        able to do so or offered financial or other means to do so. For more information and definitions
        of maltreatment types, federal fiscal year, and unique and duplicate counts, see the Glossary
        in the Child Maltreatment 2019 report.
    - name: multiple_maltreatment_types_1
      description: The percentage of victims (unique count) with the multiple maltreatment types (duplicate
        count). For the more information and definitions of maltreatment types, federal fiscal year, and
        unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: state
      description: The primary unit from which child maltreatment data are collected. This includes all
        50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
        includes a national row which displays the total sum, percentage, or rate for only those states
        included in the analysis.
    - name: other_only_percent
      description: "The percentage of victims (unique count) with the \u201Cother\u201D maltreatment type\
        \ (duplicate count). For more information and definitions of maltreatment types, federal fiscal\
        \ year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report."
    - name: psychological_maltreatment
      description: "The number of maltreatment types (duplicate count) substantiated as psychological\
        \ maltreatment, which is defined as acts or omissions\u2014other than physical abuse or sexual\
        \ abuse\u2014that caused or could have caused\u2014conduct, cognitive, affective, or other behavioral\
        \ or mental disorders. For more information and definitions of maltreatment types, federal fiscal\
        \ year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report."
  - name: perpetrators_by_relationship_to_their_victims
    identifier: PERPETRATORS_BY_RELATIONSHIP_TO_THEIR_VICTIMS
    description: Perpetrators by Relationship to Their Victims (U.S. Department of Health and Human Services).
      https://healthdata.gov/d/tw7x-jbvq
    columns:
    - name: relative
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        relative, which is defined as a nonparental family member. For more information and definitions
        of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
        Child Maltreatment 2019 report.
    - name: multiple_relationships
      description: The number of perpetrators (unique count) with multiple relationships to their victim(s),
        which is defined as a perpetrator with two or more relationships to their victims. For more information
        and definitions of relationships, federal fiscal year, and unique and duplicate counts, see the
        Glossary in the Child Maltreatment 2019 report.
    - name: parent
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        parent, which is defined as the birth mother or father, adoptive mother or father, or stepmother
        or stepfather of the child. For more information and definitions of relationships, federal fiscal
        year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: other_professional
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        other professional, which is defined as a person who had contact with the child as part of his
        or her job, but the profession is not listed as one of the NCANDS codes. For more information
        and definitions of relationships, federal fiscal year, and unique and duplicate counts, see the
        Glossary in the Child Maltreatment 2019 report.
    - name: other
      description: "The number of perpetrators (unique count) with a relationship to their victim(s) of\
        \ \u201Cother,\u201D which is used when the state coding for this field is not one of the codes\
        \ in the NCANDS record layout. For more information and definitions of relationships, federal\
        \ fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019\
        \ report."
    - name: legal_guardian
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        legal guardian, which is defined as an adult person who has been given legal custody and guardianship
        of a minor. For more information and definitions of relationships, federal fiscal year, and unique
        and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: group_home_and_residential
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        group home and residential facility staff, which is defined as an employee of a nonfamilial 24-hour
        care facility. For more information and definitions of relationships, federal fiscal year, and
        unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: child_daycare_provider
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        child daycare provider, which is defined as a person with a temporary caregiver responsibility,
        but who is not related to the child, such as a daycare center staff member, family provider, or
        babysitter. For more information and definitions of relationships, federal fiscal year, and unique
        and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: state
      description: The primary unit from which child maltreatment data are collected. This includes all
        50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
        includes a national row which displays the total sum, percentage, or rate for only those states
        included in the analysis.
    - name: total_perpetrators
      description: The number of perpetrators (unique count) in each state. For more information and definitions
        of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
        Child Maltreatment 2019 report.
    - name: foster_parent
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        foster parent, which is defined as an individual who provides a home for orphaned, abused, neglected,
        delinquent, or disabled children under the placement, care, or supervision of the state. For more
        information and definitions of relationships, federal fiscal year, and unique and duplicate counts,
        see the Glossary in the Child Maltreatment 2019 report.
    - name: friend_and_neighbor
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        friend and neighbor, which is defined as a nonrelative acquainted with the child, the parent,
        or caregiver. For more information and definitions of relationships, federal fiscal year, and
        unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
    - name: unmarried_partner_of_parent
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        unmarried partner of parent, which is defined as someone who has an intimate relationship with
        the parent and lives in the household with the parent of the maltreated child. For more information
        and definitions of relationships, federal fiscal year, and unique and duplicate counts, see the
        Glossary in the Child Maltreatment 2019 report.
    - name: unknown
      description: The number of perpetrators (unique count) with a relationship to their victim(s) of
        unknown, which is used when the state may collect data on this variable, but the data for this
        particular report or child were not captured or are missing. For more information and definitions
        of relationships, federal fiscal year, and unique and duplicate counts, see the Glossary in the
        Child Maltreatment 2019 report.
