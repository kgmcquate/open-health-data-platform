  - name: screened_in_and_screened_out_referrals
    identifier: SCREENED_IN_AND_SCREENED_OUT_REFERRALS
    description: Screened-in and Screened-out Referrals (U.S. Department of Health and Human Services).
      https://healthdata.gov/d/k5kg-jgj9
    columns:
    - name: screened_in_referrals_reports_1
      description: The percentage of total referrals that were screened-in for each state during federal
        fiscal year 2019. For more information and definitions of referrals, child maltreatment, and federal
        fiscal year, see the Glossary in the Child Maltreatment 2019 report.
    - name: total_referrals_rate_per
      description: The frequency by each state of referrals alleging child maltreatment per 100,000 children
        in the population younger than 18 years. The state population estimates are from the U.S. Census
        Bureau. For more information and definitions of referrals, child maltreatment, population estimates,
        and federal fiscal year, see the Glossary and State Characteristic appendixes in the Child Maltreatment
        2019 report.
    - name: screened_out_referrals
      description: "Number of screened-out referrals for each state during federal fiscal year 2019. Screened-out\
        \ referrals is defined as an allegation of child maltreatment that did not meet the state\u2019\
        s standards for acceptance as a report. For more information and definitions of referrals, child\
        \ maltreatment, and federal fiscal year, see the Glossary in the Child Maltreatment 2019 report."
    - name: total_referrals
      description: The sum of screened-in and screened-out referrals for each state during federal fiscal
        year 2019. For more information and definitions of referrals, child maltreatment, and federal
        fiscal year, see the Glossary in the Child Maltreatment 2019 report.
    - name: screened_in_referrals_reports
      description: "Number of screened-in referrals for each state during federal fiscal year 2019. Screened-in\
        \ referrals is defined as an allegation of child maltreatment that met the state\u2019s standards\
        \ for acceptance and became a report. For more information and definitions of referrals, child\
        \ maltreatment, and federal fiscal year, see the Glossary in the Child Maltreatment 2019 report."
    - name: screened_out_referrals_percent
      description: The percentage of total referrals that were screened-out for each state during federal
        fiscal year 2019. For more information and definitions of referrals, child maltreatment, and federal
        fiscal year, see the Glossary in the Child Maltreatment 2019 report.
    - name: state
      description: The primary unit from which child maltreatment data are collected. This includes all
        50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
        includes a national row which displays the total sum, percentage, or rate for only those states
        included in the analysis.
