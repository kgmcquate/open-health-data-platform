      description: The number of children (duplicate count) for whom a disposition is unknown or missing.
        For the definitions of dispositions, federal fiscal year, and unique and duplicate counts, see
        the Glossary in the Child Maltreatment 2019 report.
    - name: alternative_response
      description: The number of children (duplicate count) who received the provision of a response other
        than an investigation that determines if a child or family needs services. A determination of
        maltreatment is not made and a perpetrator is not determined. For more information and definitions
        of dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary in the
        Child Maltreatment 2019 report.
    - name: other
      description: "The number of children (duplicate count) who received a disposition of \u201Cother,\u201D\
        \ which is used by states if none of the other dispositions are applicable. For the definitions\
        \ of dispositions, federal fiscal year, and unique and duplicate counts, see the Glossary in the\
        \ Child Maltreatment 2019 report."
    - name: unsubstantiated
      description: The number of children (duplicate count) who received an investigation disposition
        that concludes there was not sufficient evidence under state law to conclude or suspect that the
        child was maltreated or at-risk of being maltreated. For more information and definitions of dispositions,
        federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
        2019 report.
    - name: substantiated
      description: The number of children (duplicate count) who received an investigation disposition
        that concludes the allegation of maltreatment or risk of maltreatment was supported or founded
        by state law or policy. For more information and definitions of dispositions, federal fiscal year,
        and unique and duplicate counts, see the Glossary in the Child Maltreatment 2019 report.
