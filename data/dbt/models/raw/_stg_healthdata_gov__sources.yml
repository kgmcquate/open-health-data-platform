  - name: covid_19_reported_patient_impact_and_hospital_capacity_by_facility
    identifier: COVID_19_REPORTED_PATIENT_IMPACT_AND_HOSPITAL_CAPACITY_BY_FACILITY
    description: COVID-19 Reported Patient Impact and Hospital Capacity by Facility (U.S. Department of
      Health and Human Services). https://healthdata.gov/d/anag-cw7u
    columns:
    - name: staffed_pediatric_icu_bed_occupancy_7_day_sum
      description: 'Sum of set-up and staffed pediatric ICU beds occupied by a patient. This count excludes
        NICU, newborn nursery, and outpatient surgery beds. This is subset of #4c and #6a. This field
        is required as of 2/2/2022. Note: All occupied pediatric ICU beds should be considered, regardless
        of the unit on which the bed is housed. This includes ICU beds located in non-ICU locations, such
        as mixed acuity units.'
    - name: all_pediatric_inpatient_bed_occupied_7_day_avg
      description: 'Average number of set-up and staffed inpatient pediatric beds that are occupied by
        a patient. Includes both PICU and med-surge beds (beds in which medical or surgical pediatric
        patients may be routinely placed). Include any occupied surge/hallway/overflow beds that are open
        for use. This count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset
        of #4a, and reflects occupancy levels for beds reported in #3c. This field is required as of 2/2/2022.'
    - name: all_pediatric_inpatient_bed_occupied_7_day_sum
      description: 'Sum of set-up and staffed inpatient pediatric beds that are occupied by a patient.
        Includes both PICU and med-surge beds (beds in which medical or surgical pediatric patients may
        be routinely placed). Include any occupied surge/hallway/overflow beds that are open for use.
        This count excludes NICU, newborn nursery, and outpatient surgery beds. This is a subset of #4a,
        and reflects occupancy levels for beds reported in #3c. This field is required as of 2/2/2022.'
    - name: staffed_icu_pediatric_patients_confirmed_covid_7_day_sum
      description: 'Sum of pediatric ICU beds occupied by laboratory confirmed positive COVID-19 patients.
        This is a subset of #6c, occupied pediatric ICU beds. This count excludes NICU, newborn nursery,
        and outpatient surgery beds. This field is required as of 2/2/2022. See Appendix D for the definition
        of laboratory-confirmed COVID-19.'
    - name: city
      description: The city of the facility reporting.
    - name: zip
      description: The 5-digit zip code of the facility reporting.
    - name: hospital_subtype
      description: 'The sub-type of the facility reporting. Valid values are: Children''s Hospitals, Critical
        Access Hospitals, Long Term, Psychiatric, Rehabilitation & Short Term. Some facilities are not
        designated with this field.'
    - name: fips_code
      description: The Federal Information Processing Standard (FIPS) code of the location of the hospital.
    - name: is_metro_micro
      description: This is based on whether the facility serves a Metropolitan or Micropolitan area. True
        if yes, and false if no.
    - name: total_beds_7_day_avg
      description: '[FAQ - 2. a)] Average of total number of all staffed inpatient and outpatient beds
        in the hospital, including all overflow, observation, and active surge/expansion beds used for
        inpatients and for outpatients (including all ICU, ED, and observation) reported during the 7-day
        period.'
    - name: all_adult_hospital_beds_7_day_avg
      description: '[FAQ - 2. b)] Average of all staffed inpatient and outpatient adult beds in the hospital,
        including all overflow and active surge/expansion beds for inpatients and for outpatients (including
        all ICU, ED, and observation) reported during the 7-day period.'
    - name: all_adult_hospital_inpatient_beds_7_day_avg
      description: '[FAQ - 3. b)] Average of total number of staffed inpatient adult beds in the hospital
        including all overflow and active surge/expansion beds used for inpatients (including all designated
        ICU beds) reported during the 7-day period.'
    - name: inpatient_beds_used_7_day_avg
      description: '[FAQ - 4. a)] Average of total number of staffed inpatient beds that are occupied
