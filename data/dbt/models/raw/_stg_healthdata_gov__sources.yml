  - name: school_learning_modalities_2020_2021
    identifier: SCHOOL_LEARNING_MODALITIES_2020_2021
    description: School Learning Modalities, 2020-2021 (Centers for Disease Control and Prevention). https://healthdata.gov/d/a8v3-a3m3
    columns:
    - name: city
      description: School district city (NCES 2020-21)
    - name: state
      description: School district state (NCES 2020-21)
    - name: district_nces_id
      description: School district identification number obtained from the National Center for Education
        Statistics (NCES) for the 2020-2021 school year
    - name: district_name
      description: School district name (NCES 2020-21)
    - name: zip_code
      description: School district zip code (NCES 2020-21)
    - name: operational_schools
      description: Number of schools in each district (NCES 2020-21)
    - name: learning_modality
      description: 'The learning modality of a given school district which includes in-person, remote,
        or hybrid learning. In-Person: All schools within the district offer face-to-face instruction
        5 days per week to all students at all available grade levels. Remote: Schools within the district
        do not offer face-to-face instruction; all learning is conducted online/remotely to all students
        at all available grade levels. Hybrid: Schools within the district offer a combination of in-person
        and remote learning; face-to-face instruction is offered less than 5 days per week, or only to
        a subset of students.'
    - name: student_count
      description: Number of students enrolled in each district (NCES 2020-21)
    - name: week
      description: "The start date of the calendar week in which a given learning modality is applicable\
        \ (Sunday \u2013 Saturday)"
