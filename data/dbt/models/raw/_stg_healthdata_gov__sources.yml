    columns:
    - name: child_fatalities_reported_agency
      description: The number of child fatalities (unique count) that were reported by each state in its
        federal fiscal year 2019 Agency File data submission. The Agency File includes aggregate data
        that are often gathered from agencies external to CPS. A child fatality is defined as the death
        of a child as a result of abuse and neglect, because either an injury resulting from the abuse
        and neglect was the cause of death, or abuse and neglect were contributing factors to the cause
        of death. For more information and definitions of Agency File, child fatalities, child maltreatment,
        federal fiscal year, and unique and duplicate counts, see the Glossary in the Child Maltreatment
        2019 report.
    - name: state
      description: The primary unit from which child maltreatment data are collected. This includes all
        50 states, the Commonwealth of Puerto Rico, and the District of Columbia. The state column also
        includes a national row which displays the total sum, percentage, or rate for only those states
        included in the analysis.
    - name: child_fatality_rates_per
      description: The frequency by each state of child deaths due to maltreatment per 100,000 children
        in the population younger than 18 years. The state population estimates are from the U.S. Census
        Bureau. For the definitions of child fatalities and the population estimates used to calculate
        the rates, see the Glossary and State Characteristics appendixes of Child Maltreatment 2019.
    - name: child_fatalities_reported
      description: The number of child fatalities (unique count) that were reported by each state in its
        federal fiscal year 2019 Child File data submission. The Child File is an electronic file of child-specific
        records for each report of alleged child abuse and neglect that received a CPS response. A child
        fatality is defined as the death of a child as a result of abuse and neglect, because either an
        injury resulting from the abuse and neglect was the cause of death, or abuse and neglect were
        contributing factors to the cause of death. For more information and definitions of Child File,
        child fatalities, child maltreatment, federal fiscal year, and unique and duplicate counts, see
        the Glossary in the Child Maltreatment 2019 report.
    - name: total_child_fatalities
      description: The sum of fatalities (unique count) reported by each state in its Child File and Agency
        File for federal fiscal year 2019. A child fatality is defined as the death of a child as a result
        of abuse and neglect, because either an injury resulting from the abuse and neglect was the cause
        of death, or abuse and neglect were contributing factors to the cause of death. For more information
        and definitions of child fatalities, child maltreatment, federal fiscal year and unique and duplicate
        counts, see the Glossary in the Child Maltreatment 2019 report.
