    - name: all_adult_hospital_inpatient_bed_occupied_7_day_avg
      description: '[FAQ - 4. b)] Average of total number of staffed inpatient adult beds that are occupied
        reported during the 7-day period.'
    - name: inpatient_beds_used_covid_7_day_avg
      description: Average of reported patients currently hospitalized in an inpatient bed who have suspected
