    - name: total_staffed_pediatric_icu_beds_7_day_coverage
      description: 'Total number of pediatric ICU beds in the facility that are currently set-up, staffed
        and are or could be used for a patient within the reporting period (coverage). This count includes
        occupied and unoccupied ICU beds, including any ICU beds that are, or could be, staffed and used
        for a pediatric patient. This count excludes NICU, newborn nursery, and outpatient surgery beds.
        This is a subset of #3c and #5a. Any beds counted in #5c should NOT be counted in #5b. This field
        is required as of 2/2/2022. Note: All pediatric ICU beds should be considered, regardless of the
        unit on which the bed is housed. This includes ICU beds located in non-ICU locations, such as
        mixed acuity units.'
    - name: all_pediatric_inpatient_bed_occupied_7_day_coverage
      description: 'Total number of set-up and staffed inpatient pediatric beds that are occupied by a
        patient (coverage). Includes both PICU and med-surge beds (beds in which medical or surgical pediatric
        patients may be routinely placed). Include any occupied surge/hallway/overflow beds that are open
