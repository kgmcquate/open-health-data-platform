name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0010). Every model materializes to an Iceberg table via
# the `iceberg` plugin; dbt writes a scratch Parquet at +location first, the
# plugin commits it to the catalog. Iceberg namespace is set per folder.
#
#   clean/<source>/   -> namespace clean_<source>   (typed, deduped, per source)
#   core/             -> namespace core              (conformed, cross-source)
#   marts/<mart>/     -> namespace mart_<mart>       (presentation)
models:
  ohdp:
    +materialized: external
    +plugin: iceberg
    clean:
      +tags: ["clean"]
      healthdata_gov:
        +iceberg_namespace: "clean_healthdata_gov"
    core:
      +tags: ["core"]
      +iceberg_namespace: "core"
    marts:
      +tags: ["marts"]
      respiratory:
        +iceberg_namespace: "mart_respiratory"

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: true
