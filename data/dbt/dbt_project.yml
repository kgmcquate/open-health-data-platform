name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ohdp:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: true
