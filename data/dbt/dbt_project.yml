name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0012). Plain tables — Snowflake in prod, DuckDB in
# local/CI (profiles.yml). Schema is set per folder; generate_schema_name.sql
# makes it land verbatim instead of dbt's default <target_schema>_<custom>
# double-prefix.
#
#   clean/<source>/   -> schema clean_<source>   (typed, deduped, per source)
#   core/             -> schema core              (conformed, cross-source)
#   marts/<mart>/     -> schema mart_<mart>       (presentation)
models:
  ohdp:
    clean:
      +tags: ["clean"]
      +materialized: table
      healthdata_gov:
        +schema: "clean_healthdata_gov"
    core:
      +tags: ["core"]
      +materialized: table
      +schema: "core"
    marts:
      +tags: ["marts"]
      +materialized: table
      respiratory:
        +schema: "mart_respiratory"

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: true
