name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0013, kept intact by ADR-0019). One database per layer,
# each of which is an Iceberg catalog in its own right now that Snowflake is
# the catalog — so the names are unchanged from when these were plain Snowflake
# tables; only what backs them is different. Every model is a
# Snowflake-managed Iceberg table, written by dbt-duckdb through Horizon's
# Iceberg REST endpoint.
#
# Database is set per folder (generate_database_name.sql applies `+database`).
# Schema is *not* set here: generate_schema_name.sql derives it from the model
# name for any model following the dbt-labs `stg_<source>__<table>` staging
# convention, so the model's file name (and therefore its unique dbt model ID /
# ref()) doesn't have to change just to also carry the schema.
#
#   clean/<source>/   -> CLEAN.STG_<SOURCE>  (typed, deduped, per source)
#   curated/core/     -> CURATED.CORE        (conformed, cross-source)
#   curated/<mart>/   -> CURATED.<MART>      (presentation)
models:
  ohdp:
    +meta:
      automaterialize: true
    clean:
      +tags: ["clean"]
      +materialized: table
      +database: "CLEAN"
    curated:
      +tags: ["curated"]
      +materialized: table
      +database: "CURATED"

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: false
