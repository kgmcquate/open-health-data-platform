name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0019, which replaces ADR-0013's one-Snowflake-database-
# per-layer split with one Iceberg catalog whose flat namespaces carry the
# layer as a prefix). Every model is an Iceberg table in that catalog, written
# by dbt-duckdb.
#
# There is no `+database`: one catalog holds everything, and the profile's
# `database: lakehouse` (the ATTACH alias) is it. Schema is not set here
# either — generate_schema_name.sql derives the namespace from the model name,
# so a model's file name (and therefore its unique dbt model ID / ref())
# doesn't have to change just to also carry the namespace.
#
#   clean/<source>/   -> lakehouse.clean_<source>  (typed, deduped, per source)
#   curated/core/     -> lakehouse.core            (conformed, cross-source)
#   curated/<mart>/   -> lakehouse.mart_<mart>     (presentation)
models:
  ohdp:
    +meta:
      automaterialize: true
    clean:
      +tags: ["clean"]
      +materialized: table
    curated:
      +tags: ["curated"]
      +materialized: table

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: false
