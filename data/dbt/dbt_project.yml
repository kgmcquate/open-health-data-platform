name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0013, which replaces ADR-0012's single-database,
# layer-prefixed-schema layout with one Snowflake database per layer). Plain
# tables, Snowflake only (ADR-0014).
#
# Database is set per folder (generate_database_name.sql applies `+database`).
# Schema is *not* set here for `clean`: generate_schema_name.sql instead
# derives it from the model name for any model following the dbt-labs
# `stg_<source>__<table>` staging convention, so the model's file name (and
# therefore its unique dbt model ID / ref()) doesn't have to change just to
# also carry the schema.
#
#   clean/<source>/   -> CLEAN.stg_<source>  (typed, deduped, per source)
#   core/             -> CURATED.core        (conformed, cross-source)
#   marts/<mart>/     -> CURATED.<mart>      (presentation)
models:
  ohdp:
    +meta:
      automaterialize: true
    clean:
      +tags: ["clean"]
      +materialized: table
      +database: "clean"
    curated:
      +tags: ["curated"]
      +materialized: table
      +database: "curated"

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: true
