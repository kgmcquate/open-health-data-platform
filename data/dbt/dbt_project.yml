name: "ohdp"
version: "0.0.0"
config-version: 2

profile: "ohdp"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Medallion layers (ADR-0013, which replaces ADR-0012's single-database,
# layer-prefixed-schema layout with one Snowflake database per layer). Plain
# tables, Snowflake only (ADR-0014).
#
# Schema and database are set per folder. generate_schema_name.sql makes the
# schema land verbatim instead of dbt's default <target_schema>_<custom>
# double-prefix. generate_database_name.sql applies `+database`.
#
#   clean/<source>/   -> CLEAN.<source>     (typed, deduped, per source)
#   core/             -> CURATED.core       (conformed, cross-source)
#   marts/<mart>/     -> CURATED.<mart>     (presentation)
models:
  ohdp:
    +meta:
      automaterialize: true
    clean:
      +tags: ["clean"]
      +materialized: table
      +database: "CLEAN"
      healthdata_gov:
        +schema: "healthdata_gov"
    core:
      +tags: ["core"]
      +materialized: table
      +database: "CURATED"
      +schema: "core"
    marts:
      +tags: ["marts"]
      +materialized: table
      +database: "CURATED"
      respiratory:
        +schema: "respiratory"

# The test gate is load-bearing (ARCHITECTURE.md §3): a failed test must stop
# the publish. Keep severity at error for anything a dashboard number depends on.
tests:
  ohdp:
    +severity: error
    +store_failures: true
