# dbt-snowflake is the only compute engine (ADR-0014, which supersedes
# ADR-0012's local/CI DuckDB targets — see that ADR's superseding note for
# why; ADR-0013's per-layer-database split still applies via `+database`/
# `+schema`, generate_database_name.sql / generate_schema_name.sql).
#
# `dbt parse` (CI, the image, `data/tests/conftest.py`) only needs the profile
# to render, not a live connection, so every env var below defaults to empty
# when unset rather than erroring — `dbt build`/`dbt run` still fail loudly if
# it's actually missing when Snowflake is queried.
#
# Requires the project venv: `cd data && uv run dbt ...`
ohdp:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('OHDP_SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('OHDP_SNOWFLAKE_USER', '') }}"
      # Snowflake SERVICE users don't accept password auth — key-pair is the
      # supported mechanism. PKCS#8 PEM, read straight from the env var.
      private_key: "{{ env_var('OHDP_SNOWFLAKE_PRIVATE_KEY', '') }}"
      role: "{{ env_var('OHDP_SNOWFLAKE_ROLE', '') }}"
      # Required fallback; every model overrides both via `+database`/`+schema`
      # (generate_database_name.sql / generate_schema_name.sql, ADR-0013).
      database: "CLEAN"
      warehouse: "{{ env_var('OHDP_SNOWFLAKE_WAREHOUSE', '') }}"
      schema: "core"
      threads: 4
