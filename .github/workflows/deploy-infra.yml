name: Deploy infra (Terraform)

# Creates real, billed DigitalOcean resources. Defaults to `plan`;
# `apply` and `destroy` must be chosen deliberately and `destroy` additionally
# requires typing the confirmation string.

on:
  pull_request:
    paths:
      - "platform/terraform/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to run.
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: For destroy only — type the project name (e.g. ohdp) to confirm.
        type: string
        default: ""

concurrency:
  # Never let two applies touch the same state.
  group: terraform-infra
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform/terraform

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
  # Cloudflare DNS for the platform hostnames. The provider reads the token from
  # CLOUDFLARE_API_TOKEN directly. loadbalancer_ip is blank until deploy-platform
  # has provisioned the Traefik LB — the records are skipped until it is set,
  # then this workflow is re-run to create them.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_loadbalancer_ip: ${{ secrets.LOADBALANCER_IP }}
  # DigitalOcean Spaces credentials for the S3-compatible state backend.
  SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  SPACES_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Guard destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "ohdp" ]; then
            echo "::error::destroy requires 'confirm' to be the project name."
            exit 1
          fi
          echo "::warning::Destroying all infrastructure. State bucket is not managed here and survives."

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          set -euo pipefail
          terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        if: inputs.action != 'destroy'
        id: plan
        run: terraform plan -out=tfplan -detailed-exitcode || [ $? -eq 2 ]

      - name: Plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan

      - name: Show plan
        run: |
          terraform show -no-color tfplan | tee plan.txt
          {
            echo "### terraform ${{ inputs.action || 'plan' }}"
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          echo "cluster_id=$(terraform output -raw cluster_id)"
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)"
          echo ""
          echo "Fetch the kubeconfig and store it as the KUBECONFIG_B64 secret:"
          echo "  terraform output -raw kubeconfig | base64"
