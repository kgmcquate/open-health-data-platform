name: Deploy infra (Terraform)

# Creates real Kamatera and Cloudflare resources. Defaults to `plan`;
# `apply` and `destroy` must be chosen deliberately and `destroy` additionally
# requires typing the confirmation string.

on:
  pull_request:
    paths:
      - "platform/terraform/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: What to run.
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirm:
        description: For destroy only — type the project name (e.g. ohdp) to confirm.
        type: string
        default: ""

concurrency:
  # Never let two applies touch the same state.
  group: terraform-infra
  cancel-in-progress: false

defaults:
  run:
    working-directory: platform/terraform

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VAR_kamatera_api_client_id: ${{ secrets.KAMATERA_API_CLIENT_ID }}
  TF_VAR_kamatera_api_secret: ${{ secrets.KAMATERA_API_SECRET }}
  # The provider also reads these unprefixed names directly.
  KAMATERA_API_CLIENT_ID: ${{ secrets.KAMATERA_API_CLIENT_ID }}
  KAMATERA_API_SECRET: ${{ secrets.KAMATERA_API_SECRET }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
  TF_VAR_domain: ${{ secrets.DOMAIN }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
  # R2 credentials for the S3-compatible state backend.
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Guard destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "ohdp" ]; then
            echo "::error::destroy requires 'confirm' to be the project name."
            exit 1
          fi
          echo "::warning::Destroying all infrastructure. State bucket is not managed here and survives."

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          set -euo pipefail
          terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        if: inputs.action != 'destroy'
        id: plan
        run: terraform plan -out=tfplan -detailed-exitcode || [ $? -eq 2 ]

      - name: Plan (destroy)
        if: inputs.action == 'destroy'
        run: terraform plan -destroy -out=tfplan

      - name: Show plan
        run: |
          terraform show -no-color tfplan | tee plan.txt
          {
            echo "### terraform ${{ inputs.action || 'plan' }}"
            echo '```terraform'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform apply -auto-approve tfplan

      - name: Outputs
        if: inputs.action == 'apply'
        run: |
          ip=$(terraform output -raw node_ipv4)
          api=$(terraform output -raw api_hostname)
          echo "node_ipv4=$ip"
          echo "api_hostname=$api"
          echo ""
          echo "Fetch the kubeconfig and store it as the KUBECONFIG_B64 secret:"
          echo "  ssh root@$ip 'cat /etc/rancher/k3s/k3s.yaml' \\"
          echo "    | sed \"s#https://127.0.0.1:6443#https://$api:6443#\" | base64"
