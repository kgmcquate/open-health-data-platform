name: Build images

# Each image builds only when its own code changed (the `changes` job below),
# and a merge to main auto-deploys the helm release(s) for whichever images
# actually built — dagster for ohdp-pipeline, cube for ohdp-cube, hub-api +
# mcp-cube (same image, ADR: platform/helm/charts/mcp-cube/values.yaml) for
# ohdp-hub-api. Charts for images that didn't change are left alone; their
# release keeps running whatever tag it was last deployed with.
#
# workflow_dispatch always builds every image (there's no "before" commit to
# diff against) but never auto-deploys — use deploy-platform.yml for a manual
# rollout, e.g. to redeploy an unrelated chart at a specific image_tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push to the registry (set false when running under act).
        type: boolean
        default: true

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      hub_api: ${{ steps.filter.outputs.hub_api || steps.dispatch.outputs.hub_api }}
      pipeline: ${{ steps.filter.outputs.pipeline || steps.dispatch.outputs.pipeline }}
      cube: ${{ steps.filter.outputs.cube || steps.dispatch.outputs.cube }}
    steps:
      - uses: actions/checkout@v4

      - name: Diff against the previous commit
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            hub_api:
              - apps/api/**
              - apps/web/**
              - packages/shared/**
              - .github/workflows/build-images.yml
              - .github/actions/build-and-push-image/**
            pipeline:
              - data/**
              - packages/shared/**
              - .github/workflows/build-images.yml
              - .github/actions/build-and-push-image/**
            cube:
              - semantic/cube/**
              - data/dbt/**
              - data/scripts/install_dbt_fusion.sh
              - .github/workflows/build-images.yml
              - .github/actions/build-and-push-image/**

      - name: Manual dispatch builds everything
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "hub_api=true" >> "$GITHUB_OUTPUT"
          echo "pipeline=true" >> "$GITHUB_OUTPUT"
          echo "cube=true" >> "$GITHUB_OUTPUT"

  build-hub-api:
    name: Build ohdp-hub-api
    needs: changes
    if: needs.changes.outputs.hub_api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-hub-api
          dockerfile: apps/api/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  build-pipeline:
    name: Build ohdp-pipeline
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-pipeline
          dockerfile: data/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  build-cube:
    name: Build ohdp-cube
    needs: changes
    if: needs.changes.outputs.cube == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-cube
          dockerfile: semantic/cube/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  # Auto-deploy only on a real merge to main — never under workflow_dispatch,
  # which is also used to build without a cluster (e.g. under act). Shares
  # deploy-platform.yml's concurrency group so a manual full deploy and an
  # auto partial deploy can never touch the cluster at the same time.
  deploy-hub-api:
    name: Deploy hub-api + mcp-cube
    needs: build-hub-api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - name: "hub-api + mcp-cube (same image, ADR: platform/helm/charts/mcp-cube/values.yaml)"
        run: make -C platform/helm hub-api mcp-cube TAG=${{ needs.build-hub-api.outputs.tag }}

      - if: always()
        run: kubectl get pods -n app

  deploy-pipeline:
    name: Deploy dagster
    needs: build-pipeline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - run: make -C platform/helm repos

      - name: dagster
        run: make -C platform/helm dagster TAG=${{ needs.build-pipeline.outputs.tag }}

      - if: always()
        run: kubectl get pods -n data

  deploy-cube:
    name: Deploy cube
    needs: build-cube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - name: cube (+ Cube Store, ADR-0024 — the `cube` make target depends on `cubestore`)
        run: make -C platform/helm cube TAG=${{ needs.build-cube.outputs.tag }}

      - if: always()
        run: kubectl get pods -n data
