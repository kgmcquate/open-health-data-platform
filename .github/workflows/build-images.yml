name: Build images

# Every image builds on every merge to main, regardless of which paths
# changed — images are tagged sha-<12> per commit (see
# .github/actions/build-and-push-image), so there's no collision risk and no
# need to diff paths. A merge to main always auto-deploys all three helm
# releases — dagster for ohdp-pipeline, cube for ohdp-cube, hub-api + mcp-cube
# (same image, ADR: platform/helm/charts/mcp-cube/values.yaml) for
# ohdp-hub-api.
#
# workflow_dispatch builds every image too, but never auto-deploys — use
# deploy-platform.yml for a manual rollout, e.g. to redeploy an unrelated
# chart at a specific image_tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: Push to the registry (set false when running under act).
        type: boolean
        default: true

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-hub-api:
    name: Build ohdp-hub-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-hub-api
          dockerfile: apps/api/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  build-pipeline:
    name: Build ohdp-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-pipeline
          dockerfile: data/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  build-cube:
    name: Build ohdp-cube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to push
        id: push
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-and-push-image
        id: build
        with:
          name: ohdp-cube
          dockerfile: semantic/cube/Dockerfile
          push: ${{ steps.push.outputs.enabled }}

  # Auto-deploy only on a real merge to main — never under workflow_dispatch,
  # which is also used to build without a cluster (e.g. under act). Shares
  # deploy-platform.yml's concurrency group so a manual full deploy and an
  # auto partial deploy can never touch the cluster at the same time.
  deploy-hub-api:
    name: Deploy hub-api + mcp-cube
    needs: build-hub-api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - name: "hub-api + mcp-cube (same image, ADR: platform/helm/charts/mcp-cube/values.yaml)"
        run: make -C platform/helm hub-api mcp-cube TAG=${{ needs.build-hub-api.outputs.tag }}

      - if: always()
        run: kubectl get pods -n app

  deploy-pipeline:
    name: Deploy dagster
    needs: build-pipeline
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - run: make -C platform/helm repos

      - name: dagster
        run: make -C platform/helm dagster TAG=${{ needs.build-pipeline.outputs.tag }}

      - if: always()
        run: kubectl get pods -n data

  deploy-cube:
    name: Deploy cube
    needs: build-cube
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      - name: cube (+ Cube Store, ADR-0024 — the `cube` make target depends on `cubestore`)
        run: make -C platform/helm cube TAG=${{ needs.build-cube.outputs.tag }}

      - if: always()
        run: kubectl get pods -n data
