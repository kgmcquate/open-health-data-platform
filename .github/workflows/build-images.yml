name: Build images

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "data/**"
      - "packages/shared/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      push:
        description: Push to the registry (set false when running under act).
        type: boolean
        default: true

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercased below — GHCR rejects uppercase in a repository path, and
  # github.repository_owner preserves the account's original casing.
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ohdp-hub-api
            dockerfile: apps/api/Dockerfile
          - name: ohdp-pipeline
            dockerfile: data/Dockerfile
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        run: |
          set -euo pipefail
          owner=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
          tag="sha-${GITHUB_SHA::12}"
          echo "image=${REGISTRY}/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building ${REGISTRY}/${owner}/${{ matrix.name }}:${tag}"

      - name: Decide whether to push
        id: push
        run: |
          # workflow_dispatch supplies the input; the push trigger does not.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.push.outputs.enabled == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "    ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo ""
            echo "pushed: ${{ steps.push.outputs.enabled }}"
          } >> "$GITHUB_STEP_SUMMARY"
