name: Deploy platform

# Preflight (lint + render) runs on every dispatch and needs no cluster — it is
# the useful target under `act`. Tick `deploy` to actually apply.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply to the cluster (unticked = preflight only).
        type: boolean
        default: true
      image_tag:
        description: Override the dagster + hub-api + cube image tag (blank = the sha-<12> of the deployed commit).
        type: string
        default: ""
      deploy_all:
        description: Deploy every chart (overrides the individual chart checkboxes below).
        type: boolean
        default: true
      deploy_foundation:
        description: "Chart: platform-base, Traefik, cert-manager, ClusterIssuer"
        type: boolean
        default: false
      deploy_opensearch:
        description: "Chart: OpenSearch"
        type: boolean
        default: false
      deploy_openmetadata:
        description: "Chart: OpenMetadata"
        type: boolean
        default: false
      deploy_proxy:
        description: "Chart: GraphQL authz proxy"
        type: boolean
        default: false
      deploy_dagster_monitoring:
        description: "Chart: Dagster monitoring dashboard"
        type: boolean
        default: false
      deploy_oauth2_proxy:
        description: "Chart: oauth2-proxy"
        type: boolean
        default: false
      deploy_dagster:
        description: "Chart: Dagster"
        type: boolean
        default: false
      deploy_cube:
        description: "Chart: Cube (+ Cube Store, ADR-0024)"
        type: boolean
        default: false
      deploy_hub_api:
        description: "Chart: hub-api (does its own OIDC sign-in, no oauth2-proxy wall)"
        type: boolean
        default: false

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and render the charts we own
        run: make -C platform/helm lint template

      - name: Validate the upstream values files parse
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          for f in platform/helm/values/*.yaml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok: $f"
          done

  deploy:
    name: Deploy
    needs: preflight
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      # dagster + hub-api + cube run this tag. Defaults to the sha-<12> of
      # the checked-out commit — the tag build-images.yml pushed for it. Never
      # `latest`, so `helm rollback` and pod restarts stay pinned to a known build.
      - name: Resolve image tag
        run: echo "TAG=${IMAGE_TAG:-sha-${GITHUB_SHA::12}}" >> "$GITHUB_ENV"
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Helm repos
        run: make -C platform/helm repos

      # platform-base generates every internal secret itself; nothing sensitive
      # is passed to this step.
      - name: Foundation — platform-base, Traefik, cert-manager, ClusterIssuer
        if: inputs.deploy_all || inputs.deploy_foundation
        run: make -C platform/helm base traefik cert-manager cluster-issuer

      # The only externally-issued secrets. Endpoint + bucket are non-secret and
      # live in data/ohdp-pipeline-config (platform-base).
      - name: External secrets
        env:
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # The lakehouse credentials Terraform issues (ADR-0019): a Snowflake
          # PAT for the Iceberg REST catalog, and an IAM key for the one thing
          # that can't use it (dlt's Parquet writes into the external volume).
          #   terraform output -raw snowflake_pipeline_pat         | gh secret set SNOWFLAKE_PIPELINE_PAT
          #   terraform output -raw aws_pipeline_access_key_id     | gh secret set AWS_PIPELINE_ACCESS_KEY_ID
          #   terraform output -raw aws_pipeline_secret_access_key | gh secret set AWS_PIPELINE_SECRET_ACCESS_KEY
          SNOWFLAKE_PIPELINE_PAT: ${{ secrets.SNOWFLAKE_PIPELINE_PAT }}
          AWS_PIPELINE_ACCESS_KEY_ID: ${{ secrets.AWS_PIPELINE_ACCESS_KEY_ID }}
          AWS_PIPELINE_SECRET_ACCESS_KEY: ${{ secrets.AWS_PIPELINE_SECRET_ACCESS_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          CDC_APP_TOKEN: ${{ secrets.CDC_APP_TOKEN }}
          OPENMETADATA_JWT: ${{ secrets.OPENMETADATA_JWT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DAGSTER_OIDC_CLIENT_ID: ${{ secrets.DAGSTER_OIDC_CLIENT_ID }}
          DAGSTER_OIDC_CLIENT_SECRET: ${{ secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          # hub-api's own OIDC client (hub_api.auth) reuses the same Google
          # client, which must list
          # https://app.open-health-data-platform.org/auth/callback among its
          # authorized redirect URIs.
          APP_OIDC_CLIENT_ID: ${{ secrets.DAGSTER_OIDC_CLIENT_ID }}
          APP_OIDC_CLIENT_SECRET: ${{ secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          # hub-api's own agent, still Anthropic direct (docs/chatbot.md §4).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # OpenAI-spec backend for the Hub UI model picker (docs/chatbot.md §4a).
          # Without it the OpenRouter-backed models simply don't appear; the rest
          # of the app works normally.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Fine-grained PAT, issues:write on OHDP_GITHUB_ISSUES_REPO and nothing
          # else. It backs a tool a chat user can trigger (hub_api.issues), so
          # its scope is the blast radius — never a classic PAT, never `repo`.
          # Create at github.com/settings/personal-access-tokens, then:
          #   gh secret set HUB_GITHUB_ISSUES_TOKEN
          HUB_GITHUB_ISSUES_TOKEN: ${{ secrets.HUB_GITHUB_ISSUES_TOKEN }}
          # Shared bearer for hub-api's /tools app. Rotate by re-running this job
          # after `gh secret set TOOLS_AUTH_TOKEN`.
          TOOLS_AUTH_TOKEN: ${{ secrets.TOOLS_AUTH_TOKEN }}
          SNOWFLAKE_PIPELINE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PIPELINE_PRIVATE_KEY }}
        run: |
          upsert() { kubectl -n "$1" create secret generic "$2" "${@:3}" \
            --dry-run=client -o yaml | kubectl apply -f -; }
          # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are the *Spaces* pair, for
          # Dagster's S3ComputeLogManager (dagster.yaml) — it takes no
          # access-key config and reads them off the process environment. The
          # lakehouse never competes for them: dlt takes its S3 credentials as
          # explicit config (OHDP_AWS_*), and the catalog is reached with a
          # Snowflake token rather than an AWS signature (ADR-0019).
          upsert data ohdp-pipeline-secrets \
            --from-literal=OHDP_SPACES_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
            --from-literal=OHDP_SPACES_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            --from-literal=AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            --from-literal=OHDP_AWS_ACCESS_KEY_ID="$AWS_PIPELINE_ACCESS_KEY_ID" \
            --from-literal=OHDP_AWS_SECRET_ACCESS_KEY="$AWS_PIPELINE_SECRET_ACCESS_KEY" \
            --from-literal=OHDP_OPENAQ_API_KEY="$OPENAQ_API_KEY" \
            --from-literal=OHDP_CDC_APP_TOKEN="$CDC_APP_TOKEN" \
            --from-literal=OHDP_OPENMETADATA_JWT="$OPENMETADATA_JWT" \
            --from-literal=OHDP_SNOWFLAKE_PAT="$SNOWFLAKE_PIPELINE_PAT" \
            --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$SNOWFLAKE_PIPELINE_PRIVATE_KEY"
          # Cube queries Snowflake directly with the OHDP_PIPELINE
          # role/key — the same identity the pipeline writes with (ADR-0019).
          upsert data cube-snowflake \
            --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$SNOWFLAKE_PIPELINE_PRIVATE_KEY"
          # OHDP_ANTHROPIC_API_KEY is what the chat agent bills against
          # (docs/chatbot.md §4). Without it /api/chat answers 503 and the rest
          # of the app still works, which is the intended degradation.
          # OHDP_GITHUB_TOKEN/OHDP_TOOLS_AUTH_TOKEN back /tools/report_issue.
          # Same intended degradation as the Anthropic key: unset, that one
          # endpoint answers 503 and nothing else changes.
          # OHDP_OIDC_CLIENT_ID/_SECRET back hub-api's own sign-in
          # (hub_api.auth) — without them /auth/login answers 503 rather than
          # half-working.
          # OHDP_OPENAI_API_BASE_URLS/_KEYS enable OpenAI-spec backends such as
          # OpenRouter. They live in their own Secret so the key is rotated
          # without touching hub-api-secrets.
          upsert app openrouter-secrets \
            --from-literal=OHDP_OPENAI_API_BASE_URLS="https://openrouter.ai/api/v1" \
            --from-literal=OHDP_OPENAI_API_KEYS="$OPENROUTER_API_KEY"
          upsert app hub-api-secrets \
            --from-literal=OHDP_OPENMETADATA_JWT="$OPENMETADATA_JWT" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=OHDP_OIDC_CLIENT_ID="$APP_OIDC_CLIENT_ID" \
            --from-literal=OHDP_OIDC_CLIENT_SECRET="$APP_OIDC_CLIENT_SECRET" \
            --from-literal=OHDP_ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=OHDP_GITHUB_TOKEN="$HUB_GITHUB_ISSUES_TOKEN" \
            --from-literal=OHDP_TOOLS_AUTH_TOKEN="$TOOLS_AUTH_TOKEN"
          # OHDP_SNOWFLAKE_PRIVATE_KEY is the RSA key pair's private half
          # (PKCS#8 PEM) — Snowflake SERVICE users don't accept password auth,
          # so this is what the SQL connector authenticates with. The REST
          # catalog uses the PAT instead (ADR-0019). Terraform generates both;
          # publish the key with:
          #   terraform output -raw snowflake_private_key | gh secret set SNOWFLAKE_PIPELINE_PRIVATE_KEY
          # To rotate, force-replace the key and re-run the two steps above:
          #   terraform apply -replace=tls_private_key.pipeline

          # oauth2-proxy (ADR-0007). platform-base owns this Secret and generates
          # `cookie-secret`; we merge the Google client creds into it. --type merge
          # preserves cookie-secret, and Helm's 3-way merge leaves these keys alone
          # on later `helm upgrade platform-base` runs.
          patch=$(printf '{"data":{"client-id":"%s","client-secret":"%s"}}' \
            "$(printf %s "$DAGSTER_OIDC_CLIENT_ID" | base64 -w0)" \
            "$(printf %s "$DAGSTER_OIDC_CLIENT_SECRET" | base64 -w0)")
          kubectl -n data patch secret oauth2-proxy-secret --type merge -p "$patch"

      - name: OpenSearch
        if: inputs.deploy_all || inputs.deploy_opensearch
        run: make -C platform/helm opensearch

      - name: OpenMetadata
        if: inputs.deploy_all || inputs.deploy_openmetadata
        run: make -C platform/helm openmetadata

      - name: GraphQL authz proxy
        if: inputs.deploy_all || inputs.deploy_proxy
        run: make -C platform/helm proxy

      - name: Dagster monitoring dashboard
        if: inputs.deploy_all || inputs.deploy_dagster_monitoring
        run: make -C platform/helm dagster-monitoring

      - name: oauth2-proxy (Google login wall — Dagster + monitoring)
        if: inputs.deploy_all || inputs.deploy_oauth2_proxy
        run: make -C platform/helm oauth2-proxy

      - name: Dagster
        if: inputs.deploy_all || inputs.deploy_dagster
        run: make -C platform/helm dagster TAG="$TAG"

      - name: Cube (+ Cube Store, ADR-0024 — the `cube` make target depends on `cubestore`)
        if: inputs.deploy_all || inputs.deploy_cube
        run: make -C platform/helm cube TAG="$TAG"

      - name: hub-api
        if: inputs.deploy_all || inputs.deploy_hub_api
        run: make -C platform/helm hub-api TAG="$TAG"

      - name: Pods
        if: always()
        run: kubectl get pods -A
