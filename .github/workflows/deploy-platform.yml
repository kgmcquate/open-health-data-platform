name: Deploy platform

# Preflight (lint + render) runs on every dispatch and needs no cluster — it is
# the useful target under `act`. Tick `deploy` to actually apply.

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Apply to the cluster (unticked = preflight only).
        type: boolean
        default: true
      image_tag:
        description: Override the dagster + hub-api + mcp-cube + streamlit + cube image tag (blank = the sha-<12> of the deployed commit).
        type: string
        default: ""
      deploy_all:
        description: Deploy every chart (overrides the individual chart checkboxes below).
        type: boolean
        default: true
      deploy_foundation:
        description: "Chart: platform-base, Traefik, cert-manager, ClusterIssuer (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_opensearch:
        description: "Chart: OpenSearch (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_openmetadata:
        description: "Chart: OpenMetadata (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_proxy:
        description: "Chart: GraphQL authz proxy (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_dagster_monitoring:
        description: "Chart: Dagster monitoring dashboard (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_oauth2_proxy:
        description: "Chart: oauth2-proxy (Dagster + monitoring wall) (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_dagster:
        description: "Chart: Dagster (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_cube:
        description: "Chart: Cube (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_streamlit:
        description: "Chart: Streamlit (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_oauth2_proxy_streamlit:
        description: "Chart: oauth2-proxy (Streamlit wall) (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_hub_api:
        description: "Chart: hub-api (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_oauth2_proxy_app:
        description: "Chart: oauth2-proxy (hub app wall) (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_mcp_cube:
        description: "Chart: Cube MCP server (ignored if deploy_all is checked)"
        type: boolean
        default: false
      deploy_open_webui:
        description: "Chart: Open WebUI (ignored if deploy_all is checked)"
        type: boolean
        default: false

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and render the charts we own
        run: make -C platform/helm lint template

      - name: Validate the upstream values files parse
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          for f in platform/helm/values/*.yaml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok: $f"
          done

  deploy:
    name: Deploy
    needs: preflight
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-kube
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_B64 }}

      # dagster + hub-api + mcp-cube + streamlit + cube run this tag. Defaults to the sha-<12> of
      # the checked-out commit — the tag build-images.yml pushed for it. Never
      # `latest`, so `helm rollback` and pod restarts stay pinned to a known build.
      - name: Resolve image tag
        run: echo "TAG=${IMAGE_TAG:-sha-${GITHUB_SHA::12}}" >> "$GITHUB_ENV"
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}

      - name: Helm repos
        run: make -C platform/helm repos

      # platform-base generates every internal secret itself; nothing sensitive
      # is passed to this step.
      - name: Foundation — platform-base, Traefik, cert-manager, ClusterIssuer
        if: inputs.deploy_all || inputs.deploy_foundation
        run: make -C platform/helm base traefik cert-manager cluster-issuer

      # The only externally-issued secrets. Endpoint + bucket are non-secret and
      # live in data/ohdp-pipeline-config (platform-base).
      - name: External secrets
        env:
          SPACES_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          SPACES_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
          # The lakehouse credentials Terraform issues (ADR-0019): a Snowflake
          # PAT for the Iceberg REST catalog, and an IAM key for the one thing
          # that can't use it (dlt's Parquet writes into the external volume).
          #   terraform output -raw snowflake_pipeline_pat         | gh secret set SNOWFLAKE_PIPELINE_PAT
          #   terraform output -raw aws_pipeline_access_key_id     | gh secret set AWS_PIPELINE_ACCESS_KEY_ID
          #   terraform output -raw aws_pipeline_secret_access_key | gh secret set AWS_PIPELINE_SECRET_ACCESS_KEY
          SNOWFLAKE_PIPELINE_PAT: ${{ secrets.SNOWFLAKE_PIPELINE_PAT }}
          AWS_PIPELINE_ACCESS_KEY_ID: ${{ secrets.AWS_PIPELINE_ACCESS_KEY_ID }}
          AWS_PIPELINE_SECRET_ACCESS_KEY: ${{ secrets.AWS_PIPELINE_SECRET_ACCESS_KEY }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          CDC_APP_TOKEN: ${{ secrets.CDC_APP_TOKEN }}
          OPENMETADATA_JWT: ${{ secrets.OPENMETADATA_JWT }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          DAGSTER_OIDC_CLIENT_ID: ${{ secrets.DAGSTER_OIDC_CLIENT_ID }}
          DAGSTER_OIDC_CLIENT_SECRET: ${{ secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          STREAMLIT_OIDC_CLIENT_ID: ${{ secrets.DAGSTER_OIDC_CLIENT_ID }}
          STREAMLIT_OIDC_CLIENT_SECRET: ${{ secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          # The hub app's wall reuses the same Google client, which must list
          # https://app.open-health-data-platform.org/oauth2/callback among its
          # authorized redirect URIs.
          APP_OIDC_CLIENT_ID: ${{ secrets.DAGSTER_OIDC_CLIENT_ID }}
          APP_OIDC_CLIENT_SECRET: ${{ secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          # Open WebUI's Google client (ADR-0017). A *separate* repo secret from
          # the three walls above, not a reuse: this one is Open WebUI's own
          # OAuth integration rather than an oauth2-proxy wall, its redirect URI
          # is https://chat.open-health-data-platform.org/oauth/google/callback,
          # and it is the only credential standing in front of a metered
          # Anthropic key. Set OPENWEBUI_OIDC_CLIENT_ID / _SECRET in the repo;
          # they fall back to Dagster's client, which works only if that client
          # also lists the chat redirect URI.
          OPENWEBUI_OIDC_CLIENT_ID: ${{ secrets.OPENWEBUI_OIDC_CLIENT_ID || secrets.DAGSTER_OIDC_CLIENT_ID }}
          OPENWEBUI_OIDC_CLIENT_SECRET: ${{ secrets.OPENWEBUI_OIDC_CLIENT_SECRET || secrets.DAGSTER_OIDC_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # JWT for the dedicated "openwebui-mcp" OpenMetadata Bot (read-only
          # Data Consumer role) — deliberately not OPENMETADATA_JWT below,
          # which backs the pipeline's/hub-api's broader-permission bot. Chat
          # users querying the catalog through Open WebUI's MCP connection
          # should only ever get read-only access. Created once by hand via
          # Settings -> Bots in the OM UI (no API for it), then:
          #   gh secret set OPENWEBUI_OPENMETADATA_MCP_TOKEN
          OPENWEBUI_OPENMETADATA_MCP_TOKEN: ${{ secrets.OPENWEBUI_OPENMETADATA_MCP_TOKEN }}
          SNOWFLAKE_PIPELINE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PIPELINE_PRIVATE_KEY }}
        run: |
          upsert() { kubectl -n "$1" create secret generic "$2" "${@:3}" \
            --dry-run=client -o yaml | kubectl apply -f -; }
          # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are the *Spaces* pair, for
          # Dagster's S3ComputeLogManager (dagster.yaml) — it takes no
          # access-key config and reads them off the process environment. The
          # lakehouse never competes for them: dlt takes its S3 credentials as
          # explicit config (OHDP_AWS_*), and the catalog is reached with a
          # Snowflake token rather than an AWS signature (ADR-0019).
          upsert data ohdp-pipeline-secrets \
            --from-literal=OHDP_SPACES_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
            --from-literal=OHDP_SPACES_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            --from-literal=AWS_ACCESS_KEY_ID="$SPACES_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$SPACES_SECRET_ACCESS_KEY" \
            --from-literal=OHDP_AWS_ACCESS_KEY_ID="$AWS_PIPELINE_ACCESS_KEY_ID" \
            --from-literal=OHDP_AWS_SECRET_ACCESS_KEY="$AWS_PIPELINE_SECRET_ACCESS_KEY" \
            --from-literal=OHDP_OPENAQ_API_KEY="$OPENAQ_API_KEY" \
            --from-literal=OHDP_CDC_APP_TOKEN="$CDC_APP_TOKEN" \
            --from-literal=OHDP_OPENMETADATA_JWT="$OPENMETADATA_JWT" \
            --from-literal=OHDP_SNOWFLAKE_PAT="$SNOWFLAKE_PIPELINE_PAT" \
            --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$SNOWFLAKE_PIPELINE_PRIVATE_KEY"
          # Streamlit queries Snowflake directly with the OHDP_PIPELINE
          # role/key — the same identity the pipeline writes with, which is
          # ADR-0015's documented privilege trade-off, unchanged by ADR-0019.
          upsert bi streamlit-snowflake \
            --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$SNOWFLAKE_PIPELINE_PRIVATE_KEY"
          # Cube queries Snowflake directly too, same role/key as
          # streamlit-snowflake above.
          upsert data cube-snowflake \
            --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$SNOWFLAKE_PIPELINE_PRIVATE_KEY"
          # OHDP_ANTHROPIC_API_KEY is what the chat agent bills against
          # (docs/chatbot.md §4). Without it /api/chat answers 503 and the rest
          # of the app still works, which is the intended degradation.
          upsert app hub-api-secrets \
            --from-literal=OHDP_OPENMETADATA_JWT="$OPENMETADATA_JWT" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=OIDC_CLIENT_SECRET="$OIDC_CLIENT_SECRET" \
            --from-literal=OHDP_ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          # Open WebUI's externally-issued half. OPENAI_API_KEY is the Anthropic
          # key: Open WebUI has no native Anthropic client and talks to
          # https://api.anthropic.com/v1 through its OpenAI-compatible surface
          # (values/open-webui.yaml). The generated half — DATABASE_URL and
          # WEBUI_SECRET_KEY — is the `openwebui-db` Secret from platform-base.
          upsert app openwebui-secrets \
            --from-literal=OPENAI_API_KEY="$ANTHROPIC_API_KEY" \
            --from-literal=GOOGLE_CLIENT_SECRET="$OPENWEBUI_OIDC_CLIENT_SECRET"

          # Open WebUI's MCP connection to the OpenMetadata catalog
          # (values/open-webui.yaml). OM_MCP_BOT_TOKEN is the key name that
          # file's secretKeyRef expects.
          upsert app openmetadata-mcp-secret \
            --from-literal=OM_MCP_BOT_TOKEN="$OPENWEBUI_OPENMETADATA_MCP_TOKEN"

          # OHDP_SNOWFLAKE_PRIVATE_KEY is the RSA key pair's private half
          # (PKCS#8 PEM) — Snowflake SERVICE users don't accept password auth,
          # so this is what the SQL connector authenticates with. The REST
          # catalog uses the PAT instead (ADR-0019). Terraform generates both;
          # publish the key with:
          #   terraform output -raw snowflake_private_key | gh secret set SNOWFLAKE_PIPELINE_PRIVATE_KEY
          # To rotate, force-replace the key and re-run the two steps above:
          #   terraform apply -replace=tls_private_key.pipeline

          # oauth2-proxy (ADR-0007). platform-base owns this Secret and generates
          # `cookie-secret`; we merge the Google client creds into it. --type merge
          # preserves cookie-secret, and Helm's 3-way merge leaves these keys alone
          # on later `helm upgrade platform-base` runs.
          patch=$(printf '{"data":{"client-id":"%s","client-secret":"%s"}}' \
            "$(printf %s "$DAGSTER_OIDC_CLIENT_ID" | base64 -w0)" \
            "$(printf %s "$DAGSTER_OIDC_CLIENT_SECRET" | base64 -w0)")
          kubectl -n data patch secret oauth2-proxy-secret --type merge -p "$patch"

          # Same trick, second release: the Streamlit auth wall's own Google
          # OAuth client (separate from Dagster's — different redirect URI).
          patch=$(printf '{"data":{"client-id":"%s","client-secret":"%s"}}' \
            "$(printf %s "$STREAMLIT_OIDC_CLIENT_ID" | base64 -w0)" \
            "$(printf %s "$STREAMLIT_OIDC_CLIENT_SECRET" | base64 -w0)")
          kubectl -n bi patch secret oauth2-proxy-streamlit-secret --type merge -p "$patch"

          # Third release: the hub app's wall. Same trick again.
          patch=$(printf '{"data":{"client-id":"%s","client-secret":"%s"}}' \
            "$(printf %s "$APP_OIDC_CLIENT_ID" | base64 -w0)" \
            "$(printf %s "$APP_OIDC_CLIENT_SECRET" | base64 -w0)")
          kubectl -n app patch secret oauth2-proxy-app-secret --type merge -p "$patch"

      - name: OpenSearch
        if: inputs.deploy_all || inputs.deploy_opensearch
        run: make -C platform/helm opensearch

      - name: OpenMetadata
        if: inputs.deploy_all || inputs.deploy_openmetadata
        run: make -C platform/helm openmetadata

      - name: GraphQL authz proxy
        if: inputs.deploy_all || inputs.deploy_proxy
        run: make -C platform/helm proxy

      - name: Dagster monitoring dashboard
        if: inputs.deploy_all || inputs.deploy_dagster_monitoring
        run: make -C platform/helm dagster-monitoring

      - name: oauth2-proxy (Google login wall — Dagster + monitoring)
        if: inputs.deploy_all || inputs.deploy_oauth2_proxy
        run: make -C platform/helm oauth2-proxy

      - name: Dagster
        if: inputs.deploy_all || inputs.deploy_dagster
        run: make -C platform/helm dagster TAG="$TAG"

      - name: Cube
        if: inputs.deploy_all || inputs.deploy_cube
        run: make -C platform/helm cube TAG="$TAG"

      - name: Streamlit
        if: inputs.deploy_all || inputs.deploy_streamlit
        run: make -C platform/helm streamlit TAG="$TAG"

      - name: oauth2-proxy (Google login wall — Streamlit)
        if: inputs.deploy_all || inputs.deploy_oauth2_proxy_streamlit
        run: make -C platform/helm oauth2-proxy-streamlit

      - name: hub-api
        if: inputs.deploy_all || inputs.deploy_hub_api
        run: make -C platform/helm hub-api TAG="$TAG"

      - name: oauth2-proxy (Google login wall — hub app)
        if: inputs.deploy_all || inputs.deploy_oauth2_proxy_app
        run: make -C platform/helm oauth2-proxy-app

      # mcp-cube before open-webui: the tool-server connection is registered by
      # hand in Open WebUI's admin UI, so the Service should already exist.
      - name: Cube MCP server
        if: inputs.deploy_all || inputs.deploy_mcp_cube
        run: make -C platform/helm mcp-cube TAG="$TAG"

      - name: Open WebUI (chat UI — Google SSO is its own, not an oauth2-proxy wall)
        if: inputs.deploy_all || inputs.deploy_open_webui
        env:
          OPENWEBUI_OIDC_CLIENT_ID: ${{ secrets.OPENWEBUI_OIDC_CLIENT_ID || secrets.DAGSTER_OIDC_CLIENT_ID }}
        run: make -C platform/helm open-webui

      - name: Pods
        if: always()
        run: kubectl get pods -A
