name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-packages --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy packages apps data
      - name: Tests
        run: uv run pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: dbt parse (no warehouse needed)
        working-directory: data/dbt
        env:
          OHDP_DUCKDB_PATH: ci_warehouse.duckdb
        run: |
          uvx --from dbt-duckdb dbt deps
          uvx --from dbt-duckdb dbt parse --target ci

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint web (skips cleanly until scaffolded)
        working-directory: apps/web
        run: |
          if [ -f next.config.js ] || [ -f next.config.mjs ] || [ -f next.config.ts ]; then
            npm ci && npm run lint
          else
            echo "apps/web not scaffolded yet — skipping"
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint charts
        working-directory: platform/helm
        run: |
          helm lint charts/hub-api --set image.tag=0.0.0-dev
          helm lint charts/graphql-authz-proxy
      - name: Render charts
        working-directory: platform/helm
        run: |
          helm template hub-api charts/hub-api --set image.tag=0.0.0-dev >/dev/null
          helm template gqlproxy charts/graphql-authz-proxy >/dev/null
      - name: Assert the authz allowlist stays default-deny
        working-directory: platform/helm
        run: |
          pip install --quiet pyyaml
          python3 .ci/assert_authz_policy.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format
        run: terraform -chdir=platform/terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform -chdir=platform/terraform init -backend=false -input=false
          terraform -chdir=platform/terraform validate

  # deploy: added in M1 — build images, push, kubectl apply against the VM.
