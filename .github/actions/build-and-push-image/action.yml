name: Build and push image
description: Build one Docker image from the repo root, push it to GHCR under sha-<12> + latest tags (or re-tag an unchanged earlier build as sha-<12>), and record a step summary.

inputs:
  name:
    description: Image name (e.g. ohdp-hub-api). Pushed as ghcr.io/<owner>/<name>.
    required: true
  dockerfile:
    description: Dockerfile path, relative to the repo root. Build context is always the repo root.
    required: true
  push:
    description: Push to the registry (set false when running under act).
    required: false
    default: "true"
  build_args:
    description: Optional space/newline-separated KEY=VALUE build args to pass to Docker build.
    required: false
    default: ""
  reuse_tag:
    description: >-
      Tag of an earlier build whose inputs haven't changed since (e.g. sha-<12>
      of the last successfully built commit). If set and that image exists, the
      build is skipped and this commit's sha-<12> tag is pointed at it instead,
      so every commit on main still has a tag for every image. Falls back to a
      normal build if the image is missing or push is off.
    required: false
    default: ""

outputs:
  image:
    description: Fully-qualified image reference, without tag.
    value: ${{ steps.meta.outputs.image }}
  tag:
    description: Tag pushed for this build (sha-<12> of the commit).
    value: ${{ steps.meta.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Compute image reference
      id: meta
      shell: bash
      env:
        # Lowercased — GHCR rejects uppercase in a repository path, and
        # github.repository_owner preserves the account's original casing.
        OWNER: ${{ github.repository_owner }}
        NAME: ${{ inputs.name }}
      run: |
        set -euo pipefail
        owner=$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')
        tag="sha-${GITHUB_SHA::12}"
        echo "image=ghcr.io/${owner}/${NAME}" >> "$GITHUB_OUTPUT"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        echo "Building ghcr.io/${owner}/${NAME}:${tag}"

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # A manifest-only copy inside GHCR — seconds, no layers pulled. `latest` is
    # deliberately left alone: it already points at the newest real build.
    - name: Reuse unchanged image
      id: reuse
      if: inputs.reuse_tag != '' && inputs.push == 'true'
      shell: bash
      env:
        SRC: ${{ steps.meta.outputs.image }}:${{ inputs.reuse_tag }}
        DST: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
      run: |
        set -euo pipefail
        if docker buildx imagetools inspect "${SRC}" >/dev/null 2>&1; then
          docker buildx imagetools create --tag "${DST}" "${SRC}"
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "Unchanged — tagged ${SRC} as ${DST}"
        else
          echo "::warning::${SRC} not found in the registry — building instead"
        fi

    - name: Build and push
      if: steps.reuse.outputs.reused != 'true'
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: ${{ inputs.push == 'true' }}
        build-args: ${{ inputs.build_args }}
        tags: |
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          ${{ steps.meta.outputs.image }}:latest
        cache-from: type=gha,scope=${{ inputs.name }}
        cache-to: type=gha,mode=max,scope=${{ inputs.name }}
        provenance: false

    - name: Summary
      shell: bash
      run: |
        {
          echo "### ${{ inputs.name }}"
          echo ""
          echo "    ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          echo ""
          echo "pushed: ${{ inputs.push }}"
          if [ "${{ steps.reuse.outputs.reused }}" = "true" ]; then
            echo ""
            echo "unchanged — re-tagged from \`${{ inputs.reuse_tag }}\`, not rebuilt"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
