name: Sync external secrets
description: Upsert the externally-issued Kubernetes Secrets from repo secrets. Idempotent; needs setup-kube first and platform-base already installed (it owns oauth2-proxy-secret and the namespaces).

inputs:
  secrets:
    description: The caller's `toJSON(secrets)`. Passed whole so the key list lives only here, not duplicated in every workflow that syncs.
    required: true

runs:
  using: composite
  steps:
    # The only externally-issued secrets. Endpoint + bucket are non-secret and
    # live in data/ohdp-pipeline-config (platform-base).
    #
    # Repo secrets this reads, and where they come from:
    #   SPACES_ACCESS_KEY_ID / SPACES_SECRET_ACCESS_KEY
    #   SNOWFLAKE_PIPELINE_PAT / AWS_PIPELINE_ACCESS_KEY_ID / AWS_PIPELINE_SECRET_ACCESS_KEY
    #   -- the lakehouse credentials Terraform issues (ADR-0019): a Snowflake
    #   PAT for the Iceberg REST catalog, and an IAM key for the one thing that
    #   can't use it (dlt's Parquet writes into the external volume).
    #     terraform output -raw snowflake_pipeline_pat         | gh secret set SNOWFLAKE_PIPELINE_PAT
    #     terraform output -raw aws_pipeline_access_key_id     | gh secret set AWS_PIPELINE_ACCESS_KEY_ID
    #     terraform output -raw aws_pipeline_secret_access_key | gh secret set AWS_PIPELINE_SECRET_ACCESS_KEY
    #   OPENAQ_API_KEY, CDC_APP_TOKEN, OPENMETADATA_JWT
    #   OPENFDA_API_KEY -- optional; openfda_source works unauthenticated too,
    #     just at a lower rate limit (ohdp_orchestration/defs/openfda/README.md).
    #     An unset repo secret resolves to "", which upsert below still writes
    #     fine; ohdp_ingestion.openfda.source treats an empty key the same as
    #     no key at all.
    #   STRIPE_SECRET_KEY
    #   STRIPE_PRICE_ID -- the Stripe monthly Pro Price ID sold by
    #     /api/billing/checkout (hub_api.billing). Injected into
    #     hub-api-secrets as OHDP_STRIPE_PRICE_ID (settings.stripe_price_id).
    #   STRIPE_WEBHOOK_SECRET -- signs POST /api/billing/webhook/stripe
    #     (settings.stripe_webhook_secret). From the Dashboard's webhook
    #     endpoint config, same bare-name convention as STRIPE_SECRET_KEY.
    #   DAGSTER_OIDC_CLIENT_ID / DAGSTER_OIDC_CLIENT_SECRET -- hub-api's own
    #     OIDC client (hub_api.auth) reuses the same Google client, which must
    #     list https://app.open-health-data-platform.org/auth/callback among
    #     its authorized redirect URIs.
    #   OPENROUTER_API_KEY -- OpenAI-spec backend for the Hub UI model picker
    #     (docs/chatbot.md §4a). Without it the OpenRouter-backed models simply
    #     don't appear; the rest of the app works normally.
    #   HUB_GITHUB_ISSUES_TOKEN -- fine-grained PAT, issues:write on
    #     OHDP_GITHUB_ISSUES_REPO and nothing else. It backs a tool a chat user
    #     can trigger (hub_api.issues), so its scope is the blast radius —
    #     never a classic PAT, never `repo`. Create at
    #     github.com/settings/personal-access-tokens, then:
    #       gh secret set HUB_GITHUB_ISSUES_TOKEN
    #   TOOLS_AUTH_TOKEN -- shared bearer for hub-api's /tools app. Rotate by
    #     re-running a deploy after `gh secret set TOOLS_AUTH_TOKEN`.
    #   SNOWFLAKE_PIPELINE_PRIVATE_KEY -- see the note at the end of the script.
    #   MOTHERDUCK_TOKEN -- Cube's compute (ADR-0029). A MotherDuck
    #     service-account token, from app.motherduck.com → Settings → Access
    #     Tokens:
    #       gh secret set MOTHERDUCK_TOKEN
    - name: Upsert external secrets
      shell: bash
      # Passed as an env var rather than interpolated into the script body, so
      # no credential lands in the rendered step script on disk.
      env:
        SECRETS_JSON: ${{ inputs.secrets }}
      run: |
        set -euo pipefail
        # A repo secret that isn't set is absent from the JSON; read it as "".
        s() { jq -r --arg k "$1" '.[$k] // ""' <<<"$SECRETS_JSON"; }
        upsert() { kubectl -n "$1" create secret generic "$2" "${@:3}" \
          --dry-run=client -o yaml | kubectl apply -f -; }

        # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY are the *Spaces* pair, for
        # Dagster's S3ComputeLogManager (dagster.yaml) — it takes no
        # access-key config and reads them off the process environment. The
        # lakehouse never competes for them: dlt takes its S3 credentials as
        # explicit config (OHDP_AWS_*), and the catalog is reached with a
        # Snowflake token rather than an AWS signature (ADR-0019).
        upsert data ohdp-pipeline-secrets \
          --from-literal=OHDP_SPACES_ACCESS_KEY_ID="$(s SPACES_ACCESS_KEY_ID)" \
          --from-literal=OHDP_SPACES_SECRET_ACCESS_KEY="$(s SPACES_SECRET_ACCESS_KEY)" \
          --from-literal=AWS_ACCESS_KEY_ID="$(s SPACES_ACCESS_KEY_ID)" \
          --from-literal=AWS_SECRET_ACCESS_KEY="$(s SPACES_SECRET_ACCESS_KEY)" \
          --from-literal=OHDP_AWS_ACCESS_KEY_ID="$(s AWS_PIPELINE_ACCESS_KEY_ID)" \
          --from-literal=OHDP_AWS_SECRET_ACCESS_KEY="$(s AWS_PIPELINE_SECRET_ACCESS_KEY)" \
          --from-literal=OHDP_OPENAQ_API_KEY="$(s OPENAQ_API_KEY)" \
          --from-literal=OHDP_OPENFDA_API_KEY="$(s OPENFDA_API_KEY)" \
          --from-literal=OHDP_CDC_APP_TOKEN="$(s CDC_APP_TOKEN)" \
          --from-literal=OHDP_OPENMETADATA_JWT="$(s OPENMETADATA_JWT)" \
          --from-literal=OHDP_SNOWFLAKE_PAT="$(s SNOWFLAKE_PIPELINE_PAT)" \
          --from-literal=OHDP_SNOWFLAKE_PRIVATE_KEY="$(s SNOWFLAKE_PIPELINE_PRIVATE_KEY)"
        # Cube queries MotherDuck (ADR-0029), which reads the CURATED
        # Iceberg catalog itself — Cube holds no Snowflake credential.
        upsert data cube-motherduck \
          --from-literal=OHDP_MOTHERDUCK_TOKEN="$(s MOTHERDUCK_TOKEN)"
        # OHDP_GITHUB_TOKEN/OHDP_TOOLS_AUTH_TOKEN back /tools/report_issue.
        # Unset, that endpoint answers 503 and nothing else changes.
        # OHDP_OIDC_CLIENT_ID/_SECRET back hub-api's own sign-in
        # (hub_api.auth) — without them /auth/login answers 503 rather than
        # half-working.
        # OHDP_OPENAI_API_BASE_URLS/_KEYS enable OpenAI-spec backends such as
        # OpenRouter. They live in their own Secret so the key is rotated
        # without touching hub-api-secrets.
        upsert app openrouter-secrets \
          --from-literal=OHDP_OPENAI_API_BASE_URLS="https://openrouter.ai/api/v1" \
          --from-literal=OHDP_OPENAI_API_KEYS="$(s OPENROUTER_API_KEY)"
        upsert app hub-api-secrets \
          --from-literal=OHDP_OPENMETADATA_JWT="$(s OPENMETADATA_JWT)" \
          --from-literal=STRIPE_SECRET_KEY="$(s STRIPE_SECRET_KEY)" \
          --from-literal=OHDP_STRIPE_PRICE_ID="$(s STRIPE_PRICE_ID)" \
          --from-literal=STRIPE_WEBHOOK_SECRET="$(s STRIPE_WEBHOOK_SECRET)" \
          --from-literal=OHDP_OIDC_CLIENT_ID="$(s DAGSTER_OIDC_CLIENT_ID)" \
          --from-literal=OHDP_OIDC_CLIENT_SECRET="$(s DAGSTER_OIDC_CLIENT_SECRET)" \
          --from-literal=OHDP_GITHUB_TOKEN="$(s HUB_GITHUB_ISSUES_TOKEN)" \
          --from-literal=OHDP_TOOLS_AUTH_TOKEN="$(s TOOLS_AUTH_TOKEN)"
        # OHDP_SNOWFLAKE_PRIVATE_KEY is the RSA key pair's private half
        # (PKCS#8 PEM) — Snowflake SERVICE users don't accept password auth,
        # so this is what the SQL connector authenticates with. The REST
        # catalog uses the PAT instead (ADR-0019). Terraform generates both;
        # publish the key with:
        #   terraform output -raw snowflake_private_key | gh secret set SNOWFLAKE_PIPELINE_PRIVATE_KEY
        # To rotate, force-replace the key and re-run a deploy:
        #   terraform apply -replace=tls_private_key.pipeline

        # oauth2-proxy (ADR-0007). platform-base owns this Secret and generates
        # `cookie-secret`; we merge the Google client creds into it. --type merge
        # preserves cookie-secret, and Helm's 3-way merge leaves these keys alone
        # on later `helm upgrade platform-base` runs.
        patch=$(printf '{"data":{"client-id":"%s","client-secret":"%s"}}' \
          "$(printf %s "$(s DAGSTER_OIDC_CLIENT_ID)" | base64 -w0)" \
          "$(printf %s "$(s DAGSTER_OIDC_CLIENT_SECRET)" | base64 -w0)")
        kubectl -n data patch secret oauth2-proxy-secret --type merge -p "$patch"
