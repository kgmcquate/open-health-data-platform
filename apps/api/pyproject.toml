[project]
name = "ohdp-api"
version = "0.0.0"
description = "Hub API — chat orchestration, entitlements, Stripe webhooks"
requires-python = ">=3.12"
dependencies = [
    "ohdp-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "stripe>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_api"]
