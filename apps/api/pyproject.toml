[project]
name = "ohdp-api"
version = "0.0.0"
description = "Hub API — chat orchestration, entitlements, Stripe webhooks"
requires-python = ">=3.12"
dependencies = [
    "ohdp-shared",
    "anthropic>=1.5",
    "authlib>=1.3",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    # Pinned to the 4.x line: `mcp.http_app()`, the `@mcp.tool` decorator and
    # `ToolError` passthrough are what ohdp_mcp is written against.
    "fastmcp>=4.0,<5",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-jose[cryptography]>=3.3",
    "stripe>=10.0",
    "pyyaml>=6.0.3",
    "jsonpath-ng>=1.8.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
ohdp-shared = { path = "../../packages/shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_api", "src/ohdp_agent", "src/ohdp_mcp"]

# Lint/format: repo-root ruff.toml.
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
