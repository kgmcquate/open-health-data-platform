# Tool connections a model can be given (docs/chatbot.md §4a). Nothing here is
# attached to any model by default — see models.yaml's own comment for the
# full picture, including the in-process "cube"/"literature"/"catalog" ids
# that resolve to code (ohdp_agent.loop.CUBE_TOOLSET/LITERATURE_TOOLSET, and
# `_catalog_toolset` for "catalog"; resolved by hub_api.models, not this file)
# rather than a connection, since they need no URL or headers. `mcp-cube` and
# `mcp-openmetadata` below are the MCP-connection alternatives to "cube" and
# "catalog" specifically — list at most one of each pair for a given model.
#
# A connection here does nothing by itself: assign its `id` to a model's
# `tools:` list in models.yaml for a model to actually get it.
#
# `${NAME}` in any string value is resolved against .env (hub_api.tool_connections,
# ohdp_shared.env_file_values) — NAME can be an OHDP_-prefixed or a bare name,
# whatever the variable is actually called there. Never put a literal secret
# in this file; it is committed.
#
# Two connection types:
#
#   type: mcp — a server that already speaks MCP.
#     - id: weather
#       type: mcp
#       url: https://example.com/mcp
#       headers:
#         Authorization: "Bearer ${WEATHER_MCP_TOKEN}"
#
#   type: openapi — any REST API with an OpenAPI spec. Wrapped as an
#   in-process MCP server via FastMCP.from_openapi (fastmcp is already a
#   dependency here — ohdp_mcp is built on it) — no separate server to run.
#     - id: petstore
#       type: openapi
#       spec_url: https://petstore.example.com/openapi.json
#       base_url: https://petstore.example.com
#       headers:
#         X-Api-Key: "${PETSTORE_API_KEY}"

connections:
  - id: ohdp-tools
    type: openapi
    spec_url: "http://hub-api.app.svc.cluster.local:8000/tools/openapi.json"
    base_url: "http://hub-api.app.svc.cluster.local:8000"
    # Proves to hub_api.issues.get_reporter that the caller is the chat
    # surface itself (source="chatbot") — not tied to any one human, since
    # there's no per-user identity on this cluster-internal path. Kept out of
    # the model's reach entirely: see the include_in_schema=False note next
    # to that dependency for why it can't just be an OpenAPI parameter here.
    headers:
      Authorization: "Bearer ${OHDP_TOOLS_AUTH_TOKEN}"

  - id: mcp-cube
    type: mcp
    url: "http://mcp-cube.app.svc.cluster.local:8000/mcp"
    # OHDP_MCP_AUTH_TOKEN is generated by platform-base and shared with the
    # mcp-cube chart via the mcp-cube-secret Secret (both charts read it) —
    # see platform/helm/charts/mcp-cube/templates/NOTES.txt.
    headers:
      Authorization: "Bearer ${OHDP_MCP_AUTH_TOKEN}"

  - id: mcp-openmetadata
    type: mcp
    url: "http://openmetadata.meta.svc.cluster.local:8585/mcp"
    # Reuses the same bot JWT hub-api already gets via hub-api-secrets for
    # OpenMetadata's REST API (settings.openmetadata_jwt) — OM's JwtFilter
    # validates it the same way regardless of endpoint, so there's no need
    # for a second, separately-wired token here.
    headers:
      Authorization: "Bearer ${OHDP_OPENMETADATA_JWT}"
