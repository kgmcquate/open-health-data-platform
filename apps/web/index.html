<!doctype html>
<html lang="en" data-theme="ohdp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Open Health Data Platform</title>
    <meta
      name="description"
      content="Population-level public health data, queryable through one semantic layer — dashboards, literature, and a curated AI chatbot."
    />
    <!-- Stripe.js for the embedded Checkout page. Loaded directly from
         js.stripe.com (never bundled — a PCI requirement). The standard `v3`
         build is required for `stripe.initEmbeddedCheckout(...)`. `defer` so it
         doesn't block first render; the Checkout page is only mounted after a
         click. -->
    <script defer src="https://js.stripe.com/v3/"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
