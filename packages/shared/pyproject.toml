[project]
name = "ohdp-shared"
version = "0.0.0"
description = "Shared config, types, and redacting logger for the Open Health Data Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohdp_shared"]
