<svg width="1221" height="184" viewBox="8 8 1221 184" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Health Data Platform logo (horizontal)</title>
  <desc id="desc">Single-line horizontal lockup: circular chart mark followed by the full name on one line.</desc>

  <defs>
    <linearGradient id="ringGradient" x1="10" y1="10" x2="190" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="0.55" stop-color="#2C9BF1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient1" x1="70" y1="105" x2="95" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="1" stop-color="#2C9BF1"/>
    </linearGradient>
    <linearGradient id="barGradient2" x1="95" y1="97" x2="118" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1AA3B8"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient3" x1="118" y1="82" x2="140" y2="155" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1F7AE0"/>
    </linearGradient>
  </defs>

  <g transform="translate(2 2)">
    <circle cx="98" cy="98" r="76" fill="#F2F9FF"/>
    <line x1="60" y1="132" x2="136" y2="132" stroke="#B8D6F8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <g opacity="0.22" stroke="#7AAEDC" stroke-width="1.5">
      <line x1="62" y1="47" x2="134" y2="47"/>
      <line x1="62" y1="66" x2="134" y2="66"/>
      <line x1="62" y1="85" x2="134" y2="85"/>
      <line x1="62" y1="104" x2="134" y2="104"/>
      <line x1="62" y1="123" x2="134" y2="123"/>
    </g>
    <circle cx="98" cy="98" r="62" stroke="url(#ringGradient)" stroke-width="11" fill="none"/>
    <rect x="70" y="100" width="18" height="32" rx="6" fill="url(#barGradient1)"/>
    <rect x="93" y="85" width="18" height="47" rx="6" fill="url(#barGradient2)"/>
    <rect x="116" y="70" width="18" height="62" rx="6" fill="url(#barGradient3)"/>
  </g>

  <text x="222" y="128" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.8">
    <tspan fill="#334155">Open </tspan><tspan fill="#1F7AE0">Health </tspan><tspan fill="#475569">Data </tspan><tspan fill="#14B8A6">Platform</tspan>
  </text>
</svg>
