<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Health Data Platform logo</title>
  <desc id="desc">A modern healthcare and data platform logo with a circular three-bar chart icon and updated typography.</desc>

  <defs>
    <linearGradient id="ringGradient" x1="54" y1="50" x2="238" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="0.55" stop-color="#2C9BF1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient1" x1="108" y1="160" x2="140" y2="228" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="1" stop-color="#2C9BF1"/>
    </linearGradient>
    <linearGradient id="barGradient2" x1="145" y1="150" x2="175" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1AA3B8"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient3" x1="182" y1="140" x2="212" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1F7AE0"/>
    </linearGradient>
  </defs>

  <g transform="translate(32 20)">
    <circle cx="160" cy="180" r="116" fill="#F2F9FF"/>

    <line x1="92" y1="240" x2="228" y2="240" stroke="#B8D6F8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <g opacity="0.22" stroke="#7AAEDC" stroke-width="2">
      <line x1="96" y1="84" x2="224" y2="84"/>
      <line x1="96" y1="120" x2="224" y2="120"/>
      <line x1="96" y1="156" x2="224" y2="156"/>
      <line x1="96" y1="192" x2="224" y2="192"/>
      <line x1="96" y1="228" x2="224" y2="228"/>
    </g>

    <circle cx="160" cy="180" r="96" stroke="url(#ringGradient)" stroke-width="18" fill="none"/>

    <rect x="102" y="182" width="28" height="58" rx="10" fill="url(#barGradient1)"/>
    <rect x="146" y="158" width="28" height="82" rx="10" fill="url(#barGradient2)"/>
    <rect x="190" y="136" width="28" height="104" rx="10" fill="url(#barGradient3)"/>
  </g>

  <g transform="translate(330 58)">
    <text x="0" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.8" fill="#334155">Open</text>
    <text x="196" y="108" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.8" fill="#1F7AE0">Health</text>

    <text x="0" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.6" fill="#475569">Data</text>
    <text x="160" y="208" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.6" fill="#14B8A6">Platform</text>

    <rect x="2" y="242" width="390" height="10" rx="5" fill="url(#ringGradient)" opacity="0.92"/>
  </g>
</svg>
