<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open Health Data Platform mark</title>
  <desc id="desc">An icon-only mark with a circular chart and three bars for Open Health Data Platform.</desc>

  <defs>
    <linearGradient id="ringGradient" x1="90" y1="80" x2="420" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="0.55" stop-color="#2C9BF1"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient1" x1="180" y1="250" x2="230" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F7AE0"/>
      <stop offset="1" stop-color="#2C9BF1"/>
    </linearGradient>
    <linearGradient id="barGradient2" x1="230" y1="235" x2="280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1AA3B8"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="barGradient3" x1="280" y1="200" x2="330" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1F7AE0"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="196" fill="#F2F9FF"/>

  <line x1="160" y1="340" x2="352" y2="340" stroke="#B8D6F8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

  <g opacity="0.22" stroke="#7AAEDC" stroke-width="4">
    <line x1="170" y1="120" x2="342" y2="120"/>
    <line x1="170" y1="170" x2="342" y2="170"/>
    <line x1="170" y1="220" x2="342" y2="220"/>
    <line x1="170" y1="270" x2="342" y2="270"/>
    <line x1="170" y1="320" x2="342" y2="320"/>
  </g>

  <circle cx="256" cy="256" r="160" stroke="url(#ringGradient)" stroke-width="28" fill="none"/>

  <rect x="170" y="256" width="48" height="84" rx="16" fill="url(#barGradient1)"/>
  <rect x="228" y="218" width="48" height="122" rx="16" fill="url(#barGradient2)"/>
  <rect x="286" y="178" width="48" height="162" rx="16" fill="url(#barGradient3)"/>
</svg>
